# Checks, on every pull request and every push to master. They need only the code, the records and the plate
# model (1 MB), so they take about a minute and grow slowly with the world: the typecheck, the
# validator (schema, references, vocabularies, licenses, chronology, plate frames) and the unit
# tests. Building the world, and drawing it, happen elsewhere: build.yml when master changes or
# a pull request changes how the world is built, nightly.yml nightly.
name: Checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/world/importers/requirements.txt

      - name: Install
        run: |
          npm ci
          python -m pip install -r tools/world/importers/requirements.txt

      - uses: actions/cache@v6
        with:
          path: .cache/datasets
          key: plate-model-${{ hashFiles('world/manifest.yaml') }}

      # Where each located record falls on the plate model. Each answer is kept on its own, so
      # a run asks pyGPlates only about locations it has not seen; the newest run's set is
      # restored and saved again with whatever it added.
      - uses: actions/cache@v6
        with:
          path: .cache/import/points@*.json
          key: points-${{ hashFiles('world/manifest.yaml', 'tools/world/importers/**') }}-${{ github.run_id }}
          restore-keys: points-${{ hashFiles('world/manifest.yaml', 'tools/world/importers/**') }}-

      - name: Fetch the plate model
        run: npm run fetch -- src:paleomap-plate-model

      - name: Typecheck
        run: npm run typecheck

      - name: Validate the world
        run: npm run validate

      # Side by side, each in its own process; the life scene generator's test needs more than
      # Node's default heap.
      - name: Unit tests
        run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
