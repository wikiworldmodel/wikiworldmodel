# CI for the world and the viewer: fetch pinned datasets, validate (the contradiction fixture
# must fail), build twice and compare, run unit tests, then drive the viewer in Chromium and
# compare its renders with the goldens.
name: CI

on:
  push:
  pull_request:

jobs:
  world-and-viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/world/importers/requirements.txt

      - name: Install
        run: |
          npm ci
          python -m pip install -r tools/world/importers/requirements.txt

      - uses: actions/cache@v4
        with:
          path: .cache/datasets
          key: datasets-${{ hashFiles('world/manifest.yaml') }}

      - name: Fetch pinned datasets
        run: npm run fetch

      - name: Typecheck
        run: npm run typecheck

      - name: Validate the world
        run: npm run validate

      - name: The contradiction fixture must fail validation
        run: |
          if npm run validate -- --world tools/world/test/fixtures/contradiction --no-frames; then
            echo "the contradictory fixture validated" >&2
            exit 1
          fi

      - name: Build the world
        run: npm run build:world

      - name: Unit tests (includes building twice and comparing)
        run: npm test

      - name: Build the viewer
        run: npm run build:viewer

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
          retention-days: 7
