# The viewer, drawn in Chromium and compared with its golden images: the globe, the city drawn
# the fast way, and the city at full quality. Drawing in software takes minutes a view, so this
# runs nightly and by hand, never on a pull request. A failure means a picture changed: look at
# the diffs it uploads, and update the goldens if the change was meant.
name: Render

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        project: [globe, city, city-views]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/world/importers/requirements.txt

      - name: Install
        run: |
          npm ci
          python -m pip install -r tools/world/importers/requirements.txt

      - uses: actions/cache@v6
        with:
          path: .cache/datasets
          key: datasets-${{ hashFiles('world/manifest.yaml') }}

      - uses: actions/cache@v6
        with:
          path: .cache/import
          key: import-${{ hashFiles('world/manifest.yaml', 'world/snapshots/**', 'tools/world/importers/**', 'tools/world/src/**', 'world/generators/**') }}

      - name: Fetch, build the world and the viewer
        run: |
          npm run fetch
          npm run build:world
          npm run build:viewer

      - name: Draw and compare (${{ matrix.project }})
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=${{ matrix.project }} --global-timeout=7200000

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: render-${{ matrix.project }}
          path: test-results
          retention-days: 7
