# The city at full quality against its goldens: shadows, occlusion, bloom and fine meshes. In
# software (SwiftShader, as the goldens were made) a view takes minutes, so this runs apart from
# CI: on changes to what the city is drawn from, nightly, and on demand. It does not block a pull
# request; a failure here means a render changed.
name: City views

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    paths:
      - 'viewer/src/gl/**'
      - 'viewer/src/city/**'
      - 'viewer/test/e2e/city-views.spec.ts'
      - 'viewer/test/golden/rome-*'
      - 'core/city.ts'
      - 'world/generators/city/**'
      - 'world/generators/rome/**'
      - 'world/entities/rome/**'
      - 'world/snapshots/**'
      - 'tools/world/src/build/city.ts'
      - 'tools/world/src/build/ground.ts'
      - '.github/workflows/city-views.yml'
  pull_request:
    paths:
      - 'viewer/src/gl/**'
      - 'viewer/src/city/**'
      - 'viewer/test/e2e/city-views.spec.ts'
      - 'viewer/test/golden/rome-*'
      - 'core/city.ts'
      - 'world/generators/city/**'
      - 'world/generators/rome/**'
      - 'world/entities/rome/**'
      - 'world/snapshots/**'
      - 'tools/world/src/build/city.ts'
      - 'tools/world/src/build/ground.ts'
      - '.github/workflows/city-views.yml'

concurrency:
  group: city-views-${{ github.ref }}
  cancel-in-progress: true

jobs:
  views:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/world/importers/requirements.txt

      - name: Install
        run: |
          npm ci
          python -m pip install -r tools/world/importers/requirements.txt

      - uses: actions/cache@v6
        with:
          path: .cache/datasets
          key: datasets-${{ hashFiles('world/manifest.yaml') }}

      - uses: actions/cache@v6
        with:
          path: .cache/import
          key: import-${{ hashFiles('world/manifest.yaml', 'world/snapshots/**', 'tools/world/importers/**', 'tools/world/src/**', 'world/generators/**') }}

      - name: Fetch, build the world and the viewer
        run: |
          npm run fetch
          npm run build:world
          npm run build:viewer

      - name: The city's views (full quality)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=city-views --global-timeout=6000000

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: city-views-results
          path: test-results
          retention-days: 7
