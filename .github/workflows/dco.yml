# The Developer Certificate of Origin: every commit in a pull request carries a Signed-off-by line
# (`git commit -s`), certifying that its author may contribute it under the project's licenses
# (CONTRIBUTING.md, "Pull requests"). Merge commits are left out. It reads only commit messages, so
# it runs on forks' pull requests with no secrets.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off each commit with \`git commit -s\`; \`git rebase --signoff $BASE\` adds it to commits already made, then push with --force-with-lease."
            exit 1
          fi
          echo "Every commit is signed off."
