# Properties: the type of value a claim takes, its unit, how it changes over time, and the
# kinds of subject it applies to. Validators reject properties, methods and confidence
# words that are not declared here.
#
#   type        time | point | ref | text (with language) | string | quantity | color | geometry
#               | form (a geometry is taken from a dataset in the manifest: { from: src:…,
#               names: […] } names the rows that belong to the subject, { from: src:…,
#               elements: […] } the elements of a snapshot; a form says how a generator should
#               raise a structure: { type: temple, order: corinthian, … }, core/city.ts)
#   unit        for quantities: values are written in this unit
#   values      for strings: the values allowed, each with what it means
#   interp      how a state changes between known points: step | linear | log-time | slerp
#   moment      evidence about a moment: it feeds the date solver (section 5) and is never
#               interpolated
#   applies_to  kinds (with their children; a phase is of its entity's kind), or `moments`
#               (kinds with moment: true) or `lasting` (the others, and every phase);
#               omitted means any subject
#   ref_types   for refs: the record types the value may name
#   inverse     for refs: a claim whose value is another record is a relation, and the
#               build derives its inverse under this name
properties:
  name:
    type: text
    interp: step
    description: >-
      A name, with its language. `valid` says when the name was in use; the viewer labels a
      thing by the name in use at the time shown, or by today's name where it had none.
  date:
    type: time
    moment: true
    applies_to: [moments]
    description: When a moment happened.
  start:
    type: time
    moment: true
    applies_to: [lasting]
    description: When an entity or phase began.
  end:
    type: time
    moment: true
    applies_to: [lasting]
    description: When an entity or phase ended. With no end claim and nothing implying one, it still holds.
  earlier_than:
    type: time
    moment: true
    applies_to: [moments]
    description: A moment happened before this time (a terminus ante quem).
  later_than:
    type: time
    moment: true
    applies_to: [moments]
    description: A moment happened after this time (a terminus post quem).
  location:
    type: point
    interp: step
    description: A point, with the frame its coordinates were measured in.
  frame:
    type: ref
    ref_types: [frame]
    interp: step
    inverse: carries
    description: >-
      The frame the subject's geometry lives in, and moves with. Like a relation, it is
      stored once; the build derives the inverse on the entity that defines the frame.
  identified_as:
    type: string
    applies_to: [occurrence]
    description: The taxon name as identified in the original record.
  formation:
    type: string
    applies_to: [occurrence, sample, ecosystem]
    description: The geological formation the fossils or the sample come from.
  evidence:
    type: string
    applies_to: [occurrence, sample]
    values:
      tidal-rhythmite: Thin layers laid down with the tides, whose counts give the days in a month or the months in a year.
      cyclostratigraphy: Rhythmic beds paced by the slow cycles of the Earth's orbit and axis, whose periods give the rate of its precession.
      body-fossil: The remains of an organism, such as a bone, a shell, a leaf or a cell.
      trace-fossil: Something an organism left, such as a track, a burrow or a root trace.
      palynomorph: Spores or pollen.
      biosignature: A chemical or isotopic sign of life, or a structure that may be biological, with no organism preserved.
      in-situ-forest: Trees fossilized where they grew, standing stumps or rooted trunks.
      ancient-dna: A genome, or part of one, sequenced from the remains of an individual.
      archaeobotanical: Plant remains from where people lived or worked, such as charred grain and chaff, impressions in pottery, or starch grains and phytoliths on tools and in sediment.
      zooarchaeological: Animal remains from where people lived or worked, read for how people dealt with the animals, such as who was killed at what age, body size, burial, or dung and pens.
      inscription: Signs of a writing system or its forerunners, cut, painted or pressed into something that has lasted, such as a clay tablet, a bone, a pot or a rock face.
    description: What kind of evidence an occurrence or a sample is.
  ancestry:
    type: text
    applies_to: [occurrence, event/dispersal, event/admixture]
    description: >-
      What a source reads in genomes of who an individual's ancestors were, or of what a dispersal
      or a mixing left in later people, in words.
  cargo:
    type: text
    applies_to: [event/shipwreck]
    description: What a ship carried when it was lost, in words.
  voyage:
    type: text
    applies_to: [event/shipwreck]
    description: >-
      Where a ship had sailed from and where it was bound when it was lost, in words. It is often an inference from
      the cargo, and the note says so.
  cover:
    type: string
    interp: step
    applies_to: [event/transition]
    values:
      microbial-crust: Microbial crusts on the land, the first life to cover it.
      land-plants: Low plants on damp ground, such as bryophyte-like plants and the first small vascular plants.
      forests: Trees, and forests in the wetter climates.
      grasslands: Grasses that dominate open country in seasonally dry climates.
      reefs: Reefs built by animals or by microbes and algae, in warm shallow seas.
    description: >-
      The kind of cover a transition brought to the land or the shallow seas. The biome field
      draws that cover from the transition's start on (never before it), spreading until its end.
  taxon_rank:
    type: string
    applies_to: [taxon]
    description: A taxon's rank in the classification it comes from, such as genus or family.
  body_plan:
    type: string
    interp: step
    applies_to: [taxon]
    description: >-
      Which body plan in world/plans draws a taxon and everything below it in the tree that says
      nothing else: its general shape. Sizes come from the taxon's other claims, and the details of
      a plan are the generator's guess.
  body_form:
    type: body-form
    interp: step
    applies_to: [taxon]
    description: >-
      How a taxon's body differs from the one it inherits from its nearest node above: parts changed,
      added or taken away by name, in proportions of its own length, as docs/FORMS.md describes. What it
      does not say is the parent's. Whatever a source does not support is a machine's reconstruction, and
      the claim says which.
  body_length:
    type: quantity
    unit: m
    interp: step
    applies_to: [taxon]
    description: The length of a grown animal, from snout to the end of its tail or, for a turtle, of its shell.
  hip_height:
    type: quantity
    unit: m
    interp: step
    applies_to: [taxon]
    description: How high a grown animal's hips stand off the ground.
  body_mass:
    type: quantity
    unit: kg
    interp: step
    applies_to: [taxon]
    description: The mass of a grown animal.
  plant_height:
    type: quantity
    unit: m
    interp: step
    applies_to: [taxon]
    description: How tall a grown plant stands.
  posture:
    type: string
    interp: step
    applies_to: [taxon]
    values:
      biped: Stands and walks on its hind legs.
      quadruped: Stands and walks on all four legs, held under the body.
      facultative-quadruped: Stands on its hind legs or on all four.
      sprawling: Holds its legs out to the side, belly near the ground.
      floating: Floats at the surface of still water.
      upright: A plant with an upright stem.
    description: How an animal stands, or how a plant grows.
  diameter:
    type: quantity
    unit: km
    interp: step
    applies_to: [landform/impact-crater]
    description: Diameter.
  area:
    type: quantity
    unit: km²
    interp: linear
    applies_to: [large-igneous-province]
    description: Area of the outcrop.
  color:
    type: color
    applies_to: [period]
    description: The standard colour of a period on its chart, as #RRGGBB.
  surface:
    type: string
    interp: step
    applies_to: [body/planet]
    values:
      magma: Molten rock open to the sky, a magma ocean.
      crust-and-magma: Crust over magma, remelted in places.
      ocean: Oceans of liquid water, with land where the geography has it.
      bare-rock: Rock, with no oceans.
    description: What covers most of a planet's surface.
  atmosphere:
    type: string
    interp: step
    applies_to: [body/planet]
    values:
      rock-vapour: Vaporized rock, thousands of degrees hot.
      steam: A thick atmosphere of water vapour, its clouds hiding the surface.
    description: The kind of atmosphere, where it changes how the planet looks from space.
  ice_reach:
    type: quantity
    unit: °
    interp: step
    applies_to: [event/glaciation]
    description: >-
      The lowest latitude, north or south, at which ice reached sea level during a glaciation,
      as sea ice or as grounded ice, in degrees: 0 is ice to the equator.
  day_length:
    type: quantity
    unit: h
    interp: step
    applies_to: [occurrence, sample, event/astronomical]
    description: >-
      How long the day was when a rock or a fossil formed: the solar day, unless the claim's
      note says otherwise. The tides slow the Earth's spin, so the day has grown longer.
  moon_distance:
    type: quantity
    unit: Earth radii
    interp: step
    applies_to: [occurrence, sample, event/astronomical]
    description: >-
      The mean distance from the Earth to the Moon, the semi-major axis of the Moon's orbit,
      when a rock or a fossil formed, in Earth radii of 6378 km. The tides push the Moon away.
  sea_level:
    type: quantity
    unit: m
    interp: step
    applies_to: [event, period]
    description: >-
      Global mean sea level at the height or the depth of an event or a period, in metres relative to today's:
      a glacial lowstand is negative. `valid` says when, where the source does.
  sea_level_change:
    type: quantity
    unit: m
    interp: step
    applies_to: [event, period]
    description: How far global mean sea level moved over an event, in metres; a fall is negative. The note says over what span.
  warming:
    type: quantity
    unit: °C
    interp: step
    applies_to: [event]
    description: >-
      How far global surface temperature moved over an event, in degrees Celsius; a cooling is negative.
      `valid` says over what years, and the note against what reference period.
  settlement_area:
    type: quantity
    unit: ha
    interp: step
    applies_to: [settlement]
    description: >-
      The area a settlement covered, in hectares, at the moment `valid` gives. Sources measure
      different things, the settled area, the walled area or a protected zone, and the note says which.
  population:
    type: quantity
    unit: people
    interp: step
    applies_to: [settlement]
    description: >-
      How many people lived in a settlement at the moment `valid` gives. For a city without a census
      this is an estimate from its area, houses or food supply, and the estimates differ widely.
  decipherment:
    type: string
    interp: step
    applies_to: [development/script]
    values:
      undeciphered: Its signs cannot be read, and the language they write is not known.
      partly-deciphered: Some of its signs can be read, and a few words or phrases understood.
      deciphered: Its signs can be read, and the language they write is known.
    description: Whether a writing system can be read today, as a source states it.
  territory:
    type: geometry
    interp: step
    applies_to: [polity]
    # An area may be written in the claim itself, as a GeoJSON Polygon or MultiPolygon with the frame its
    # coordinates were measured in, for an outline no dataset gives (docs/STRUCTURE.md section 5).
    inline: true
    description: >-
      The land a polity held, as polygons: the rows of a dataset of borders through time that are
      this polity, each holding for the years it gives, within the polity's lifetime; or an outline
      written in the claim, holding for the claim's `valid` time or the polity's lifetime.
  footprint:
    type: geometry
    interp: step
    applies_to: [building, monument, works, open]
    description: >-
      Where a structure stands, traced on a map: the elements of a snapshot of a map database
      that are this structure. A record that names an element adopts it, and the element is no
      longer imported as a record of its own.
  height:
    type: quantity
    unit: m
    interp: step
    applies_to: [building, monument, works]
    description: The height of a structure, from the ground it stands on to its top.
  ground_level:
    type: quantity
    unit: m
    interp: step
    applies_to: [building, monument, works, open]
    description: >-
      The level of the ground or paving at a structure, in metres above sea level, in the time
      the claim is valid. The ground of antiquity lies metres below today's in the valleys.
  form:
    type: form
    interp: step
    applies_to: [building, monument, works, open/forum]
    description: >-
      What is known of a structure's architecture, as the parameters a generator raises it
      from: its type, order, number of columns and so on. What a form does not say is the
      generator's guess, and evidence mode shows it as a reconstruction.
  insulae:
    type: quantity
    unit: blocks
    interp: step
    applies_to: [open/region]
    description: >-
      The number of insulae a region counted, as the Regionary Catalogues of the fourth century
      list them. What an insula was here is disputed: possibly a unit of tenancy, not a building.
  domus:
    type: quantity
    unit: houses
    interp: step
    applies_to: [open/region]
    description: The number of domus, town houses, a region counted, as the Regionary Catalogues list them.

# Methods: how the value of a claim was established. A method's children are written
# parent/child (radiometric/ar-ar).
methods:
  radiometric:
    label: Radiometric dating
    children:
      ar-ar: { label: 40Ar/39Ar dating }
      u-pb: { label: U–Pb dating }
      pb-pb: { label: Pb–Pb dating }
      re-os: { label: Re–Os dating }
      radiocarbon: { label: Radiocarbon dating }
      luminescence: { label: Luminescence dating }
      u-series: { label: Uranium-series dating }
      esr: { label: Electron spin resonance dating }
      cosmogenic: { label: Cosmogenic nuclide burial dating }
  amino-acid:
    label: Amino acid geochronology
    description: Relative ages from how far the amino acids in fossils have racemized, read against sites of known age.
  molecular-clock:
    label: Molecular clock
    description: Dated from genetic differences between living groups, calibrated with fossils.
  ancestry-segments:
    label: Ancestry segments
    description: >-
      Dated from the lengths of the segments of one population's ancestry in another's genomes,
      which recombination shortens with each generation.
  model:
    label: Model projection
    description: Computed with a physical model, such as a model of the Sun's evolution or of galaxies' orbits.
  documentary:
    label: Documentary record
    description: >-
      Read from records made at the time of the event: mission logs, an eyewitness's diary, an
      official calendar inscribed in stone.
  historical-account:
    label: Historical account
    description: Stated by a historian or chronicler writing after the events, from earlier sources.
  tradition:
    label: Tradition
    description: >-
      Handed down rather than recorded at the time: a founding legend, or a date that later
      antiquarians reckoned from one, for example by counting the reigns of legendary kings.
  stratigraphic:
    label: Stratigraphic dating
    description: Dated by the position of the beds in a dated sequence, or by their fossils.
  dendrochronology:
    label: Tree rings
    description: Dated by matching a timber's rings to a dated sequence. The last ring kept gives a time after which the tree was felled.
  numismatic:
    label: Coins
    description: Dated by the latest coins in a deposit, which give a time after which it was left, and not its date.
  typological:
    label: Typology
    description: Dated by the style of the objects in a deposit, such as its pottery, amphorae or their stamps, against dated examples elsewhere.
  expert-estimate:
    label: Expert estimate
    description: A value a source states without the measurement behind it.
  survey:
    label: Survey
    description: Measured in the field, for example a section's coordinates.
  paleomagnetic:
    label: Palaeomagnetism
    description: A latitude or a position read from the magnetization that rocks kept from when they formed.
  compilation:
    label: Compilation
    description: Read from a database or chart that compiles the literature.
  gazetteer:
    label: Gazetteer
    description: Placed from a gazetteer's coordinates for a named place.
  plate-polygon:
    label: Plate polygon
    description: Assigned to the plate whose polygon, in the plate model, contains the present-day location.
  map-trace:
    label: Traced from a map
    description: Taken from a map or plan, its position and shape read off the sheet.
  editorial:
    label: Editorial choice
    description: Chosen by an editor, such as a representative point to place a marker.

# Confidence: a probability, or a calibrated word that stands for a range of them (the
# IPCC AR6 likelihood scale).
confidence:
  virtually-certain: [0.99, 1]
  very-likely: [0.9, 1]
  likely: [0.66, 1]
  about-as-likely-as-not: [0.33, 0.66]
  unlikely: [0, 0.33]
  very-unlikely: [0, 0.1]
  exceptionally-unlikely: [0, 0.01]
