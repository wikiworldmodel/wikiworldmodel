# Kinds: what sort of thing an entity is. Kinds form a tree: a child is written
# parent/child (event/impact), and whatever applies to a kind applies to its children.
# A new kind is a small reviewed change, proposed with the first records that need it.
#
# Rules a kind may carry:
#   moment: true   the entity is a moment at the time resolution of the world: it has one
#                  date, not a start and an end (an impact lasts seconds).
#   start: latest  a start that no claim pins, only relations or a one-sided claim, is shown
#                  at the latest time the evidence allows rather than midway between bounds:
#                  a taxon at its oldest member found (its first appearance), or unknown if
#                  nothing limits it.
kinds:
  event:
    label: Event
    description: >-
      A change that needs its own date, cause or record. Events last from seconds to
      hundreds of millions of years; relations link them to what they changed.
    children:
      impact:
        label: Impact
        description: A bolide impact.
        moment: true
      collision:
        label: Continental collision (onset)
        description: The first contact between two continental plates; the collision itself goes on for tens of millions of years.
        moment: true
      formation:
        label: Formation
        description: The formation of a body or a system, such as the Solar System, dated by its first solids.
        moment: true
      extinction:
        label: Mass extinction
        description: A mass extinction, dated by its main pulse; extinctions with several pulses say which one in a note.
        moment: true
      glaciation:
        label: Glaciation
        description: A long glaciation, such as a Snowball Earth episode, from the onset of ice to its retreat.
      transition:
        label: Earth-system transition
        description: A lasting change of the Earth system, such as the oxygenation of the atmosphere.
      spaceflight:
        label: Spaceflight
        description: An event in spaceflight, such as a launch, a landing or a spacecraft crossing a boundary.
        moment: true
      astronomical:
        label: Astronomical event
        description: A stage in the life of a star, or an encounter between galaxies; in the future, a projection.
        moment: true
      political:
        label: Political event
        description: >-
          A founding, a change of constitution, a division or a deposition: a change in how a
          state is governed, or by whom, dated to its day where the sources allow.
        moment: true
      battle:
        label: Battle
        description: A battle on land or at sea, dated to its day where the sources allow.
        moment: true
      conquest:
        label: Conquest
        description: The capture of a city or the fall of a state to another, on the day it fell.
        moment: true
  development:
    label: Development
    description: >-
      A practice or technology people developed, such as farming or writing, from its earliest
      known evidence on.
  landform:
    label: Landform
    description: A shape of the land surface or the rock below it.
    children:
      impact-crater:
        label: Impact crater
        description: The structure left by an impact, from its formation on.
      mountain-range:
        label: Mountain range
        description: An orogen or mountain range, from the start of its growth on.
  large-igneous-province:
    label: Large igneous province
    description: A very large accumulation of igneous rock, erupted over a geologically short time.
  occurrence:
    label: Fossil occurrence
    description: >-
      A taxon recorded at a locality, by body fossils, traces or other signs of life, at the
      time they formed.
    moment: true
  sample:
    label: Dated sample
    description: A rock or mineral sample at its locality, at the time it formed.
    moment: true
  taxon:
    label: Taxon
    description: >-
      A group of organisms, a species or a clade, from its origin to its extinction if it has
      died out. Its origin is no later than its oldest member found.
    start: latest
  body:
    label: Body
    description: A natural body in space, such as a planet or a moon.
    children:
      planet:
        label: Planet
        description: >-
          A planet, from the start of its accretion on. Its phases are the states of its
          surface and atmosphere, such as a magma ocean or oceans of water.
  polity:
    label: Polity
    description: >-
      A state or other political unit, from its founding to its end. Its phases are its forms
      of government, such as a kingdom that became a republic; its territory is a claim.
  settlement:
    label: Settlement
    description: A town or a city, from its founding or first settlement on; its names may change.
  plate:
    label: Tectonic plate
    description: A rigid plate of a plate model. It also defines a frame, which moves with it.
  period:
    label: Named period
    description: A named interval of time. Its boundaries are claims, with sources and alternatives, like anything else.
    children:
      eon: { label: Eon, description: The largest unit of the geologic time scale. }
      era: { label: Era, description: A subdivision of an eon. }
      period: { label: Period, description: A subdivision of an era. }
      sub-period: { label: Sub-period, description: A subdivision of a period. }
      epoch: { label: Epoch, description: A subdivision of a period. }
      sub-epoch: { label: Sub-epoch, description: A subdivision of an epoch. }
      stage: { label: Stage, description: The smallest unit of the chart; as time, an age. }
