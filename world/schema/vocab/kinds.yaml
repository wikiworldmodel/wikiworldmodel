# Kinds: what sort of thing an entity is. Kinds form a tree: a child is written
# parent/child (event/impact), and whatever applies to a kind applies to its children.
# A new kind is a small reviewed change, proposed with the first records that need it.
#
# Rules a kind may carry:
#   moment: true   the entity is a moment at the time resolution of the world: it has one
#                  date, not a start and an end (an impact lasts seconds).
#   start: latest  a start that no claim pins, only relations or a one-sided claim, is shown
#                  at the latest time the evidence allows rather than midway between bounds:
#                  a taxon at its oldest member found (its first appearance), or unknown if
#                  nothing limits it.
#   end: latest    an end given as a range is shown at the latest time the range allows: a taxon
#                  lasts to the end of the last interval it is found in.
kinds:
  event:
    label: Event
    description: >-
      A change that needs its own date, cause or record. Events last from seconds to
      hundreds of millions of years; relations link them to what they changed.
    children:
      impact:
        label: Impact
        description: A bolide impact.
        moment: true
      collision:
        label: Continental collision (onset)
        description: The first contact between two continental plates; the collision itself goes on for tens of millions of years.
        moment: true
      formation:
        label: Formation
        description: The formation of a body or a system, such as the Solar System, dated by its first solids.
        moment: true
      extinction:
        label: Mass extinction
        description: A mass extinction, dated by its main pulse; extinctions with several pulses say which one in a note.
        moment: true
      glaciation:
        label: Glaciation
        description: A long glaciation, such as a Snowball Earth episode, from the onset of ice to its retreat.
      transition:
        label: Earth-system transition
        description: A lasting change of the Earth system, such as the oxygenation of the atmosphere.
      boundary:
        label: Time-scale boundary
        description: >-
          The start of a unit of the geologic time scale, as it is defined at a stratotype (a GSSP): a level
          in a rock section or an ice core that fixes the moment.
        moment: true
      spaceflight:
        label: Spaceflight
        description: An event in spaceflight, such as a launch, a landing or a spacecraft crossing a boundary.
        moment: true
      astronomical:
        label: Astronomical event
        description: A stage in the life of a star, or an encounter between galaxies; in the future, a projection.
        moment: true
      political:
        label: Political event
        description: >-
          A founding, a change of constitution, a division or a deposition: a change in how a
          state is governed, or by whom, dated to its day where the sources allow.
        moment: true
      battle:
        label: Battle
        description: A battle on land or at sea, dated to its day where the sources allow.
        moment: true
      conquest:
        label: Conquest
        description: The capture of a city or the fall of a state to another, on the day it fell.
        moment: true
      dispersal:
        label: Dispersal
        description: >-
          People leaving a region or reaching one, dated by the earliest evidence of them there:
          when that evidence was left, which may be long after the first of them came.
        moment: true
      admixture:
        label: Admixture
        description: >-
          Interbreeding between two populations long apart, dated from what it left in genomes.
          Its date is often a range, for a pulse or for a longer stretch of gene flow.
        moment: true
      shipwreck:
        label: Shipwreck
        description: >-
          A ship lost, dated to its sinking and placed where it lies. Cargo, coins and timber date the sinking only
          loosely, and often from one side: a coin or a tree ring gives a time after which it went down. What it
          carried and where it was bound are claims of their own.
        moment: true
      hazard:
        label: Natural hazard
        moment: true
        description: >-
          An eruption, an earthquake or a tsunami, dated to when it happened and placed where it struck. The rows of a
          hazards database are of this kind (docs/STRUCTURE.md section 3.1).
  building:
    label: Building
    description: A roofed or walled structure at a place, with its own dates.
    children:
      temple: { label: Temple, description: "A temple or shrine." }
      basilica: { label: Basilica, description: "A large covered hall for law courts and business." }
      baths: { label: Baths, description: "Public baths." }
      theatre: { label: Theatre, description: "A theatre or odeon." }
      amphitheatre: { label: Amphitheatre, description: "An arena ringed by seating." }
      circus: { label: Circus, description: "A course for chariot races, or a stadium for foot races." }
      palace: { label: Palace, description: "A palace, or a great house of the court." }
      civic: { label: Civic building, description: "A senate house, archive, office or other seat of government." }
      market: { label: Market, description: "A market hall or a group of shops." }
      warehouse: { label: Warehouse, description: "Storehouses (horrea)." }
      barracks: { label: Barracks, description: "A military camp or a station of the watch." }
      house: { label: House, description: "A house or a block of apartments that the sources name." }
      tomb: { label: Tomb, description: "A tomb or mausoleum." }
      other: { label: Structure, description: "A structure that the map shows and does not classify." }
  monument:
    label: Monument
    description: A structure raised to be seen, with no interior to speak of.
    children:
      arch: { label: Arch, description: "An honorific arch." }
      column: { label: Column, description: "An honorific column." }
      obelisk: { label: Obelisk, description: "An obelisk." }
      statue: { label: Statue, description: "A statue on its base." }
      fountain: { label: Fountain, description: "A monumental fountain." }
      other: { label: Monument, description: "A monument that the map shows and does not classify." }
  works:
    label: Public works
    description: A structure that serves a city, stretching along a line.
    children:
      wall: { label: City wall, description: "A city wall." }
      gate: { label: City gate, description: "A gate in a city wall." }
      road: { label: Street, description: "A road or street." }
      aqueduct: { label: Aqueduct, description: "An aqueduct, on arches or underground." }
      sewer: { label: Sewer, description: "A sewer or drain." }
      bridge: { label: Bridge, description: "A bridge." }
  open:
    label: Open space
    description: A stretch of ground that a city leaves unbuilt, or a named part of it.
    children:
      forum: { label: Forum, description: "A public square with its surrounding buildings." }
      square: { label: Square, description: "A public square." }
      garden: { label: Garden, description: "A garden or park (horti)." }
      cemetery: { label: Cemetery, description: "A burial ground." }
      enclosure: { label: Enclosure, description: "A walled enclosure, such as a yard for animals." }
      water: { label: Water, description: "A river or a pool." }
      island: { label: Island, description: "An island in a river." }
      district: { label: District, description: "A named neighbourhood." }
      region: { label: Region of the city, description: "One of the fourteen regions into which Augustus divided Rome." }
  ecosystem:
    label: Ecosystem
    description: >-
      A community of organisms at a place over a span of time, as a formation's fossils record
      it. Its members are taxa with occurrences in that formation.
  development:
    label: Development
    description: >-
      A practice or technology people developed, such as farming or writing, from its earliest
      known evidence on.
    children:
      script:
        label: Writing system
        description: >-
          A script, from the earliest find that attests it on. It may be older than that find, on
          materials that have not lasted. Its start names the find, and competing starts name
          competing finds.
  industry:
    label: Archaeological industry
    description: >-
      A way of making tools that archaeologists recognize across sites, such as the Oldowan, from
      its first known occurrence to its last. It names a pattern in the artefacts, not a people:
      who made it is a claim of its own. Its origin is no later than its oldest member found.
    start: latest
    end: latest
  artefact:
    label: Artefact
    description: >-
      Something hominins made or used, or a group of such things from one layer of one site, at
      the time it was made or left.
    moment: true
    children:
      moved:
        label: Object that moved
        description: >-
          A made thing, or a group of them, that has stood or been kept in more than one place, such
          as an obelisk, an inscribed stone or a museum piece. Unlike a find at the moment it was left,
          it lasts: its phases say where it was and when it moved.
        moment: false
  landform:
    label: Landform
    description: A shape of the land surface or the rock below it.
    children:
      impact-crater:
        label: Impact crater
        description: The structure left by an impact, from its formation on.
      mountain-range:
        label: Mountain range
        description: An orogen or mountain range, from the start of its growth on.
  large-igneous-province:
    label: Large igneous province
    description: A very large accumulation of igneous rock, erupted over a geologically short time.
  occurrence:
    label: Dated find
    description: >-
      Something found at a locality and dated: a taxon recorded by body fossils, traces or other signs
      of life at the time they formed, or an ancient genome, an archaeobotanical sample or an
      inscription. Its `evidence` claim says which.
    moment: true
  sample:
    label: Dated sample
    description: A rock or mineral sample at its locality, at the time it formed.
    moment: true
  taxon:
    label: Taxon
    description: >-
      A group of organisms, a species or a clade, from its origin to its extinction if it has
      died out. Its origin is no later than its oldest member found.
    start: latest
    end: latest
  body:
    label: Body
    description: A natural body in space, such as a planet or a moon.
    children:
      planet:
        label: Planet
        description: >-
          A planet, from the start of its accretion on. Its phases are the states of its
          surface and atmosphere, such as a magma ocean or oceans of water.
  language:
    label: Language
    description: >-
      A language, placed where a catalogue of languages puts it today. The rows of a language catalogue are of this
      kind (docs/STRUCTURE.md section 3.1).
  polity:
    label: Polity
    description: >-
      A state or other political unit, from its founding to its end. Its phases are its forms
      of government, such as a kingdom that became a republic; its territory is a claim.
  person:
    label: Person
    description: >-
      A named human being, from birth (start) to death (end). What they held is a phase of the
      life: a ruler's phases might be before, reign and after, tiling the lifetime, and the reign
      is joined to its polity by held-office. A person whose birth no claim pins is shown from the
      latest time the evidence allows, usually the first date of the reign; one whose death is
      not known says so, end: unknown, or the life would seem to go on.
    start: latest
  settlement:
    label: Settlement
    description: A town or a city, from its founding or first settlement on; its names may change.
  plate:
    label: Tectonic plate
    description: A rigid plate of a plate model. It also defines a frame, which moves with it.
  period:
    label: Named period
    description: A named interval of time. Its boundaries are claims, with sources and alternatives, like anything else.
    children:
      eon: { label: Eon, description: The largest unit of the geologic time scale. }
      era: { label: Era, description: A subdivision of an eon. }
      period: { label: Period, description: A subdivision of an era. }
      sub-period: { label: Sub-period, description: A subdivision of a period. }
      epoch: { label: Epoch, description: A subdivision of a period. }
      sub-epoch: { label: Sub-epoch, description: A subdivision of an epoch. }
      stage: { label: Stage, description: The smallest unit of the chart; as time, an age. }
