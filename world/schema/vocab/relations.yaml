# Relation types. A relation is a claim whose value is another record: it has sources,
# valid time, confidence, status and rank like any claim. It is stored once, in its
# subject's file, and the build derives the inverse.
#
#   family    temporal | spatial | structural | lineage | causal | participation | evidential
#   inverse   the derived relation, as seen from the target
#   from, to  the kinds the subject and the target may be (with their children); omitted
#             means any
#   time      the constraints the relation adds to the date solver, each "a to b": b − a
#             lies in the relation's lag if `lag: true` (default lag: zero to unbounded),
#             else b is not earlier than a. `self` is the subject, `other` the target,
#             each at its start or end; a moment's start and end are its date.
relations:
  before:
    family: temporal
    inverse: after
    description: The subject ends before the target starts; a lag of 0 means it ends as the target starts.
    time: [{ from: self.end, to: other.start, lag: true }]
  after:
    family: temporal
    inverse: before
    description: The subject starts after the target ends.
    time: [{ from: other.end, to: self.start, lag: true }]
  during:
    family: temporal
    inverse: contains
    description: The subject lies within the target's interval.
    time: [{ from: other.start, to: self.start }, { from: self.end, to: other.end }]
  part-of:
    family: structural
    inverse: has-part
    description: A part lies within its whole, in time as well as space.
    time: [{ from: other.start, to: self.start }, { from: self.end, to: other.end }]
  member-of:
    family: structural
    inverse: has-member
    description: >-
      A member of a group, such as an occurrence of its taxon. A member lies within its
      group's lifetime, so a taxon's oldest fossil bounds its origin.
    time: [{ from: other.start, to: self.start }, { from: self.end, to: other.end }]
  descends-from:
    family: lineage
    inverse: gave-rise-to
    from: [taxon]
    to: [taxon]
    description: A group nested in the target in the tree of life. It arose no earlier than the target.
    time: [{ from: other.start, to: self.start }]
  caused-by:
    family: causal
    inverse: caused
    to: [event, large-igneous-province]
    description: The target caused the subject. A cause precedes its effect.
    time: [{ from: other.start, to: self.start, lag: true }]
  made-by:
    family: participation
    inverse: made
    from: [artefact, industry]
    to: [taxon]
    description: >-
      The taxon taken to have made a find or an industry, usually from fossils in the same layers.
      It is an inference, and it adds no constraint on time: a tradition can outlast one of its
      makers, and an attribution can be wrong.
  evidenced-by:
    family: evidential
    inverse: evidence-for
    from: [event, development/script]
    to: [occurrence]
    description: >-
      An occurrence that a source takes as evidence of an event, such as a fossil for a transition
      in the history of life, or of a writing system, such as the inscription that first attests it.
      It adds no constraint on time, because evidence can be contested: an event's competing start
      claims say which evidence each of them rests on, and name it as their value where the date is
      the occurrence's.
  held-office:
    family: participation
    inverse: office-held-by
    from: [person]
    to: [polity]
    description: >-
      A person's rule or office in a polity, such as a pharaoh's or an emperor's. The subject is the
      phase of the life in which it was held, usually `subject: "@reign"`, and the target the polity
      or the phase of it whose office it was; the note names the office. That term lies within the
      polity's lifetime, so a reign can bound the dates of a state. It is the term and not the life
      that does: a person is not a polity, and may be born before the state began or outlive it.
    time: [{ from: other.start, to: self.start }, { from: self.end, to: other.end }]
