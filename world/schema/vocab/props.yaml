# Claim properties and the type of value each one takes.
props:
  date: { type: time, description: When an instantaneous entity happened. }
  start: { type: time, description: When an entity or phase began. }
  end: { type: time, description: When an entity or phase ended. }
  date_before: { type: time, description: An instantaneous entity happened no later than this (terminus ante quem). }
  date_after: { type: time, description: An instantaneous entity happened no earlier than this (terminus post quem). }
  location: { type: point, description: Present-day latitude/longitude, in the entity's frame. }
  taxon: { type: string, description: Accepted taxon name. }
  identified_as: { type: string, description: Taxon name as identified in the original publication. }
  formation: { type: string, description: Geological formation. }
  diameter_km: { type: number, description: Diameter in kilometres. }
  area_km2: { type: number, description: Area in square kilometres. }
