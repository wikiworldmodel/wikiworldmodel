id: alt:earliest-life/isua-stromatolites
type: alternative
kind: hypothesis
group: alt:earliest-life
title: Isua stromatolites (Nutman et al. 2016)
description: >-
  The 1–4 cm conical and domical structures in 3,700-Myr-old metacarbonate rocks of the Isua
  supracrustal belt, Greenland, are stromatolites built by microbial communities (Nutman et al.
  2016). Allwood et al. (2018) reinterpret them as deformation structures formed long after
  burial, which is why the default picture does not count them.
