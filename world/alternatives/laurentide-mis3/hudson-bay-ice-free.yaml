group: alt:laurentide-mis3
title: Hudson Bay ice-free for a short time (PaleoMIST's minimal scenario)
description: >-
  The ice sheet retreats from Hudson Bay after Heinrich Event 5, about 45,000 years ago, leaving it ice-free for a few
  thousand years before ice returns by 40,000 years ago, so that the bay's finite radiocarbon dates can be taken at face
  value (Gowan et al. 2021). It changes the ice-sheet field and no record's dates.
