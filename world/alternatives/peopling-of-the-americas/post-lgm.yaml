type: alternative
kind: hypothesis
group: alt:peopling-of-the-americas
title: After the Last Glacial Maximum
description: >-
  People waited out the ice in Beringia and came south after it, about 17.5–14.6 ka by the genomes
  (Moreno-Mayar et al. 2018) and about 16 ka by mitochondria (Llamas et al. 2016), consistent with the
  earliest securely dated sites (Potter et al. 2018), Cooper's Ferry among them (Davis et al. 2019).
  The seeds that date the White Sands footprints would then be thousands of years too old from
  old carbon in the water (Madsen et al. 2022; Rachal et al. 2024).
