id: alt:peopling-of-the-americas/pre-lgm
type: alternative
kind: hypothesis
group: alt:peopling-of-the-americas
title: Before the Last Glacial Maximum
description: >-
  People were in North America by about 23 ka, and so must have come before the ice closed the way:
  the footprints at White Sands, dated by seeds (Bennett et al. 2021), then by pollen and luminescence
  (Pigati et al. 2023) and by the lake's own record (Holliday et al. 2025). A model of dates from 42
  sites puts people there before, during and after the maximum (Becerra-Valdivia and Higham 2020),
  and Chiquihuite Cave in Mexico perhaps by 33–31 ka (Ardelean et al. 2020; contested by Chatters et
  al. 2022).
