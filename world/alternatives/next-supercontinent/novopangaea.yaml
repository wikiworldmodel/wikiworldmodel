id: alt:next-supercontinent/novopangaea
type: alternative
kind: scenario
group: alt:next-supercontinent
title: Novopangaea (Nield)
description: >-
  The Pacific closes, which Davies et al. (2018) call extroversion. The Atlantic goes on opening and
  ends as the ocean around the new supercontinent, which forms on the far side of the globe from
  Pangaea, 200 million years from now. The East African Rift becomes an ocean on the way. Roy Livermore
  gave it the name in a BBC documentary, according to Duarte et al. (2018); the scenario here is that of
  Nield (2007), a book not read, as Davies et al. describe and rebuild it. Huang et al. (2022, National Science Review 9, nwac205) predict a closure of the Pacific from a
  mantle model too, under the name Amasia; Steinberger (2022, nwac253) finds that prediction uncertain.
