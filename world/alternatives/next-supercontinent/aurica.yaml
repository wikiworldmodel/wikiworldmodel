id: alt:next-supercontinent/aurica
type: alternative
kind: scenario
group: alt:next-supercontinent
title: Aurica (Duarte et al. 2018)
description: >-
  The Atlantic and the Pacific both close (Duarte et al. 2018), which Davies et al. (2018) call a
  combination. A rift across Asia opens a new ocean to make room, and the supercontinent forms near the
  far side of the globe from Pangaea, as the last of the Atlantic closes: in about 300 million years,
  by the first rough estimate, and in 250 as the same group later rebuilt it (Davies et al. 2018).
  Way et al. (2021) model its climate.
