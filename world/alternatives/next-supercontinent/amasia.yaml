id: alt:next-supercontinent/amasia
type: alternative
kind: scenario
group: alt:next-supercontinent
title: Amasia (Mitchell et al. 2012)
description: >-
  The Arctic closes, which Mitchell et al. (2012) call orthoversion: a supercontinent forms about 90°
  from the last one. All the continents but Antarctica drift north and gather around the North Pole,
  200 million years from now, while the Atlantic, Pacific and Indian oceans stay open (Davies et al.
  2018, who set the date themselves). With Antarctica left out, it is not strictly a complete
  supercontinent. Way et al. (2021) model its climate.
