id: alt:next-supercontinent/pangaea-proxima
type: alternative
kind: scenario
group: alt:next-supercontinent
title: Pangaea Proxima (Scotese)
description: >-
  The Atlantic closes, which Davies et al. (2018) call introversion. Subduction zones spread along the
  eastern coasts of the Americas, the Atlantic goes on widening until its mid-ocean ridge is subducted
  about 100 million years from now, and then it closes. North America meets Africa again, and the new
  supercontinent encloses what is left of the Indian Ocean, 250 million years from now (Scotese's
  PALEOMAP Project, where it was first named Pangea Ultima).
