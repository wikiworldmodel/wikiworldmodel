id: alt:megafauna-causes/both
type: alternative
kind: hypothesis
group: alt:megafauna-causes
title: People and climate together
description: >-
  Neither alone: extinction came where human impacts and a marked change of climate coincided, and
  which mattered more differs by region and species (Barnosky et al. 2004; Broughton & Weitzel 2018;
  Metcalf et al. 2016; Saltré et al. 2019). In this picture each region's extinction has both
  causes.
