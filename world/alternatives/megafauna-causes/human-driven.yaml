id: alt:megafauna-causes/human-driven
type: alternative
kind: hypothesis
group: alt:megafauna-causes
title: Driven by people (overkill)
description: >-
  Modern humans drove the extinctions as they spread, by hunting and perhaps by fire and habitat
  change. Extinction is most severe where they were the first hominins, and comes after they arrive
  (Sandom et al. 2014; Svenning et al. 2024). In this picture each region's extinction is caused by
  the arrival of people there. Most in this camp no longer hold to a rapid "blitzkrieg" on first
  contact, and in South America Prates & Perez (2021) tie the decline to the spread of fluted
  points, not to first arrival.
