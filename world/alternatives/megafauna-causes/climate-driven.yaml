id: alt:megafauna-causes/climate-driven
type: alternative
kind: hypothesis
group: alt:megafauna-causes
title: Driven by climate
description: >-
  Climate and the changes in vegetation and water that followed it drove the extinctions, and people
  played at most a marginal part: the Younger Dryas in North America (Stewart et al. 2021),
  interstadial warmings in northern Eurasia (Cooper et al. 2015; Lord et al. 2020), deglaciation in
  the tropical Andes (Rozas-Davila et al. 2016), and failing rainfall in Sahul (Hocknull et al.
  2020). The sources argue this for their own regions and taxa, not for the world as one. No source
  read argues it for New Zealand, so there the settlers remain the cause.
