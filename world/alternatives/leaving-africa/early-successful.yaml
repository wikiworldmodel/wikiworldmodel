id: alt:leaving-africa/early-successful
type: alternative
kind: hypothesis
group: alt:leaving-africa
title: An early dispersal that lasted
description: >-
  Modern humans left Africa and spread far into Asia between about 120 and 70 ka, reaching Sahul by
  65 ka, and at least a little of their ancestry survives: at least 2% of the genomes of present-day
  Papuans (Pagani et al. 2016). Fuyan Cave in China (Liu et al. 2015), Tam Pà Ling in Laos (Freidline
  et al. 2023) and Madjedbebe in Australia (Clarkson et al. 2017) are its evidence; Bae et al. (2017)
  set out the case. The main dispersal came later, and most ancestry outside Africa comes from it.
