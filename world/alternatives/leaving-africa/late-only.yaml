id: alt:leaving-africa/late-only
type: alternative
kind: hypothesis
group: alt:leaving-africa
title: Only the late dispersal lasted
description: >-
  Everyone outside Africa today descends from one dispersal, about 55–50 ka (O'Connell et al. 2018).
  Earlier people did leave Africa, but their lines died out: Australians and New Guineans show no
  substantial ancestry from them (Mallick et al. 2016; Malaspinas et al. 2016), and older bones
  outside Africa come from other populations (Sümer et al. 2025). The teeth of Fuyan Cave belong to
  the Holocene (Sun et al. 2021), and Madjedbebe's dates reflect disturbed sand (O'Connell et al.
  2018), so that East Asia and Sahul were reached about 50–45 ka.
