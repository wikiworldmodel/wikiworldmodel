id: alt:ipcc-ar6-scenarios/ssp370
type: alternative
kind: scenario
group: alt:ipcc-ar6-scenarios
title: SSP3-7.0, high emissions
description: >-
  High greenhouse gas emissions: CO2 emissions roughly double from current levels by 2100. The 7.0 is
  the approximate radiative forcing in 2100, in watts per square metre, and SSP3 the socio-economic
  pathway behind it (IPCC 2021, Box SPM.1). Warming over 2081–2100 is very likely 2.8–4.6 °C above
  1850–1900, and sea level in 2100 likely 0.55–0.90 m above 1995–2014.
