id: field:earth/moon-distance
type: field
title: Distance of the Moon
quantity: mean distance from the Earth to the Moon
unit: Earth radii
description: >-
  How far off the Moon was, from the same records as the length of the day, wherever a study gives it
  or a note shows how it follows: the tides carry the Moon slowly away. Each point is one study's
  estimate, drawn with the band it gives.
grid: { kind: series }
time: { lo: 3.22 Ga, hi: 0 Ma }
data:
  from: src:williams-2000-earth-rotation
  prop: moon_distance
  band: the uncertainty or the bounds each study gives
basis: evidence
interp: linear
