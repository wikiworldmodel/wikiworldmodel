id: field:earth/cropland
type: field
title: Cropland
quantity: cropland in the whole world
unit: km²
description: >-
  How much of the world's land was cropland, in the baseline of HYDE 3.2.1, in km² as its table gives it. From 1960 it
  follows the FAO's "arable land and permanent crops". Before 1960 it is mostly not measured: the authors modelled cropland
  per person back in time from 1960, country by country, with historical statistics for some large countries, and
  multiplied it by their population, so it leans on that series too. Their range, which they say should be treated with care, is 0.05–0.49 million km² around 0.21 in 4000 BCE,
  0.48–3.33 around 1.45 in 1 CE, 2.20–3.67 around 2.93 in 1700 and 15.7–16.0 around 15.9 in 2015 (their million hectares,
  divided by 100). Its steps are 1,000 years long up to 1 CE, 100 years up to 1700, 10 years up to 2000 and then one year,
  and it stops at 2015. It has no cropland at 10,000 or 9000 BCE. Between steps the line is simply straight, not an
  estimate.
grid: { kind: series }
# HYDE labels its first step -10000, and the axis reads that as it stands: a year out, which these numbers cannot tell.
time: { lo: -10000, hi: 2015 CE }
data:
  from: src:hyde-3.2.1-world-land-use
  columns: { time: year, value: cropland_km2 }
  time_unit: CE
basis: reconstruction
interp: linear
