id: field:earth/genera-through-time
type: field
title: Animal genera, fossil record
quantity: genera of animals sampled in each stage
unit: genera
description: >-
  How many genera of animals the Paleobiology Database has occurrences of in each stage of the
  Phanerozoic. A count of what has been found and entered, uncorrected for how much rock of each age
  survives: the great rise towards the present is partly that. It stops with the Pleistocene: the
  Holocene's stages have almost nothing dated to them so finely (one genus in the Greenlandian).
grid: { kind: series }
time: { lo: 538.8 Ma, hi: 0.0117 Ma }
data:
  from: src:pbdb-diversity-2026-11-04
  columns: { time: max_ma, time_to: min_ma, value: sampled_in_bin }
  time_unit: Ma
basis: evidence
interp: linear
