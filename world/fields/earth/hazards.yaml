id: field:earth/hazards
type: field
title: Eruptions, earthquakes and tsunamis
description: >-
  The significant eruptions, earthquakes and tsunamis of NOAA's databases, each drawn around its year.
  Old events are far less complete than recent ones: fewer rings in the past does not mean fewer events.
grid: { kind: rows }
time: { lo: 4360 BCE, hi: 2026 CE }
data:
  from: src:noaa-hazards-2026-11-04
  as: hazards
basis: evidence
# A single value at each place and time: nobody gave its uncertainty (docs/STRUCTURE.md section 3.2).
spread: unknown
# Its rows are claims (docs/STRUCTURE.md section 3.1), keyed by the database's kind and its own number.
rows:
  kind: event/hazard
  key: "{kind}:{id}"
  claims:
    name: { column: name, as: text }
    date: { column: year, as: year, method: compilation }
    location: { column: [lat, lon], as: point, method: compilation }
