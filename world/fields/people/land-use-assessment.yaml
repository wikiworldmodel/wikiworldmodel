id: field:people/land-use-assessment
type: field
kind: areas
title: Land use, as archaeologists assess it
quantity: how much of a region's land each way of life used
description: >-
  How widespread foraging, pastoralism, shifting cultivation and continuous farming were in each of 146 regions of the
  world at ten times from 10,000 BP to 1850 CE, and whether each had dense urban centres, as 255 archaeologists answered
  the ArchaeoGLOBE survey in 2018 and its co-authors settled a consensus. A level is none, minimal (under 1% of the land),
  common (1–20%) or widespread (over 20%). The regions are units of the survey, formed from today's states and provinces,
  not cultural areas, and an answer generalizes over a region larger than anyone's fieldwork. It is the human landscape's
  evidence at the scale of regions: what the anthromes put in a place is set beside it (model:people/lifeways), and where
  the two disagree the panel says so. Between its times the nearest holds, and 1850 CE holds to the present.
frame: frame:earth/present-day
grid: { kind: rows }
time: { lo: 8000 BCE, hi: 1850 CE }
data:
  from: src:archaeoglobe-2019-assessments
  as: land-use-assessment
  regions: src:archaeoglobe-2019-regions
basis: reconstruction
# The least, median and most of the answers for each use, around the consensus.
spread: band
interp: step
params:
  # How finely the regions are drawn into the grid of the anthromes, in degrees, and how far a cell of land outside every
  # region's outline (a gap of the simplified coast) may look for one, in cells: choices of how to serve it.
  res_deg: 0.0833333
  reach_cells: 12
uncertainty: >-
  Each region and time has the least and most answer beside the consensus, and the experts' own scores of how well its
  land use is known (quality, 0–2) and of their expertise (0–2); the panel shows them.
