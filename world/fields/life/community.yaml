id: field:life/community
type: field
title: Who lived where
quantity: taxa on each patch of land in each stage, with how sure each is
unit: taxa
description: >-
  What could stand at a place and a time: for each stage of the chart and each 4° patch of land, a list of taxa from the
  fossils of the Paleobiology Database, reduced by the build. A taxon with a row within a few hundred km at that time is
  recorded here. One that can be reached overland, in a like climate, is in the region: its being here is an inference. Where
  nothing of a kind is known within reach, the nearest clade that has it stands in, and that is a guess at what sort of
  thing lived here. The fossil record leans heavily to Europe and North America, so a rich list partly shows who has been
  digging. The sea costs far more to cross than land, on the land of that time, so a seaway divides what it should.
frame: frame:earth/present-day
grid: { kind: rows }
time: { lo: 541 Ma, hi: 0 Ma }
data:
  from: src:pbdb-land-2026-11-05
  as: community
basis: reconstruction
interp: step
params:
  grid_deg: 4
  graph_deg: 2
  # How far a row counts: a choice, and what the tiers mean.
  here_km: 350
  region_km: 2200
  kernel_km: 900
  # A km of sea is as far as this many of land: shallow, then deep.
  shallow_cost: 4
  deep_cost: 14
  shallow_m: 220
  # A row dated only to a span longer than this says too little of any one stage; and a row dated to a span longer
  # than the next is left out for a taxon that has rows dated better.
  longest_span: 30
  tight_span: 10
  longest_bin: 8
  shortest_bin: 0.5
  quotas: { canopy: 8, under: 4, float: 2, big: 10, middle: 10, small: 6, air: 4, tiny: 4, water: 4 }
  standins: { canopy: 2, under: 1, big: 2, middle: 2, small: 1, air: 1, tiny: 1 }
  big_m: 3
  small_m: 0.5
  tiny_m: 0.1
source:
  ref: src:pbdb-land-2026-11-05
  loc: rows of the snapshot
