      - ref: src:platner-ashby-1929
        loc: "s.v. Antoninus et Faustina, Templum, p. 13"
        quote: "After the death of Antoninus himself in 161, the temple was dedicated to both together"
    method: historical-account
    note: >-
      Built after Faustina's death in 141 and first dedicated to her, as the inscription on the
      architrave records; the dedication to both, on the frieze, followed Antoninus's death in
      161.
