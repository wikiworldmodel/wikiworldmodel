      - ref: src:platner-ashby-1929
        loc: "s.v. Antoninus et Faustina, Templum, p. 14"
        quote: "The columns are of cipollino, 17 metres high and 1.45 in diameter at the base, with Corinthian capitals of white marble"
    note: >-
