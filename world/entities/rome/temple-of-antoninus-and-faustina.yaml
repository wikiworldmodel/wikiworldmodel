# Footprint measured on the map: 38 m by 22 m, long axis on bearing 33° / 213°.
id: rome/temple-of-antoninus-and-faustina
kind: building/temple
summary: >-
  The temple on the Sacra Via at the entrance to the forum, built by Antoninus Pius for his
  deified wife Faustina, who died in 141, and dedicated to both after his own death in 161. Its
  six-column front still stands: the temple became the church of S. Lorenzo in Miranda in the
  seventh or eighth century.
