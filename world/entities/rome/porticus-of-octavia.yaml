# Footprint measured on the map: 103 m by 94 m, long axis on bearing 28° / 208°.
id: rome/porticus-of-octavia
kind: building/other
summary: >-
  A rectangular colonnaded enclosure built by Augustus and dedicated in the name of his sister
  Octavia, in place of the Porticus of Metellus, around the temples of Jupiter Stator and Juno. It
  held a library and a curia in which the senate met, burned in 80 CE and was restored, probably
  by Domitian, and again after a fire in 203 by Severus and Caracalla.
