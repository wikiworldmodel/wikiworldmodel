        quote: "The floor was about 7 metres above the Sacra via"
      - ref: src:platner-ashby-1929
        loc: "s.v. Castor, Aedes, Templum, p. 104"
        quote: "They are of white marble, fluted, 12.50 metres in height and 1.45 in diameter"
      - ref: src:platner-ashby-1929
        loc: "s.v. Castor, Aedes, Templum, p. 104"
        quote: "The entablature, 3.75 metres high, has a plain frieze and an admirable worked cornice"
    method: survey
    basis: reconstruction
    note: >-
      Added, not stated: about 7 m of podium above the Sacra Via, 12.50 m of column and 3.75 m
      of entablature. It is the height to the top of the entablature; the pediment and roof
      above are not counted, so the temple stood higher.
  form:
