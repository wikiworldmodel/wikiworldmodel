# Footprint measured on the map: 34 m by 19 m, long axis on bearing 23° / 203°.
id: rome/temple-of-castor
kind: building/temple
summary: >-
  The temple of Castor and Pollux at the south-east end of the forum, beside the Basilica Julia,
  on a very tall podium whose chambers were used as strongrooms and whose front platform served
  as a speakers' platform. Dedicated in 484 BCE and restored in 117 BCE, it was completely
  rebuilt by Tiberius in 6 CE; three columns of that temple stand.
author: machine:claude-code
same_as: { wikidata: Q380530, pleiades: 157276290, ohm: relation/2753736 }
claims:
  name:
    prop: name
    value: { en: "Temple of Castor and Pollux", la: "Aedes Castoris" }
    source:
      ref: src:platner-ashby-1929
      loc: "s.v. Castor, Aedes, Templum, p. 102"
      quote: "Its official name was aedes Castoris"
  start:
    prop: start
    value: 484 BCE
    source:
      - ref: src:platner-ashby-1929
        loc: "s.v. Castor, Aedes, Templum, p. 102"
        quote: "dedicated in 484 by the son of the dictator who was appointed duumvir for this purpose"
      - ref: src:livy-ab-urbe-condita
        loc: "2.42.5"
        quote: "Castor's temple was dedicated the same year, on the fifteenth of July"
    method: tradition
    note: >-
      Tradition: vowed in 499 BCE by the dictator Postumius after Lake Regillus. The calendar
      gives the day as 27 January and Livy 15 July. P&A finds that the successive temples differ
      in the plan of cella and pronaos; this date is kept as that of the temple of Castor on the
      site, and the Tiberian rebuilding of 6 CE (p. 103) is the temple of the form drawn.
  end:
