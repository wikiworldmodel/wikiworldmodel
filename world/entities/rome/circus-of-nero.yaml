# Footprint measured on the map: 527 m by 119 m, long axis on bearing 89° / 269°.
id: rome/circus-of-nero
kind: building/circus
summary: >-
  A private chariot course that Caligula built in the gardens of Agrippina on the Vatican side of
  the Tiber, used by Claudius and Nero; Caligula set up on its spina the obelisk that now stands
  before St Peter's. Its axis ran east and west with the starting gates at the east end; in the
  fourth century its north side was destroyed for the first basilica of St Peter.
author: machine:claude-code
