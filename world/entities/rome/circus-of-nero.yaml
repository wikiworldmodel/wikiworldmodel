      - ref: src:platner-ashby-1929
        loc: "Chronological index of dateable monuments, p. 595"
        quote: "Circus Gai et Neronis, 113"
    method: historical-account
    note: >-
      Built under Caligula, whose reign (37 to 41) the index dates; Claudius and Nero used it. The
      skeleton's 60 CE has no source here.
  end:
    prop: end
    value: { lo: 301 CE, hi: 400 CE }
