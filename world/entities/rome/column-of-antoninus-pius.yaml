# Footprint measured on the map: 4 m by 4 m, long axis on bearing 0° / 180°.
id: rome/column-of-antoninus-pius
kind: monument/column
summary: >-
  A monolithic red granite column, 14.75 m high and 1.90 m across, set up by Marcus Aurelius and
  Lucius Verus in memory of Antoninus Pius on the edge of the Monte Citorio rise in the Campus
  Martius. It stood on a white marble pedestal carved with reliefs, under a statue of Antoninus;
  the lower part of the shaft still projected above ground before the eighteenth century.
author: machine:claude-code
