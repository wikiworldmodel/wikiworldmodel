id: rome/odeon-of-domitian
kind: building/theatre
summary: >-
  A building for musical performances that Domitian erected in the Campus Martius, probably near
  his stadium, with places for about 5,000 spectators. It was restored under Trajan by
  Apollodorus, and in the fourth century Ammianus counted it among the most conspicuous monuments
  of Rome.
