summary: >-
  The bridge Hadrian built to approach his mausoleum, finished in 134 CE: three main arches of
  18.39 m span with three smaller arches on the left bank and two on the right, 10.95 m wide, of
  travertine and peperino. It is the Ponte Sant'Angelo, whose three central arches survive.
