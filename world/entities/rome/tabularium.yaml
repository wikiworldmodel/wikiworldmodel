summary: >-
  The state record office built by Q. Lutatius Catulus in 78 BCE on the slope of the Capitoline
  above the forum, whose arcade of eleven arches was the architectural backdrop of the forum.
  Michelangelo built the Palazzo del Senatore directly upon it, and it is still there.
