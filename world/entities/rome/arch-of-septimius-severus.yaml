id: rome/arch-of-septimius-severus
kind: monument/arch
summary: >-
  The triple arch of Pentelic marble at the north-west corner of the forum, put up in 203 CE for
  Septimius Severus and his sons Geta and Caracalla. Geta's name was chiselled out of the
  inscription after his murder; the arch survives almost whole.
