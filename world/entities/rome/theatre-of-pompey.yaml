    prop: name
    value: { en: "Theatre of Pompey", la: "Theatrum Pompeium" }
    unsourced: An editorial label.
  start:
    prop: start
    value: 55 BCE
    source:
      ref: src:platner-ashby-1929
      loc: "s.v. Theatrum Pompei, p. 515"
      quote: "the first permanent theatre in Rome, built of stone by Pompeius in his second consulship in 55 B.c."
    method: historical-account
    note: >-
      Platner and Ashby give 55 BCE as the common version of the dedication; the temple of Venus
      Victrix at the top of the cavea was dedicated in 52.
  end:
    prop: end
    value: 500 CE
    source: { ref: src:ohm-rome-2026-11-01, loc: relation/2753751 }
    method: compilation
    basis: reconstruction
    note: >-
      Platner and Ashby record a last restoration by Symmachus at the command of Theodoric between
      507 and 511, so the theatre stood after the year given here.
  form:
    prop: form
    value: { type: theatre, tiers: 3, faces: 89 }
    source:
      - ref: src:platner-ashby-1929
        loc: "s.v. Theatrum Pompei, p. 517"
        quote: "consisted of three series of arcades, adorned with columns, the lowest arcade being of the Doric order, the second Ionic, and the third Corinthian"
      - ref: src:platner-ashby-1929
        loc: "s.v. Theatrum Pompei, p. 517"
        quote: "Immediately outside the south-east side of the scaena was the Porticus Pompeii"
    note: >-
      Three tiers of arcades, Doric, Ionic and Corinthian from the bottom. faces is the bearing
      from the seating to the stage. The Porticus Pompei adjoined the back of the stage; Platner
      and Ashby put it outside the south-east side of the scaena, and the traced footprint of the
      portico lies due east of the traced theatre, so the stage is taken at the east end: 89.
