# Footprint measured on the map: 119 m by 78 m, long axis on bearing 179° / 359°.
id: rome/theatre-of-pompey
kind: building/theatre
summary: >-
  The first permanent theatre of Rome, built in stone by Pompey in his second consulship (55 BCE),
  with a temple of Venus Victrix crowning the cavea and the Porticus of Pompey beside the stage.
  Burned in 21, 80, 247 and probably again about 283 CE, it was each time restored, last by
  Diocletian and Maximian, so it stood in 315; Theodoric still had it repaired in 507 to 511.
author: machine:claude-code
