    prop: name
    value: { en: "Forum of Augustus", la: "Forum Augusti" }
    unsourced: An editorial label.
  start:
    prop: start
    value: 2 BCE
    source:
      ref: src:platner-ashby-1929
      loc: "s.v. Forum Augustum, p. 220"
      quote: "actual dedication is said to have taken place on Ist August, 2 B.c."
    method: historical-account
    note: >-
      The forum was hurried on and opened before the temple of Mars Ultor was finished; its
      actual dedication is said to have been on 1 August 2 BCE, with the temple (Cassius Dio,
      Velleius, as P&A cites them). Ovid seems to give 12 May for the temple. The scan of P&A
      prints 1st as Ist.
