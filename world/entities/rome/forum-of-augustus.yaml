id: rome/forum-of-augustus
kind: open/forum
summary: >-
  The second of the imperial fora, built by Augustus beside the Forum of Caesar around the
  temple of Mars Ultor. A wall nearly 36 m high shut it off from the crowded quarter behind, and
  statues of the triumphant generals of Rome stood in its niches; Hadrian restored it.
