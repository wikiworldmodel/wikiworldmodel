# Footprint measured on the map: 145 m by 1 m, long axis on bearing 76° / 256°.
id: rome/pons-aemilius
kind: works/bridge
summary: >-
  The first stone bridge across the Tiber, from the Forum Boarium: the censors of 179 BCE
  contracted for its piers and those of 142 BCE built arches on them. Platner and Ashby think the
  arch and pier that survive in the Ponte Rotto belong to a second structure, probably Augustus'
  restoration after 12 BCE, standing a little to one side of the second-century bridge and at a
  slightly different angle.
author: machine:claude-code
