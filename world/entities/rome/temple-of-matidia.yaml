id: rome/temple-of-matidia
kind: building/temple
summary: >-
  A temple of the deified Matidia, Hadrian's mother-in-law, north-east of the Pantheon and facing
  north onto what is now the Piazza Capranica. Five cipollino columns 1.70 m across, found nearby
  and perhaps from it, point to an octostyle front about 36 m wide; basilicas of Matidia and
  Marciana may have stood on either side of the open area before it.
