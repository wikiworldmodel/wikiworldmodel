# Footprint measured on the map: 787 m by 604 m, long axis on bearing 83° / 263°.
id: rome/domus-aurea
kind: building/palace
summary: >-
  Nero's Golden House, a vast palace-and-park estate begun after the fire of 64 CE and unfinished at
  his death in 68, with pavilions, gardens and an artificial lake spread from the Palatine to the
  Esquiline. His successors gave the land back to the public (the Colosseum rose on the lake), the
  main palace on the Oppian Hill burned in 104 and Trajan buried it under his baths, and Hadrian
  destroyed the vestibule in 121; by 315 it was long gone.
author: machine:claude-code
