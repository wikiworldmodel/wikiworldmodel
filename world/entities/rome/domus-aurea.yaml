      - ref: src:platner-ashby-1929
        loc: "s.v. Domus: Aurea, p. 171"
        quote: "At the time of Nero's death the Golden House was not completed"
    method: historical-account
    note: >-
      Built after the fire of 64 and unfinished at Nero's death in 68; Otho assigned money to finish
      it (Suetonius, as P&A cite it).
  end:
    prop: end
    value: { lo: 104 CE, hi: 121 CE }
    source:
      - ref: src:platner-ashby-1929
        loc: "s.v. Domus: Aurea, p. 172"
        quote: "when a fire in 104 A.D. destroyed the Golden House"
      - ref: src:platner-ashby-1929
        loc: "s.v. Domus: Aurea, p. 170"
        quote: "were covered over and filled up by Trajan"
      - ref: src:platner-ashby-1929
        loc: "s.v. Domus: Aurea, p. 172"
        quote: "The vestibule was finally destroyed by Hadrian in 121"
    method: historical-account
    note: >-
      Vespasian began by draining the lake and building the Colosseum on its site, and Titus built
      baths there, but the main palace on the Oppian Hill was still in use under Titus. A fire in
      104 destroyed it and Trajan filled its rooms and built his baths over them (dedicated in 109).
      Hadrian destroyed the vestibule in 121 for the temple of Venus and Roma, and after that, P&A
      say, the Golden House has no history. The map's earlier end of 79 CE does not fit, since the
      main palace was still in use under Titus.
