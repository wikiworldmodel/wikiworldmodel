id: rome/temple-of-vespasian
kind: building/temple
summary: >-
  The temple of the deified Vespasian, built against the Tabularium between the temples of
  Saturn and Concord, begun by Titus and completed by Domitian, and restored by Septimius
  Severus and Caracalla. Three of its Corinthian columns stand.
