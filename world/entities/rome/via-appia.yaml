summary: >-
  The great road south from Rome, laid by the censor Appius Claudius Caecus in 312 BCE to Capua
  and later prolonged to Venusia, Tarentum and Brundisium. In the city it left by the Porta Capena
  and passed the Aurelian wall at the Porta Appia, flanked by tombs inside and outside the walls.
