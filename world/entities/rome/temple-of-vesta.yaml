id: rome/temple-of-vesta
kind: building/temple
summary: >-
  The round temple of Vesta at the east end of the forum, where the sacred fire of Rome burned.
  Tradition ascribed it to Numa; burned and restored several times, it was last rebuilt by Julia
  Domna after the fire of 191 and was closed by Theodosius in 394.
