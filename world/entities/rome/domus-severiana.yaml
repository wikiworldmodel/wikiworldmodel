summary: >-
  The south-eastern part of the Palatine palace, built by Septimius Severus on huge arcaded
  substructions that tower over the valley of the Circus Maximus; the name Domus Severiana is
  modern. Baths stood on top of these terraces, and the Septizonium was built in front of them as a
  screen.
