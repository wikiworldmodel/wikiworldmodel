id: rome/temple-of-juno-moneta
kind: building/temple
summary: >-
  The temple of Juno Moneta on the Arx of the Capitoline, vowed by Camillus in 345 BCE and
  dedicated in 344; the Roman mint was in it in the last centuries of the Republic. Nothing is
  heard of it after the first century and no trace of it has been found, so whether it stood in
  315, and where, is not known.
