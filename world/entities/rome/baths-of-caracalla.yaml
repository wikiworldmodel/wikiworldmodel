        loc: "Monumenti: Terme di Caracalla (turismoroma.it/it/luoghi/terme-di-caracalla)"
        quote: "da quattro porte sulla facciata nord-orientale"
      - ref: src:platner-ashby-1929
        loc: "s.v. Thermae Antoninianae, pp. 523-524"
        quote: "the great circular caldarium in the centre of the south-west side"
      - ref: src:platner-ashby-1929
        loc: "s.v. Thermae Antoninianae, p. 522"
        quote: "surrounded by a garden, which in turn is enclosed by a rectangular peribolus"
    note: >-
      Faces 45 is the north-east front, on which the central block had its four entrances. P&A give
      the caldarium's dome as 35 m across, on eight huge piers.
