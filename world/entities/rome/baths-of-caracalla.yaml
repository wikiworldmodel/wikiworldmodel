  name:
    prop: name
    value: { en: "Baths of Caracalla", la: "Thermae Antoninianae" }
    source:
      ref: src:platner-ashby-1929
      loc: "s.v. Thermae Antoninianae, p. 520"
      quote: "the thermae built by Caracalla on the Via Nova"
  start:
    prop: start
    value: 216 CE
    source:
      - ref: src:platner-ashby-1929
        loc: "s.v. Thermae Antoninianae, p. 520"
        quote: "fixes the date of their dedication as 216"
      - ref: src:turismoroma-monumenti
        loc: "Monumenti: Terme di Caracalla (turismoroma.it/it/luoghi/terme-di-caracalla)"
        quote: "sul Piccolo Aventino tra il 212 ed il 216 d.C."
    method: historical-account
    note: >-
      The dedication date comes from Jerome's chronicle (Abraham 2231), as P&A cite it; building
      began between February 211 and February 212, from brick-stamps of Geta. Elagabalus and Severus
      Alexander are said to have added porticoes, but P&A call that doubtful.
  end:
    prop: end
    value: 600 CE
    source: { ref: src:ohm-rome-2026-11-01, loc: relation/2751482 }
    method: compilation
    basis: reconstruction
