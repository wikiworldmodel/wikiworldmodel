# Footprint measured on the map: 414 m by 329 m, long axis on bearing 135° / 315°.
id: rome/baths-of-caracalla
kind: building/baths
summary: >-
  The baths of Caracalla, begun in 211-212 and dedicated in 216 beside the Via Nova near the start
  of the Via Appia: a huge central block with a great domed circular caldarium about 35 m across,
  set in a garden inside a rectangular precinct with exedrae, libraries and a stadium. Entered from
  the north-east, they were restored under Aurelian and later emperors and went out of use when the
  Goths cut the aqueducts in 537.
author: machine:claude-code
same_as: { wikidata: Q502098, ohm: relation/2751482 }
