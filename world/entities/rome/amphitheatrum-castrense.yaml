# Footprint measured on the map: 83 m by 73 m, long axis on bearing 0° / 180°.
id: rome/amphitheatrum-castrense
kind: building/amphitheatre
summary: >-
  A small brick amphitheatre of the imperial court beside the Sessorium palace, built in the early
  third century, probably under the Severi or Elagabalus; it measured about 88 by 78 m with three
  storeys of arcades. When the Aurelian Wall was built in the 270s the outer half of it became a
  bastion of the wall and its arcades were walled up.
author: machine:claude-code
