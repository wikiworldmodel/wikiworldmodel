id: rome/stadium-of-domitian
kind: building/circus
summary: >-
  The stadium Domitian built in the Campus Martius for athletic contests, with seats for about
  15,000 spectators; after the Colosseum was damaged by fire in 217 it was used for gladiatorial
  combats, and Alexander Severus restored it. In the fourth century it was among the buildings
  that impressed Constantius, and its outline survives in the Piazza Navona.
