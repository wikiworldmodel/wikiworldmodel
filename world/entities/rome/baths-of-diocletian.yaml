  name:
    prop: name
    value: { en: "Baths of Diocletian", la: "Thermae Diocletiani" }
    source:
      ref: src:platner-ashby-1929
      loc: "s.v. Thermae Diocletiani, p. 527"
      quote: "the baths erected by Diocletian on the high ground to the north-east of the Viminal"
  start:
    prop: start
    value: { lo: 1 May 305 CE, hi: 25 July 306 CE }
    source:
      - ref: src:platner-ashby-1929
        loc: "s.v. Thermae Diocletiani, p. 527"
        quote: "The inscription therefore belongs to the period between the two latter dates, and the baths took between seven and eight years to complete"
      - ref: src:turismoroma-monumenti
        loc: "Monumenti: Terme di Diocleziano (turismoroma.it/it/luoghi/terme-di-diocleziano)"
        quote: "l’inaugurazione dell’impianto avvenne tra il 305 e il 306 d.C."
    method: documentary
    note: >-
      P&A date the dedicatory inscription (CIL vi. 1130) between the abdication of Diocletian and
      Maximian on 1 May 305 and the death of Constantius on 25 July 306; they reject Jerome's 302.
      The map's earlier 298 is the year Maximian began the work.
  end:
    prop: end
    value: 1500 CE
