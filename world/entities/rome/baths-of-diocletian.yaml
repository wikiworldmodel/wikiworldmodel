# Footprint measured on the map: 382 m by 339 m, long axis on bearing 48° / 228°.
id: rome/baths-of-diocletian
kind: building/baths
summary: >-
  The largest baths in Rome, begun by Maximian after his return to Rome in the autumn of 298 and
  dedicated in the names of Diocletian and his colleagues between 1 May 305 and 25 July 306. Like
  the baths of Caracalla they had a central block with a circular tepidarium and rectangular
  caldarium, inside a garden and an outer precinct with a great exedra on the south-west.
author: machine:claude-code
same_as: { wikidata: Q836108, ohm: relation/2751763 }
