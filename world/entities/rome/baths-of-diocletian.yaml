    source:
      - ref: src:platner-ashby-1929
        loc: "s.v. Thermae Diocletiani, p. 528"
        quote: "to the circular tepidarium (now the vestibule of the church) and the rectangular caldarium"
      - ref: src:platner-ashby-1929
        loc: "s.v. Thermae Diocletiani, p. 529"
        quote: "This was surrounded by a garden, which was enclosed by an outer peribolus"
    note: >-
      P&A: a central block with the frigidarium on the north-east and a circular tepidarium and
      rectangular caldarium to the south-west, in a garden and an outer enclosure whose south-west
      side held a very large exedra, probably serving as a theatre; the area is a rectangle of about
      356 by 316 m.
