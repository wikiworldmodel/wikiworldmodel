# Footprint measured on the map: 23 m by 12 m, long axis on bearing 162° / 342°.
id: rome/temple-of-portunus
kind: building/temple
summary: >-
  A small Ionic temple beside the Forum Boarium and the Pons Aemilius, tetrastyle and
  pseudoperipteral on a podium, rebuilt in its present form between 120 and 80 BCE. The name
  Portunus is an identification that Platner and Ashby (1929) only cite, from a 1925 article; they
  take the building for the temple of Mater Matuta, or perhaps Fortuna.
author: machine:claude-code
