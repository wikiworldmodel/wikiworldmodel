        quote: "The temple is Ionic (Ill. 31), 20 metres long and 12 wide, with north-south orientation parallel to the Tiber, tetrastyle prostyle"
      - ref: src:platner-ashby-1929
        loc: "s.v. Mater Matuta, templum, p. 330"
