    method: compilation
    note: >-
      The temple is said to have been first built in the 3rd or 4th century BCE. Platner and
      Ashby, who call it Mater Matuta, thought the surviving structure a restoration about the
      middle of the first century BCE; the date here is the later one.
  form:
