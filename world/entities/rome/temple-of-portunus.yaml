      - ref: src:wikipedia-temple-of-portunus
        loc: "Architecture"
        quote: "a pronaos portico of four Ionic columns across and two columns deep"
      - ref: src:wikipedia-temple-of-portunus
        loc: "Architecture"
        quote: "It is built of tuff and travertine with a stucco surface"
    note: >-
      Platner and Ashby describe this building under the name Mater Matuta, and mention its
      identification with Portunus only in passing. side counts the two free columns of the porch
