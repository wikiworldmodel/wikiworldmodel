    value: { type: circus, spina: false }
    source:
      ref: src:platner-ashby-1929
      loc: "s.v. Domus: Augustiana, p. 163"
      quote: "The open space in the centre had a semicircular fountain at each end"
    note: >-
      P&A describe a long garden court in the shape of a stadium, 160 by 50 m, with a semicircular
      fountain at each end of the open centre and arcades round it. No central barrier is described,
      so no spina is drawn; that is an inference from the description. Septimius Severus rebuilt the
      arcades after they collapsed (p. 163).
