# Footprint measured on the map: 164 m by 69 m, long axis on bearing 42° / 222°.
id: rome/stadium-of-the-palatine
kind: building/circus
summary: >-
  A long garden court on the Palatine laid out by Domitian in the shape of a stadium, about 160 by
  50 m, with a straight north-east end, a curved south-west end and arcades round it; the Romans
  called it the hippodromus Palatii. Septimius Severus restored its collapsed arcades.
