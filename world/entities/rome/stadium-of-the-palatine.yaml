    value: 92 CE
    source:
      - ref: src:platner-ashby-1929
        loc: "s.v. Domus: Augustiana, p. 163"
        quote: "which date from the original construction of Domitian"
      - ref: src:platner-ashby-1929
        loc: "s.v. Domus: Augustiana, pp. 158-159"
        quote: "architect Rabirius, which was only completed in 92"
    method: historical-account
    note: >-
      The arcades round the court are Domitian's original work; 92 is the year P&A give for the
      completion of Rabirius's rebuilding of the palace as a whole.
  form:
