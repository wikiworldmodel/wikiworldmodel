      quote: "prostyle hexastyle, fronting towards the north, and stood on a lofty and extensive podium"
    confidence: likely
    note: >-
      P&A give this on the condition that three fragments of the Marble Plan (45, 77, 96) belong
      together and show this temple. Faces 340 is the long-axis bearing nearest north. The footprint
