# Footprint measured on the map: 224 m by 138 m, long axis on bearing 160° / 340°.
id: rome/temple-of-claudius
kind: building/temple
summary: >-
  The temple of the deified Claudius on the Caelian, begun by Agrippina, almost entirely pulled down
  by Nero and rebuilt by Vespasian, probably with a nymphaeum worked into its podium. A prostyle
  hexastyle temple facing north on a lofty, extensive podium, it is last mentioned in the fourth
  century.
