    method: historical-account
    note: >-
      The temple as it stood in 315 was Vespasian's rebuilding (Suetonius, Vespasian 9, as P&A cite
      it), so his reign is the range; the map's earlier 54 CE is the year of Claudius's death. P&A
      find the podium's substructures differ on each side, probably because Vespasian's work
      combined the temple with a nymphaeum.
