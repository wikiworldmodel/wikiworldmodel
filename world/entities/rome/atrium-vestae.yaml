id: rome/atrium-vestae
kind: building/house
summary: >-
  The house of the Vestal Virgins at the foot of the Palatine, beside the temple of Vesta.
  Rebuilt by Nero after the fire of 64 and extended by Domitian and Hadrian, it was given its
  great court, 69 m long, by Julia Domna, and was kept up into the fourth century.
