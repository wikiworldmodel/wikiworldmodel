id: rome/temple-of-aesculapius
kind: building/temple
summary: >-
  The temple of Aesculapius on the Tiber island, founded after a sacred snake from Epidaurus came
  ashore there in 291 BCE, and the centre of a healing cult. It was rebuilt or restored in the
  late Republic and perhaps again under Antoninus Pius; no certain remains survive, and it
  probably lay under the church of S. Bartolomeo.
