# Footprint measured on the map: 14 m by 7 m, long axis on bearing 22° / 202°.
id: rome/arch-of-titus
kind: monument/arch
summary: >-
  The single-bay arch on the highest point of the Sacra Via, built to honour Titus and the siege
  of Jerusalem and finished only after his death. Its inner reliefs show the spoils of the
  Temple at Jerusalem carried in triumph and Titus in his chariot.
author: machine:claude-code
same_as: { wikidata: Q723887, pleiades: 236855821, ohm: relation/2751713 }
claims:
  name:
    prop: name
    value: { en: "Arch of Titus", la: "Arcus Titi" }
    unsourced: An editorial label.
  start:
    prop: start
    value: { lo: 81 CE, hi: 96 CE }
    source:
      - ref: src:platner-ashby-1929
        loc: "s.v. Arcus Titi, p. 45"
        quote: "not finished and dedicated until after his death"
      - ref: src:platner-ashby-1929
        loc: "s.v. Arcus Titi, p. 46"
        quote: "The theory that it was erected under Nerva and Trajan is improbable"
    method: historical-account
    note: >-
      Titus died in September 81; P&A cites the dedicatory inscription (CIL vi. 945) for the
      dedication after his death. The upper bound reads its doubt of a date under Nerva or
      Trajan as leaving the reign of Domitian, to 96.
