      - ref: src:platner-ashby-1929
        loc: "s.v. Arcus Titi, p. 46"
        quote: "The capitals of these columns are the earliest examples of the Composite style"
      - ref: src:platner-ashby-1929
        loc: "s.v. Arcus Titi, p. 46"
        quote: "The frieze and inscription are therefore preserved only on the side towards the Colosseum"
