id: rome/temple-of-hercules-victor
kind: building/temple
summary: >-
  The small round temple in the Forum Boarium beside the Tiber: a marble cella ringed by twenty
  Corinthian columns, on a podium. It is dated to the later second century BCE and identified as
  the temple of Hercules Victor (Olivarius); Platner and Ashby (1929) described it as an uncertain
  candidate for the temple of Portunus.
