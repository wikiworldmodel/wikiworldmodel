id: rome/temple-of-hadrian
kind: building/temple
summary: >-
  The temple of the deified Hadrian in the Campus Martius, dedicated by Antoninus Pius in 145 CE
  and probably octostyle and peripteral with fifteen columns on a side, set in a rectangular
  enclosure. Eleven of its fluted white marble Corinthian columns, about 15 m high, still stand on
  the north-east flank in the Piazza di Pietra.
