# Footprint measured on the map: 103 m by 73 m, long axis on bearing 114° / 294°.
id: rome/basilica-of-maxentius
kind: building/basilica
summary: >-
  The last and largest of the Roman basilicas, a vaulted hall modelled on the halls of the great
  baths, begun by Maxentius and completed by Constantine, who gave it a second entrance and apse
  on the Sacra Via side. The roof of the nave and the south aisle probably fell in the
  earthquake of 847; the north aisle still stands.
