# Footprint measured on the map: 153 m by 116 m, long axis on bearing 177° / 357°.
id: rome/baths-of-agrippa
kind: building/baths
summary: >-
  The first of Rome's great baths, laid out by Agrippa beside the Pantheon from 25 BCE and left to
  the Roman people at his death in 12 BCE. Burned in 80 CE and restored under Titus or Domitian
  and again by Hadrian, who joined it to the Pantheon by a series of halls, it received a recorded
  restoration in 344 to 345 CE.
