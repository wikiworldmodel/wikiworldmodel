    method: historical-account
    note: >-
      Cassius Dio, as Platner and Ashby report him, has Agrippa build a hot-air bath in 25 BCE;
      the index files the baths under that year. They left the baths to the Roman people at his
      death in 12 BCE, and the Aqua Virgo that supplied them was finished in 19 BCE. The interval
      runs from the first bath to the bequest.
