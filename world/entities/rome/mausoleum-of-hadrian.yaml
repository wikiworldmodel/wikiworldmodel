# Footprint measured on the map: 66 m by 66 m, long axis on bearing 71° / 251°.
id: rome/mausoleum-of-hadrian
kind: building/tomb
summary: >-
  Hadrian's tomb on the right bank of the Tiber, approached by the Pons Aelius: a square
  marble-faced podium about 84 m wide and 10 m high carrying a drum 64 m across and 21 m high.
  Dedicated in 139 CE by Antoninus Pius, it was the burial place of the Antonine emperors and
  their families; as the Castel Sant'Angelo it still stands.
author: machine:claude-code
same_as: { wikidata: Q486382, ohm: way/199851194 }
