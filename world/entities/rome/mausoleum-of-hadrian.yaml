  name:
    prop: name
    value: { en: "Mausoleum of Hadrian", la: "Moles Hadriani" }
    unsourced: An editorial label.
  start:
    prop: start
    value: { lo: 117 CE, hi: 139 CE }
    source:
      - ref: src:platner-ashby-1929
        loc: "s.v. Mausoleum Hadriani, p. 336"
        quote: "the dedicatory inscription to Hadrian and Sabina set up in 139 A.D."
      - ref: src:platner-ashby-1929
        loc: "Chronological index of dateable monuments, p. 597"
        quote: "Reign of Hadrian : he builds Temple of Trajan, 244"
      - ref: src:platner-ashby-1929
        loc: "Chronological index of dateable monuments, p. 597"
        quote: "Divus Julius, 287; Mausoleum, 336"
    method: historical-account
    note: >-
      Built by Hadrian, who reigned from 117, and finished by Antoninus Pius, who set up the
      dedicatory inscription in 139. Platner and Ashby date the bridge to it to 134 but give no
      year for the tomb's beginning.
  form:
    prop: form
    value: { type: mausoleum, drum_height: 21 }
    source:
      ref: src:platner-ashby-1929
      loc: "s.v. Mausoleum Hadriani, p. 337"
      quote: "The main drum, 64 metres in diameter and 21 high, is constructed of concrete"
    note: >-
      The drum stood on a square base about 84 m wide and 10 m high (the entry: 'The lower part
      was a base or podium about 84 metres square and 10 high'), which this form does not
      describe.
