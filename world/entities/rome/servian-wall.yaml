id: rome/servian-wall
kind: works/wall
summary: >-
  The republican city wall of Rome, ascribed by tradition to King Servius Tullius. The wall of
  Grotta Oscura tufa blocks that stood later was built after the Gallic sack, with censors'
  contracts in 377 BCE and repairs in 353. By 315 CE the Aurelian Walls had replaced it as the
  city's defence, but its great mound along the Esquiline remained a landmark.
