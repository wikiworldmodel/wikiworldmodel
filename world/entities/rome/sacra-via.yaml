id: rome/sacra-via
kind: works/road
summary: >-
  The oldest and most famous street in Rome, running from the summit of the Velia down to the east
  end of the Forum and passing through the Arch of Titus. After Hadrian built the Temple of Venus
  and Roma it was an avenue about 30 m wide, flanked by porticoes and shops, those on the north
  being finally destroyed by the basilica of Constantine.
