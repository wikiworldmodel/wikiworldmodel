id: rome/temple-of-peace
kind: open/forum
summary: >-
  Vespasian's temple of Peace, standing in the middle of a walled precinct, the Forum of Peace,
  with a library attached. Begun after the capture of Jerusalem and dedicated in 75, it held
  treasures brought from there; burned in 191 and restored, it was counted among the finest
  buildings in the city.
