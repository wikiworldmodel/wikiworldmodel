# Footprint measured on the map: 2272 m by 539 m, long axis on bearing 81° / 261°.
id: rome/arcus-neroniani
kind: works/aqueduct
summary: >-
  Nero's branch of the Aqua Claudia, carried on brick arches (span 7.75 m, up to 16 m high) from
  Spes Vetus about 2 km to the temple of Claudius on the Caelian, with a branch toward the
  Aventine. Severus reinforced the arches, and much of the line is preserved.
author: machine:claude-code
