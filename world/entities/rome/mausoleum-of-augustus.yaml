# Footprint measured on the map: 99 m by 89 m, long axis on bearing 144° / 324°.
id: rome/mausoleum-of-augustus
kind: building/tomb
summary: >-
  The circular tomb Augustus built for himself, his family and his successors in the northern
  Campus Martius from 28 BCE: a drum about 87 m across, faced with travertine or marble, rising in
  tiers planted with evergreens to a bronze statue of Augustus. The bronze tablets of the Res
  Gestae stood by its south entrance, and Nerva was the last emperor buried in it.
