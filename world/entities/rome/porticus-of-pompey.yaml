summary: >-
  The rectangular colonnaded court Pompey built in 55 BCE behind the stage of his theatre, a
  shelter for spectators in rain, laid out as a garden with shady walks and works of art. Burned
  in the reign of Carinus, it was rebuilt by Diocletian as the Porticus Iovia and Porticus
  Herculea.
