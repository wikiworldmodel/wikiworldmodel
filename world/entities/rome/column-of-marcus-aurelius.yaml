# Footprint measured on the map: 4 m by 4 m, long axis on bearing 166° / 346°.
id: rome/column-of-marcus-aurelius
kind: monument/column
summary: >-
  A column of Luna marble modelled on Trajan's, wound with a spiral band of reliefs of Marcus
  Aurelius' wars against the Marcomanni and Sarmatians, standing on the west side of the Via Lata.
  Its shaft, torus and capital measured 100 Roman feet (29.77 m), so it was called the columna
  centenaria, and a stair of about 200 steps climbed inside it.
