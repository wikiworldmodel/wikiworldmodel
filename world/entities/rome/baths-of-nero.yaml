kind: building/baths
summary: >-
  Nero's public baths beside the Pantheon, the second great bathing establishment in Rome,
  covering about 190 by 120 m and fronting north. Rebuilt by Alexander Severus in 227 CE, they
  were thereafter officially the Baths of Alexander (Thermae Alexandrinae), a name still in use
  around 1000 CE.
