# Footprint measured on the map: 270 m by 31 m, long axis on bearing 44° / 224°.
id: rome/porticus-aemilia
kind: building/warehouse
summary: >-
  A porticus outside the Porta Trigemina at the foot of the Aventine, built in 193 BCE by the
  aediles L. Aemilius Lepidus and L. Aemilius Paullus and restored in 174 BCE. Platner and Ashby
  (1929) give its dates and position but do not describe its form; the long warehouse hall mapped
  here comes from the map's identification.
