  insulae:
    prop: insulae
    value: 3403
    valid: { lo: 312 CE, hi: 357 CE }
    source:
      ref: src:notitia-urbis-romae
      loc: "Regio VI, ed. Jordan 1871, vol. 2 p. 550, Notitia column (the Curiosum column is blank)"
      quote: "insulae III. CCCCIII"
    method: documentary
    note: >-
      From the Notitia, since the Curiosum's three manuscripts leave out this region's curators,
      insulae, domus and horrea (Jordan marks the gap with asterisks, p. 550). Jordan's III.
      CCCCIII (3,403) is the numeral for the 'tria milia quadringentae tres' of Notitia manuscript
      A, and is also what he reports for B. Urlichs (1871, p. 9) prints 3,403 too, but gives B and
      most later manuscripts as IIICCCIII (3,303), the figure in Preller's text and table.
  domus:
    prop: domus
    value: 146
    valid: { lo: 312 CE, hi: 357 CE }
    source:
      ref: src:notitia-urbis-romae
      loc: "Regio VI, ed. Jordan 1871, vol. 2 p. 550, Notitia column (the Curiosum column is blank)"
      quote: "domos CXLVI"
    method: documentary
    note: >-
      From the Notitia, as for the insulae. Jordan's text has CXLVI (146), as does Urlichs's.
      Notitia manuscript B reads CXLVII (147), which Preller printed, though his own note gives
      'centum quadraginta sex' for manuscript A.
