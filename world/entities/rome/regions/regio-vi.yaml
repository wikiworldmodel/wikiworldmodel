id: rome/regions/regio-vi
kind: open/region
summary: >-
  The Quirinal and the high road along it, the Alta Semita, listed with the temples of Salus and
  Serapis, of Flora and of Quirinus, the old Capitolium, the Gardens of Sallust and the baths of
  Constantine and of Diocletian.
author: machine:claude-code
same_as: { ohm: node/2109009041 }
