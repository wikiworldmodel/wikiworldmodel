id: rome/regions/regio-iii
kind: open/region
summary: >-
  The quarter of the Colosseum (the Amphitheatrum, seating 87,000 by the catalogue's count),
  listed with the mint, the Ludus Magnus, the baths of Titus and Trajan, the Porticus Liviae and
  the camp of the Misene fleet's sailors.
author: machine:claude-code
same_as: { ohm: node/2109009044 }
claims:
  name:
    prop: name
    value: { la: "Regio III Isis et Serapis", en: "Region III, Isis and Serapis" }
    source: { ref: src:ohm-rome-2026-11-01, loc: node/2109009044 }
    note: The English form is an editorial rendering of the Latin name.
  start:
    prop: start
    value: 7 BCE
    source: { ref: src:ohm-rome-2026-11-01, loc: node/2109009044 }
    method: compilation
