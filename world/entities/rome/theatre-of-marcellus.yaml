# Footprint measured on the map: 126 m by 96 m, long axis on bearing 123° / 303°.
id: rome/theatre-of-marcellus
kind: building/theatre
summary: >-
  The stone theatre planned by Julius Caesar and built by Augustus in memory of Marcellus, beside
  the Forum Holitorium near the Tiber. Part of the Secular Games of 17 BCE was held in it and it
  was dedicated in 13 BCE; Vespasian restored the stage building, and with its three tiers of
  arcades and diameter of about 150 m it stood in 315. Its outer arcades survive.
author: machine:claude-code
