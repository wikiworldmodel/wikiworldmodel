# Footprint measured on the map: 188 m by 65 m, long axis on bearing 44° / 224°.
id: rome/horrea-galbae
kind: building/warehouse
summary: >-
  The Horrea Galbae, the earliest and most important of Rome's warehouse districts, between the
  south-west side of the Aventine and the Tiber: three courts ringed by travertine colonnades with
  storerooms opening off them, for grain, wine, oil and other goods. Built in the later Republic,
  restored by the emperor Galba and under imperial control from the start of the principate, they
  are still listed in the fourth-century Regionary Catalogue.
