summary: >-
  The oldest bridge across the Tiber: a wooden pile bridge built without metal, attributed by
  tradition to King Ancus Marcius and kept up by the college of pontiffs. Floods often damaged it
  but it was always repaired, and it was still standing in the fifth century; its exact site is
  disputed.
