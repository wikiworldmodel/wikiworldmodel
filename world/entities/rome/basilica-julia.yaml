    method: historical-account
    note: >-
      Begun perhaps in 54 BCE and dedicated unfinished in 46 BCE, the first basilica burned and
      Augustus rebuilt it in an enlarged form, the building drawn here, which he dedicated again
      in 12 CE in the names of Gaius and Lucius Caesar. P&A adds that it is not certain the
      building was entirely finished then.
