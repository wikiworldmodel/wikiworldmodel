id: rome/basilica-julia
kind: building/basilica
summary: >-
  The great law-court basilica on the south side of the forum, between the temples of Castor and
  Saturn, begun for Caesar and rebuilt larger by Augustus, who dedicated it again in 12 CE. It
  burned under Carinus and was restored by Diocletian, with different materials but the same
  form.
