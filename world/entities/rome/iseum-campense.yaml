    method: historical-account
    note: >-
      The triumvirs voted a temple of Isis and Serapis in 43 BCE, but Platner and Ashby say it is
      not known that it was built; the cult was officially received between the reign of Tiberius
      and 65 CE, and the temple was built then, perhaps by Caligula (37 to 41).
