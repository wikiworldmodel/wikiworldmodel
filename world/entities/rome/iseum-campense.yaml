# Footprint measured on the map: 187 m by 71 m, long axis on bearing 178° / 358°.
id: rome/iseum-campense
kind: building/temple
summary: >-
  The great sanctuary of Isis and Serapis in the Campus Martius, just west of the Saepta: a long
  narrow precinct with the temple of Isis at one end and, to the south, the separate Serapeum with
  a semicircular apse about 60 m across. Burned in 80 CE, it was restored by Domitian and again by
  Alexander Severus, and the Regionary Catalogue lists it as the Iseum and Serapeum.
