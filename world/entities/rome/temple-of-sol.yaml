# Footprint measured on the map: 44 m by 35 m, long axis on bearing 66° / 246°.
id: rome/temple-of-sol
kind: building/temple
summary: >-
  The temple of the Sun (Sol Invictus) that Aurelian built in the Campus Agrippae after returning
  from the east in 273, famous for its magnificence and its treasures, with a porticus beside it
  where the state's wine was stored. Its exact site is disputed; eight of its porphyry columns were
  sent to Constantinople for Hagia Sophia in the sixth century.
