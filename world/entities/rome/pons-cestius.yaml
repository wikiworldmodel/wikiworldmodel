id: rome/pons-cestius
kind: works/bridge
summary: >-
  The first stone bridge from the Tiber island to the right bank, built between 62 and 27 BCE,
  probably by one of the Cestii. In 369 to 370 it was replaced by what was in effect a new bridge,
  the Pons Gratiani, which kept its form; the old bridge still stood in 315.
