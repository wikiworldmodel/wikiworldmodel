id: rome/pons-fabricius
kind: works/bridge
summary: >-
  The stone bridge between the left bank and the Tiber island, built by L. Fabricius, curator of
  the roads, in 62 BCE and restored in 21 BCE after the flood of 23 BCE. It is 62 m long with two
  semicircular arches of about 24.5 m and a smaller arch between them, and is the best preserved
  bridge in Rome.
