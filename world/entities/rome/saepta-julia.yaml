# Footprint measured on the map: 257 m by 53 m, long axis on bearing 177° / 357°.
id: rome/saepta-julia
kind: building/other
summary: >-
  The voting precinct of the Campus Martius: a long rectangular porticus of travertine piers along
  the west side of the Via Lata, planned by Caesar, partly built by Lepidus and dedicated by
  Agrippa in 26 BCE. It was burned in 80 CE and restored by Domitian and by Hadrian, and Platner
  and Ashby leave open how far the building of the third century kept Agrippa's plan.
