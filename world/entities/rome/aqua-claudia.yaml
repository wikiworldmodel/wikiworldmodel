id: rome/aqua-claudia
kind: works/aqueduct
summary: >-
  The aqueduct begun by Caligula in 38 CE and dedicated by Claudius on 1 August 52 CE, bringing
  water about 45 miles from springs in the Anio valley to Rome, on arches that also carried the
  Anio Novus in a channel above it. Its supply failed after ten years; Vespasian restored it in 71
  and Titus repaired it ten years later, with further repairs in the second and third centuries.
