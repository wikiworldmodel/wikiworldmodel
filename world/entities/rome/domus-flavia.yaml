summary: >-
  The state half of Domitian's palace on the Palatine, rebuilt by his architect Rabirius and
  finished in 92 CE; the name Domus Flavia is modern. State apartments, halls and a great dining
  room, are grouped round a huge peristyle, entered by the main door of the palace on the
  north-west.
