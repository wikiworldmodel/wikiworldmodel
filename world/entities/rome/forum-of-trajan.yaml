summary: >-
  The last and largest of the imperial fora, built by Trajan with the architect Apollodorus: a
  colonnaded court with great hemicycles, the Basilica Ulpia, the Column and the libraries, to
  which Hadrian added the temple of Trajan. The Emperor Constantius admired it on his visit of
  356.
