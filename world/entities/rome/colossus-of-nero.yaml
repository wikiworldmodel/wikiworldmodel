# Footprint measured on the map: 152 m by 20 m, long axis on bearing 96° / 276°.
id: rome/colossus-of-nero
kind: monument/statue
summary: >-
  A colossal bronze statue 120 feet high, made by Zenodorus for the vestibule of Nero's Golden House
  and changed by Vespasian into a statue of the Sun. Hadrian moved it nearer the Colosseum, perhaps
  early in 128, to make room for the temple of Venus and Roma; it stood there on a
  brick-and-concrete pedestal 7 m square and remained the Sun after Commodus briefly made it his own
  portrait as Hercules.
