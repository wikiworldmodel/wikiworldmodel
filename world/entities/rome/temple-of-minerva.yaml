# Footprint measured on the map: 29 m by 14 m, long axis on bearing 52° / 232°.
id: rome/temple-of-minerva
kind: building/temple
summary: >-
  Domitian's temple of Minerva at the head of the Forum of Nerva, a Corinthian temple with a
  six-column front and an apse that projected beyond the forum, dedicated by Nerva with the
  forum in 97. Much of it stood until Paul V pulled it down in 1606.
