    value: { en: "Curia Julia", la: "Curia Iulia" }
    unsourced: An editorial label.
  start:
    prop: start
    value: 29 BCE
    source:
      - ref: src:platner-ashby-1929
        loc: "s.v. Curia Iulia, p. 143"
        quote: "It was completed and dedicated in 29 B.c. by Augustus"
      - ref: src:cassius-dio-roman-history
        loc: "51.22.1 (Loeb vol. 6, p. 63)"
        quote: "Caesar dedicated the temple of Minerva, called also the Chalcidicum, and the Curia Iulia"
    method: historical-account
    note: >-
      Dio puts the dedication after Octavian's triumph of 29 BCE. The curia was burnt in the
      fire of Carinus and rebuilt by Diocletian, and P&A says the existing building dates from
      his time (p. 144). It does not say how far Diocletian's hall followed the plan of
      Augustus's, so the Augustan date is kept as the start.
