id: rome/curia-julia
kind: building/civic
summary: >-
  The senate house, begun by Julius Caesar in 44 BCE and dedicated by Augustus in 29 BCE. The
  building of c. 315 is Diocletian's, put up after the fire of Carinus in 283 and still
  standing; it became the church of S. Adriano in the seventh century.
