    value: { lo: 54 CE, hi: 68 CE }
    source:
      - ref: src:platner-ashby-1929
        loc: "s.v. Pons Neronianus, p. 401"
        quote: "It was probably built by Nero to facilitate communication between this district and the city"
      - ref: src:platner-ashby-1929
        loc: "Chronological index of dateable monuments, p. 595"
        quote: "Pons Neronianus, 401"
    method: historical-account
    note: >-
      Probably built by Nero (reign 54 to 68); the index lists it among his works after the fire
      of 64. Platner and Ashby are unsure whether the name is ancient or only mediaeval.
