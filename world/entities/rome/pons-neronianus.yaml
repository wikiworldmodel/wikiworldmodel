# Footprint measured on the map: 107 m by 1 m, long axis on bearing 136° / 316°.
id: rome/pons-neronianus
kind: works/bridge
summary: >-
  A bridge across the Tiber just below the present Ponte Vittorio Emanuele II, joining the Campus
  Martius to the Vatican meadows, the gardens of Agrippina and the Circus of Nero; probably built
  by Nero. Platner and Ashby infer that it was probably already in ruins in the fourth century,
  because the Notitia leaves it out.
author: machine:claude-code
