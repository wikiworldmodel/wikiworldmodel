summary: >-
  A stone theatre built by L. Cornelius Balbus the younger and dedicated in 13 BCE, near the Tiber
  north of the Tiber island, with room for about 7,700 spectators. It was damaged in the fire of
  Titus' reign and restored, probably by Domitian; Ausonius speaks of it as still in use, and the
  Regionary Catalogue lists it.
