kind: monument/other
summary: >-
  The Altar of Augustan Peace, an altar standing inside a rectangular precinct wall of white
  marble about 6 m high, with an entrance in the middle of its east and west sides, on the west
  side of the Via Flaminia. The senate voted it on 4 July 13 BCE for Augustus' return from Spain
  and Gaul, and it was dedicated on 30 January 9 BCE.
