# Footprint measured on the map: 336 m by 291 m, long axis on bearing 125° / 305°.
id: rome/baths-of-trajan
kind: building/baths
summary: >-
  The great baths of Trajan on the Oppian Hill, designed by Apollodorus of Damascus and dedicated in
  109 CE, built over the burnt remains of Nero's Golden House. A central bath block entered from the
  north-east stood in a garden enclosed on three sides by a colonnaded precinct with libraries and a
  theatre-like exedra; they were the first of Rome's great baths.
author: machine:claude-code
