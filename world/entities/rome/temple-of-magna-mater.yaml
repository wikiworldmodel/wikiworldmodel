# Footprint measured on the map: 31 m by 18 m, long axis on bearing 23° / 203°.
id: rome/temple-of-magna-mater
kind: building/temple
summary: >-
  The temple of Cybele on the Palatine, built to house the black stone brought from Pessinus in 204
  BCE and dedicated on 11 April 191 BCE; it burned twice and was restored by Augustus in 3 CE. A
  Corinthian prostyle hexastyle temple about 33 by 17 m, it was standing unharmed in the fourth
  century.
