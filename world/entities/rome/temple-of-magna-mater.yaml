      loc: "s.v. Magna Mater, Aedes, p. 325"
      quote: "It was prostyle hexastyle, of the Corinthian order, and was approached by a flight of steps extending entirely across the front"
    note: >-
      From the ruins at the top of the Scalae Caci, identified with this temple by the inscriptions
      found there and a coin of the elder Faustina. The podium's concrete is of Augustus's time; the
      architectural fragments are of the original peperino reused. P&A give the length as 33.18 m
      and the width as 17.10 m.
