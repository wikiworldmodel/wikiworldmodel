    method: historical-account
    note: >-
      Dedicated by the praetor M. Junius Brutus (Livy, as P&A cite it). Burned in 111 BCE, restored
      by a Metellus, burned again and restored by Augustus in 3 CE, on the same plan, reusing the
      old stone. The map's earlier 201 BCE precedes the dedication.
