        loc: Table SPM.1, row SSP1-2.6, p. 14
        quote: SSP1-2.6 1.5 1.2 to 1.8 1.7 1.3 to 2.2 1.8 1.3 to 2.4
      - ref: src:lee-2021-ipcc-ar6-chapter-4
        loc: Table 4.5, long term 2081–2100, SSP1-2.6, relative to 1850–1900, p. 582
