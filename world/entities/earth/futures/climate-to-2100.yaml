id: earth/futures/climate-to-2100
kind: event/transition
summary: >-
  The warming of the climate and the rise of the sea over this century, as the IPCC's Sixth
  Assessment projects them under five illustrative emissions scenarios that start in 2015. How much
  depends on the emissions, and the report does not say how likely each scenario is, so the default
  picture gives no amounts: they come with the alternatives "IPCC emissions scenarios". Warming began
  long before 2015, and neither warming nor sea-level rise need stop at 2100.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Climate to 2100 under the IPCC scenarios }
    unsourced: An editorial label.
  start:
    prop: start
    value: 2015 CE
    source:
      ref: src:ipcc-2021-ar6-wg1-spm
      loc: Box SPM.1.1, p. 12
      quote: five illustrative scenarios that cover the range of possible future development of anthropogenic drivers of climate change found in the literature. They start in 2015
    method: model
    basis: projection
    note: When the scenarios begin to differ, not when the warming began.
  end:
    prop: end
    value: 2100 CE
    source:
      ref: src:ipcc-2021-ar6-wg1-spm
      loc: section B, opening paragraph, p. 12
      quote: Results over the 21st century are provided for the near term (2021–2040), mid-term (2041–2060) and long term (2081–2100)
    method: model
    basis: projection
    note: >-
      The end of the span these claims cover, not of the change: sea level goes on rising for
      centuries to millennia (B.5.4, p. 21).
  warming-ssp119:
    prop: warming
    value: { lo: 1.0, hi: 1.8 }
    alt: alt:ipcc-ar6-scenarios/ssp119
    valid: { lo: 2081 CE, hi: 2100 CE }
    source:
      - ref: src:ipcc-2021-ar6-wg1-spm
        loc: B.1.1, p. 14; Table SPM.1, long term, p. 14
        quote: very likely to be higher by 1.0°C to 1.8°C under the very low GHG emissions scenario considered (SSP1-1.9)
      - ref: src:lee-2021-ipcc-ar6-chapter-4
        loc: Table 4.5, long term 2081–2100, SSP1-1.9, relative to 1850–1900, p. 582
        quote: 1.4 [1.0 to 1.8]
    method: model
    basis: projection
    confidence: very-likely
    note: >-
      The global surface temperature averaged over 2081–2100, against 1850–1900. Best estimate 1.4 °C;
      the range is the very likely one, 5–95%, which is the range these tables give.
  warming-ssp126:
    prop: warming
    value: { lo: 1.3, hi: 2.4 }
    alt: alt:ipcc-ar6-scenarios/ssp126
    valid: { lo: 2081 CE, hi: 2100 CE }
    source:
