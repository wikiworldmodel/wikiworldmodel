      loc: Extended Data Table 1, row "Bitter Springs Fm, Australia"
      quote: 830 Bitter Springs Fm, Australia 20.1 – stromatolites
    method: compilation
    note: >-
      As the compilation gives it, with no uncertainty. Mitchell and Kirscher warn that hidden gaps in the
