id: earth/day-length/bitter-springs-formation
kind: sample
summary: >-
  Growth layers of stromatolites in the Bitter Springs Formation of Australia, read by Vanyo and Awramik
  as days and years: a day of about 20 hours. Layers in stromatolites may be broken by gaps, so this may
  be a maximum.
author: machine:claude-code
