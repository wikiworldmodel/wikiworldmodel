  name:
    prop: name
    value: { en: "Bitter Springs Formation stromatolites" }
    unsourced: An editorial label, from the rock unit and what was measured.
  formation:
    prop: formation
    value: Bitter Springs Formation
    source:
      ref: src:mitchell-kirscher-2023-day-length
      loc: Extended Data Table 1, row "Bitter Springs Fm, Australia"
      quote: 830 Bitter Springs Fm, Australia 20.1 – stromatolites
    note: >-
      No location is claimed: the compilation names only Australia, and the study behind the row, Vanyo and
      Awramik (1985), was not read.
