id: earth/events/chicxulub-impact
kind: event/impact
summary: The bolide impact on the northern Yucatán Peninsula at the end of the Cretaceous.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Chicxulub impact }
    unsourced: An editorial label, after the crater.
  date-renne-2013:
    prop: date
    value: { mean: 66.038 Ma, sd: 0.049 Myr }
    source:
      ref: src:renne-2013-kpg-timescales
      loc: 40Ar/39Ar ages of tektites
      quote: Combining all data yields an age of 66.038 ± 0.025/0.049 Ma for the tektites.
    method: radiometric/ar-ar
    rank: preferred
    note: >-
      Impact tektites from Beloc, Haiti, pooled with earlier studies. The larger ± includes
      systematic uncertainties; its confidence level was not checked here, so it is read as
      1σ, the wider reading.
  date-swisher-1992:
    prop: date
    value: { mean: 64.98 Ma, sd: 0.05 Myr }
    source:
      ref: src:swisher-1992-chicxulub-ages
      quote: a mean plateau age of 64.98 +/- 0.05 million years ago (Ma)
    method: radiometric/ar-ar
    rank: deprecated
    note: >-
      Melt rock from the Chicxulub 1 well, computed against an earlier calibration of the
      40Ar/39Ar age standards. Renne et al. (2013) find earlier tektite ages
      indistinguishable from theirs once normalized to the same calibration, and Kuiper et
      al. (2008, Science 320, 500–504) give a mutually consistent age of about 65.95 Ma for
      the boundary after recalibrating the standard. The ± is read as 1σ.
  location:
    prop: location
    value: { lat: 21.3333, lon: -89.5, frame: frame:earth/present-day }
    source: { ref: src:eid-chicxulub, loc: "latitude, longitude (21°20′N, 89°30′W)" }
    method: compilation
  frame:
    prop: frame
    value: frame:paleomap/plate-205
    source: { ref: src:paleomap-plate-model, loc: PALEOMAP_PlatePolygons.gpml }
    method: plate-polygon
    basis: reconstruction
relations:
  during-deccan:
    rel: during
    to: earth/lips/deccan-traps@main
    source:
      ref: src:sprain-2019-deccan-tempo
      quote: ">90% of DT volume erupted in <1 million years, with ∼75% emplaced post-KPB"
    note: Schoene et al. (2019) likewise find eruption pulses before and after the impact.
