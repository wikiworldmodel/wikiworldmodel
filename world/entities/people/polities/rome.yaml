id: people/polities/rome
kind: polity
summary: >-
  The Roman state as one entity, from its legendary founding to the fall of Constantinople in
  1453: a kingdom, a republic, an empire, and, after the end of the western line of emperors,
  an empire ruled from Constantinople alone. Wikidata has items for each of these forms and for
  ancient Rome as a civilization, but none for the state as a whole, so no Wikidata id is
  given.
author: machine:claude-code
phases:
  - id: kingdom
    label: Kingdom
  - id: republic
    label: Republic
  - id: empire
    label: Empire
  - id: east
    label: Empire in the east
claims:
  name:
    prop: name
    value: { en: Rome }
    unsourced: An editorial label, the state's name in English.
  start:
    prop: start
    value: { ref: people/events/founding-of-rome }
    source:
      ref: src:livy-ab-urbe-condita
      loc: "1.7.3"
      quote: Thus Romulus acquired sole power, and the city, thus founded, was called by its founder's name.
    method: tradition
    basis: reconstruction
    note: >-
      The state begins with Romulus' founding of the city, as the tradition tells it; it takes
      the founding's date, whichever reckoning is chosen. People lived on the site long before
      (places/rome).
  kingdom-end:
    prop: end
    subject: "@kingdom"
    value: { ref: people/events/expulsion-of-the-kings }
    source:
      ref: src:livy-ab-urbe-condita
      loc: "1.60.3"
      quote: The rule of the kings at Rome, from its foundation to its liberation, lasted two hundred and forty-four years.
    method: tradition
    basis: reconstruction
    note: The kings' rule ends with the expulsion of Tarquinius and the first consuls.
  republic-end-bury-1893:
    prop: end
    subject: "@republic"
    value: { ref: people/events/augustus-named }
    source:
      - ref: src:bury-1893-roman-empire
        loc: p. 10
        quote: while they nominally restored the republic, really inaugurated an empire which was destined to last well-nigh fifteen hundred years
      - ref: src:haverfield-1915-name-augustus
        loc: p. 249
        quote: on 16th January he received from the senate the cognomen Augustus, which henceforward remained the personal appellation of the reigning Roman emperors
    method: expert-estimate
    basis: reconstruction
    rank: preferred
    note: >-
      The modern convention: the Republic gives way to the Principate with the settlement of
      January 27 BCE, when Octavian laid down his extraordinary powers in the senate on 13
      January and was named Augustus three days later (Bury, p. 10; Haverfield). Bury's title
      dates the Empire's foundation to 27 B.C. The end is put at the naming, which closed the
      settlement.
  republic-end-cassius-dio:
    prop: end
    subject: "@republic"
    value: { ref: people/events/battle-of-actium }
    source:
      ref: src:cassius-dio-roman-history
      loc: "51.1.1–2, vol. 6 pp. 3–5"
      quote: Caesar now for the first time held all the power alone, and consequently the years of his reign are properly reckoned from that day.
    method: historical-account
    note: >-
      Dio reckons Augustus' sole rule, and so the monarchy, from the day of Actium, 2 September
      31 BCE.
  empire-end:
    prop: end
    subject: "@empire"
    value: { ref: people/polities/western-roman-empire, edge: end }
    source:
      ref: src:marcellinus-comes-chronicle
      loc: "a. 476.2 (MGH AA 11, p. 91)"
      quote: Hesperium Romanae gentis imperium, quod septingentesimo nono urbis conditae anno primus Augustorum Octavianus Augustus tenere coepit, cum hoc Augustulo periit
    method: historical-account
    note: >-
      In English: the western empire of the Roman people, which Octavian Augustus, first of the
      Augusti, began to hold in the 709th year from the founding of the city, perished with
      this Augustulus. The empire phase ends with the end of the western line of emperors,
      whichever date is chosen for it; after that only the east remains, ruled from
      Constantinople.
  end:
    prop: end
    value: { ref: people/events/fall-of-constantinople }
    source:
      - ref: src:bury-1923-later-roman-empire
        loc: vol. 1, p. 3
        quote: The diminished Roman Empire, now centering entirely in Constantinople, lasted for a thousand years
      - ref: src:bury-1923-later-roman-empire
        loc: vol. 1, pp. 3–4
        quote: the last death-struggle with the Ottomans, ending in the capture of the city in 1453
    method: expert-estimate
    basis: reconstruction
    note: >-
      The state ends with the capture of Constantinople. Two Byzantine successor states
      outlasted the city: the Despotate of the Morea, taken by the Ottomans in 1460, and the
      Empire of Trebizond, in 1461.
  territory:
    prop: territory
    value:
      from: src:cliopatria-0.2.1
      names: [Roman Kingdom, Roman Republic, Roman Empire, Eastern Roman Empire, Nicaean Empire, Byzantine Empire]
    source:
      - ref: src:cliopatria-0.2.1
        loc: rows named Roman Kingdom, Roman Republic, Roman Empire, Eastern Roman Empire, Nicaean Empire and Byzantine Empire
      - ref: src:angold-1975-byzantine-government-in-exile
        loc: title
        quote: A Byzantine Government in Exile
    method: compilation
    basis: reconstruction
    note: >-
      Cliopatria gives the Roman state under six names, by the conventional periods; here they
      are one state, whose forms of government are its phases. Where the dataset changes name
      need not be where a phase changes: it starts its Roman Empire in 31 BCE, the year of
      Actium. The Nicaean Empire is the state in exile after the Latin conquest of
      Constantinople in 1204, as the title of Angold's study of it has it; the dataset keeps
      that name until 1278, after the city was recovered in 1261. Its Byzantine rows after the
      fall of Constantinople are left out, and the one that runs on to 1467 is drawn only until
      the state ends.
