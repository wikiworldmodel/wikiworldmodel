id: people/domestication/chicken
kind: development
summary: >-
  The domestication of the chicken from the red junglefowl of Southeast Asia and southwest China.
  The most critical survey read finds no unambiguous chicken before about 1650 BCE, in Thailand,
  linked to the arrival of rice and millet farming. Mitochondrial DNA was read as showing
  chickens in north China 10,000 years ago, from bones later said to be pheasant; and a genomic
  split from the wild form falls in the early Holocene with a wide error.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Chicken domestication }
    unsourced: An editorial label.
  start-peters-2022:
    prop: start
    value: { lo: 1650 BCE, hi: 1250 BCE }
    source:
      ref: src:peters-2022-chickens
      loc: Significance
      quote: "unambiguous chickens were not present until ∼1650 to 1250 BCE in central Thailand"
    method: compilation
    rank: preferred
    note: >-
      Preferred for its critical assessment of the bones and their dates at over 600 sites. The date
      of the first certain chicken, so domestication may have begun somewhat earlier, as rice
      farming reached the region from about 2000 BCE.
  start-xiang-2014:
    prop: start
    value: 10 ka
    source:
      ref: src:xiang-2014-chickens
      loc: abstract
      quote: "northern China represents one region of the earliest chicken domestication, possibly dating as early as 10,000 y B.P."
    method: radiometric/radiocarbon
    note: >-
      Peters et al. (2015, 2022) reject the identification of these bones and the climate, while Xiang
      et al. (2015) defend the DNA and the dates.
  start-wang-2020:
    prop: start
    value: { mean: 9500 BP, sd: 3300 yr }
    source:
      ref: src:wang-2020-chickens
      loc: "Geographic origin of domestic chickens"
      quote: "the split of G. g. spadiceus from domestic chickens took place ~9500 ± 3300 years ago"
    method: molecular-clock
    note: >-
      The paper's ±, not said to be 2σ, read as 1σ. A split between living populations that may have
      come before any domestication; the authors conclude only that chickens were likely
      domesticated in the Holocene.
  location-thailand:
    prop: location
    value: { lat: 15.274415, lon: 102.268896, frame: frame:earth/present-day }
    source:
      - ref: src:peters-2022-chickens
        loc: Discussion
        quote: "The first unambiguous chicken bones in the archaeological record are present within the faunal assemblage at Neolithic Ban Non Wat in central Thailand"
      - { ref: src:wikidata-ban-non-wat, loc: "P625 coordinate location" }
    method: editorial
    rank: preferred
    note: >-
      Marked at Ban Non Wat. The paper elsewhere puts the site in northeast Thailand.
  location-southwest-china:
    prop: location
    value: { lat: 25.049444, lon: 102.708889, frame: frame:earth/present-day }
    source:
      - ref: src:wang-2020-chickens
        loc: abstract
        quote: "domestic chickens were initially derived from the RJF subspecies Gallus gallus spadiceus whose present-day distribution is predominantly in southwestern China, northern Thailand and Myanmar"
      - { ref: src:wikidata-yunnan, loc: "P625 coordinate location" }
    method: editorial
    note: >-
      The range of the wild ancestor, not a place of domestication the paper states. Marked at the
      gazetteer's point for Yunnan. Peters et al. (2022) accept this subspecies as the ancestor.
  location-north-china:
    prop: location
    value: { lat: 39.111111, lon: 115.656944, frame: frame:earth/present-day }
    source:
      - ref: src:xiang-2014-chickens
        loc: abstract
        quote: "northern China represents one region of the earliest chicken domestication"
      - ref: src:yang-2012-early-millet
        loc: Site descriptions
        quote: "Nanzhuangtou (39°6′40′′N, 115°39′25′′E)"
    method: editorial
    note: >-
      Marked at Nanzhuangtou. See life/occurrences/gallus-nanzhuangtou for the dispute.
  frame:
    prop: frame
    value: frame:paleomap/plate-615
    source: { ref: src:paleomap-plate-model, loc: "PALEOMAP_PlatePolygons.gpml" }
    method: plate-polygon
    basis: reconstruction
