id: people/domestication/pig-near-east
kind: development
summary: >-
  The domestication of the pig from wild boar in the Near East, in southeast Anatolia. At Çayönü
  molars shrink over two millennia until pigs look domestic by about 6800 BCE. These pigs later
  went to Europe with farmers, where their genes were almost wholly replaced by those of European
  boar. Pigs were also domesticated independently in China (people/domestication/pig-east-asia).
author: machine:claude-code
