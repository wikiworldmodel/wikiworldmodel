id: life/occurrences/pig-jiahu
kind: occurrence
summary: >-
  Pig bones from Jiahu in Henan, of the Peiligang culture period, about 9000–7800 BP: the oldest
  evidence of pig-keeping in China. Their teeth are rotated or marked by stress in youth, the deaths
  lean to young animals, and the shape of three molars suggests domestic pigs. Isotopes support it.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: "Pig, Jiahu" }
    unsourced: An editorial label, from the species and the site.
  identified:
    prop: identified_as
    value: Sus
    source:
      ref: src:hongo-2021-pig-management
      loc: "Morphological Evidence of Pig Domestication in China"
      quote: "Metric data of Sus excavated from Neolithic sites in both northern and southern China"
  evidence:
    prop: evidence
    value: zooarchaeological
    source:
      ref: src:hongo-2021-pig-management
      loc: "Yellow River Valley"
      quote: "Archeologists argued for pig-keeping being practiced at Jiahu based on the pathological characteristics found on their teeth (e.g., rotation of teeth and frequent occurrences of linear enamel hypoplasia [LEH]), as well as the age profile biased toward younger animals"
    note: >-
      What shows it is domestic: teeth, age at death and molar shape, as this review reports them; the
      original studies (Luo et al. 2008; Cucchi et al. 2011) were not read.
  location:
    prop: location
    value: { lat: 33.614398, lon: 113.661403, frame: frame:earth/present-day }
