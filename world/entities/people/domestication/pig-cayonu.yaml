id: life/occurrences/pig-cayonu
kind: occurrence
summary: >-
  Pig bones from Çayönü Tepesi in southeast Anatolia. Molars shrink through the Pre-Pottery Neolithic
  layers until pigs are domestic in form by about 6800 BCE. A specimen from the early Pottery Neolithic
  layer, 6800–6500 BCE, yielded ancient DNA of the Arm1T haplotype, native to southwest Asia.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: "Pig, Çayönü Tepesi" }
    unsourced: An editorial label, from the species and the site.
  identified:
    prop: identified_as
    value: Sus
    source:
      ref: src:ottoni-2013-pig
      loc: "Genetic Signatures of Early Anatolian Domestic Pigs"
      quote: "Arm1T haplotype that (along with the Y1 haplotype) is the dominant signature in other Neolithic and Bronze Age Anatolian Sus remains"
  evidence:
    prop: evidence
    value: zooarchaeological
    source:
      ref: src:ottoni-2013-pig
      loc: Introduction
      quote: "identified a disproportionate decrease in molar tooth size over two millennia"
    note: >-
      What shows it is domestic: smaller molars, and genetics that tie the specimen to early domestic
      pigs. Ervynck et al. (2001) were not read; this is Ottoni et al.'s account of them.
  location:
    prop: location
    value: { lat: 38.216, lon: 39.725, frame: frame:earth/present-day }
    source: { ref: src:wikidata-cayonu, loc: "P625 coordinate location" }
