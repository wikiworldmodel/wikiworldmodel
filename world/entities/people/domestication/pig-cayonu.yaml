    value: { lo: 6800 BCE, hi: 6500 BCE }
    source:
      ref: src:ottoni-2013-pig
      loc: "Genetic Signatures of Early Anatolian Domestic Pigs"
      quote: "one specimen excavated from an early Pottery Neolithic layer (∼6,800–6,500 BC) at Çayönü Tepesi"
    method: stratigraphic
    note: >-
      The date of the layer and of the specimen with DNA. The site's Pre-Pottery layers, with the
      earlier pigs, run from about 10,000 BCE.
