    source:
      - ref: src:zheng-2016-huxi-rice
        loc: abstract
        quote: "Plant remains dating to between 9000 and 8400 BP from a probable ditch structure at the Huxi site"
      - ref: src:zuo-2017-shangshan-rice
        loc: Introduction
        quote: "an archaeological site dated from 9,000 to 8,300 cal yr B.P."
    method: radiometric/radiocarbon
    note: >-
      Charcoal, seeds and phytoliths; Zuo et al. dated phytoliths and charcoal from the same strata
      to validate the phytolith method.
