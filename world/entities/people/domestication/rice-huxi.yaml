id: life/occurrences/rice-huxi
kind: occurrence
summary: >-
  Rice spikelet bases from a probable ditch at Huxi, Zhejiang, a Shangshan culture site of
  9000–8400 BP, the oldest spikelet bases recovered in China. Of 126, 61.2% are of the wild,
  shattering type, 30.1% intermediate and 8.7% non-shattering: selection against shattering was under
  way, far from complete.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: "Rice, Huxi" }
    unsourced: An editorial label, from the crop and the site.
  identified:
    prop: identified_as
    value: Oryza sativa
    source:
      ref: src:zheng-2016-huxi-rice
      loc: abstract
      quote: "the oldest rice (Oryza sativa) spikelet bases and associated plant remains recovered in China"
  evidence:
    prop: evidence
    value: archaeobotanical
    source:
      - ref: src:zheng-2016-huxi-rice
        loc: "Spikelet base morphology"
        quote: "There are 77, 38, and 11, accounting for 61.2%, 30.1%, and 8.7% of the total, respectively."
      - ref: src:zheng-2016-huxi-rice
        loc: Discussion
        quote: "The intermediate and non-shattering types among the Huxi spikelet bases are evidence of selection that shifted the population to reduced shattering by 9000–8400 BP."
    note: >-
      What shows it is domestic: spikelets torn from the plant rather than falling at a clean
      abscission layer, seen also in the cell structure under the electron microscope.
