id: life/occurrences/horse-sintashta
kind: occurrence
summary: >-
  Horses buried with spoke-wheeled chariots in the kurgans of the Sintashta culture, east of the Urals,
  about 2000–1800 BCE. The DOM2 profile of today's domestic horses is universal among them, and the
  chariots and the burials show what they were for. They are the earliest unambiguously managed horses
  in one account.
author: machine:claude-code
