    value: 10.5 ka
    source: { ref: src:arranz-otaegui-2016-cereal-domestication, loc: 'Table S6, rows "Aswad (van Zeist)" and "Aswad (Willcox)": c. 10.5 ka Cal BP' }
    method: compilation
    note: >-
      The table's "c. 10.5".
