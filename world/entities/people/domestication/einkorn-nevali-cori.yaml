id: life/occurrences/einkorn-nevali-cori
kind: occurrence
summary: >-
  One-grained einkorn chaff from Nevalı Çori in southeast Turkey, about 10,600–9,900 years ago, not
  far from the Karacadağ Mountains that genetics name as einkorn's home. Of 282 pieces 13.8% have
  the tough scar of an ear that does not shatter, just above what wild stands give.
author: machine:claude-code
