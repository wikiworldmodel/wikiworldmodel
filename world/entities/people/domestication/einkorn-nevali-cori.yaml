      - ref: src:arranz-otaegui-2016-cereal-domestication
        loc: Legend to Fig. 2
        quote: "Sites where domesticated-type rachis scars comprise >10% of the assemblage are considered to represent evidence of incipient cereal domestication"
    note: >-
      What shows it is domestic: a non-brittle rachis, in a share only a little above the 10% found in
      wild stands. By the time of Çatalhöyük, 9.1–8.4 ka, the share in the same table is 94.6%.
