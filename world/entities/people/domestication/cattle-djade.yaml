    rel: member-of
    to: life/taxa/mammalia
    source: { ref: src:opentree-synthesis-16.1, loc: "induced_subtree of ott490099 and ott244265: Bos taurus lies within Mammalia" }
  domestication:
    rel: part-of
    to: people/domestication/cattle
    source: { ref: src:arbuckle-kassebaum-2021-cattle, loc: "The Traditional Narrative" }
    note: >-
      Under the critics' reading this is management of cattle with a wild body, still part of the
      same process.
