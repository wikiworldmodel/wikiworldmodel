id: people/domestication/sorghum
kind: development
summary: >-
  The domestication of sorghum in the eastern Sahel of Africa. People ate wild, shattering sorghum
  in the eastern Sahara for millennia. Impressions in Butana Group pottery in the southern Atbai of
  eastern Sudan show a mix of wild and domestic forms in the fourth millennium BCE, and by the early
  second millennium forms found only in domestic plants appear.
author: machine:claude-code
