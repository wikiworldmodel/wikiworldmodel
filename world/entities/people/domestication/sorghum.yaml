  name:
    prop: name
    value: { en: Sorghum domestication }
    unsourced: An editorial label.
  start-fuller-2014:
    prop: start
    value: { lo: 6 ka, hi: 4 ka }
    source:
      ref: src:fuller-2014-domestication-rates
      loc: "Comparing Timing and Tempo of Domestication in Seed Crops"
      quote: "This suggests that domestication took place in Africa between 6000 and 4000 B.P., but hard evidence for the process is lacking."
    method: expert-estimate
    rank: deprecated
    note: >-
      Written before the study of the Butana Group impressions, which supply such evidence. They fall
      within this range, so the start shown comes from them, not from this estimate.
  location:
