      - { ref: src:wikidata-karaca-dag, loc: "P625 coordinate location" }
    method: editorial
    rank: preferred
    note: >-
      Preferred for being the one specific place a study of einkorn itself gives, with Nevalı Çori
      not far off. Read from living wild and domestic plants; the abstract says it confirms earlier
      results. The point is the gazetteer's for the volcano.
