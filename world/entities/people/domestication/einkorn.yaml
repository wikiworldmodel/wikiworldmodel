id: people/domestication/einkorn
kind: development
summary: >-
  The domestication of einkorn wheat from its wild form in the Fertile Crescent. Tough-scarred
  chaff appears first at low levels, at Nevalı Çori and in southern Syria, and is nearly all of
  it by Çatalhöyük, a thousand years or more later. Genetics of living einkorn point to the Karacadağ
  Mountains of southeast Turkey; the archaeobotany of the whole region argues against any single
  centre.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Einkorn wheat domestication }
    unsourced: An editorial label.
  start-arranz-otaegui-2016:
    prop: start
    value: { lo: 10.7 ka, hi: 10.2 ka }
    source:
      ref: src:arranz-otaegui-2016-cereal-domestication
      loc: "The Evidence of Cereal Domestication at Tell Qarassa North"
      quote: "by 10.7–10.2 ka Cal BP there are positive signs that barley, emmer, and einkorn were being cultivated at TQN"
    method: radiometric/radiocarbon
    note: >-
      The earliest tough-scarred einkorn chaff in the paper's table, 28.6% of 14 pieces at Tell
      Qarassa North, which the paper reads as probably a two-grained einkorn.
  location-karacadag:
