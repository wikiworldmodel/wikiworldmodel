id: life/occurrences/common-bean-coxcatlan
kind: occurrence
summary: >-
  Common beans from Coxcatlán Cave in the Tehuacán Valley of Puebla, 2,390–2,210 cal BP: among the
  earliest found in Mesoamerica, and much younger than the genetic estimate for the domestication
  of the bean. They are domestic by identification as the cultivated species; the source read gives
  no separate trait.
