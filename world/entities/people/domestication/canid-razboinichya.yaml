id: life/occurrences/canid-razboinichya
kind: occurrence
summary: >-
  The skull and jaws of a dog-like canid from Razboinichya Cave in the Altai, directly dated to about
  33,000 years ago in three laboratories. Its shape is most like that of domestic dogs from Greenland,
  and its describers read it as an incipient dog from a domestication that the last ice age cut off.
  Others count such finds among disputed early claims, and nothing links it to living dogs.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: "Dog-like canid, Razboinichya Cave" }
    unsourced: An editorial label, from the description and the site.
  identified:
    prop: identified_as
    value: dog-like canid
    source:
      ref: src:ovodov-2011-razboinichya
      loc: abstract
      quote: "the well-preserved remains of a dog-like canid from the Razboinichya Cave"
  evidence:
    prop: evidence
    value: body-fossil
    source:
      ref: src:ovodov-2011-razboinichya
      loc: abstract
      quote: "the Razboinichya Cave individual is most similar to fully domesticated dogs from Greenland (about 1000 years old), and unlike ancient and modern wolves"
    note: >-
      What suggests it is domestic: the skull's shape alone. No tie to people is claimed in the abstract,
      and wolves and early dogs can be hard to tell apart.
  location:
    prop: location
    value: { lat: 51.3, lon: 84.466667, frame: frame:earth/present-day }
