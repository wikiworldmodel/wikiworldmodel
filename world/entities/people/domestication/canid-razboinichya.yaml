      loc: abstract
      quote: "Direct AMS radiocarbon dating of the skull and mandible of the Razboinichya canid conducted in three independent laboratories resulted in highly compatible ages, with average value of ca. 33,000 cal BP."
    method: radiometric/radiocarbon
relations:
