    rel: member-of
    to: life/taxa/mammalia
    source: { ref: src:opentree-synthesis-16.1, loc: "induced_subtree of ott247333 and ott244265: Canis lupus familiaris lies within Mammalia" }
    note: >-
      Placed at the mammals, not with dogs, because whether it is one is the dispute.
  domestication:
    rel: part-of
    to: people/domestication/dog
    source:
      - ref: src:ovodov-2011-razboinichya
        loc: abstract
        quote: "appears to be an incipient dog that did not give rise to late Glacial – early Holocene lineages"
      - ref: src:bergstrom-2020-dogs
        loc: "Assessing the relationship between dog and human population histories"
        quote: "though older (3, 31), disputed specimens (49, 50), have been claimed"
    rank: deprecated
    note: >-
      Kept, but it does not bind the date of the dog's domestication: Ovodov et al. (ref. 31 there) are
      among the claims Bergström et al. call disputed, and in their own reading this was a
      dead end.
