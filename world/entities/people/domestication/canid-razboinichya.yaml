      quote: "Razboinichya [Bandit's] Cave in Altai Mountains of southern Siberia (51°18′N, 84°28′E)"
    method: survey
  frame:
    prop: frame
    value: frame:paleomap/plate-401
    source: { ref: src:paleomap-plate-model, loc: "PALEOMAP_PlatePolygons.gpml" }
    method: plate-polygon
    basis: reconstruction
  date:
    prop: date
    value: 33 ka
    source:
