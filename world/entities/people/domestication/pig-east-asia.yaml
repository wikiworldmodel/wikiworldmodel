id: people/domestication/pig-east-asia
kind: development
summary: >-
  The domestication of the pig from wild boar in China, independently of the Near East. The oldest
  evidence is at Jiahu in Henan from about 9,000 years ago: teeth rotated and marked by stress in
  youth, an age profile biased to young animals, and molar shape. Pigs were at first a small part of
  the bones at these sites, and management may have begun in several places in China.
author: machine:claude-code
