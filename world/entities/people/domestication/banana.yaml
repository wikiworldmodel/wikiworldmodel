id: people/domestication/banana
kind: development
summary: >-
  The first cultivation of bananas, in New Guinea, from the wild Musa acuminata subsp. banksii
  of that island. It is known from phytoliths in the mounded plots of Kuk Swamp, in one of the
  independent beginnings of agriculture. Edible, seedless bananas arose through hybrids as people
  carried plants across wide regions, a history this record does not date.
author: machine:claude-code
