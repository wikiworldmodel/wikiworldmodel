id: life/occurrences/horse-botai
kind: occurrence
summary: >-
  Horse bones and pottery from Botai in northern Kazakhstan, about 3660–2670 BCE: for years the
  earliest case for domestic horses, from bit wear on teeth, the shape of their bones, mare's milk in
  pots and possible corrals. Genomes then showed they are not the ancestors of today's horses but
  of Przewalski's. Whether they were herded, or just killed in great numbers, is disputed.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: "Horse, Botai" }
    unsourced: An editorial label, from the species and the site.
  identified:
    prop: identified_as
    value: E. przewalskii
    source:
      ref: src:taylor-barron-ortiz-2021-botai
      loc: Introduction
      quote: "Genomic sequencing demonstrated that Botai equids are in fact not the progenitor of E. caballus but a sister taxon, E. przewalskii"
  evidence:
    prop: evidence
    value: zooarchaeological
    source:
      - ref: src:outram-2009-botai
        loc: abstract
        quote: "Pathological characteristics indicate that some Botai horses were bridled, perhaps ridden."
      - ref: src:outram-2009-botai
        loc: abstract
        quote: "reveals processing of mare's milk and carcass products in ceramics"
      - ref: src:taylor-barron-ortiz-2021-botai
        loc: abstract
        quote: "damage observed in Botai horse teeth is likely generated by natural disturbances in dental development and wear, rather than through contact with bridle equipment"
      - ref: src:librado-2024-horses
        loc: abstract
        quote: "we detect significantly shortened generation times at Botai around 3500 bce"
    note: >-
      What was held to show it is domestic: bone shape, wear on teeth, milk and corrals. Each is
      argued over; the genetic study of 2024 adds a shorter generation time, which supports husbandry.
  location:
    prop: location
    value: { lat: 53.303, lon: 67.645, frame: frame:earth/present-day }
    source: { ref: src:wikidata-botai, loc: "P625 coordinate location" }
    method: gazetteer
    note: >-
      The gazetteer gives this point on the item for the culture, not the settlement.
  frame:
    prop: frame
    value: frame:paleomap/plate-402
    source: { ref: src:paleomap-plate-model, loc: "PALEOMAP_PlatePolygons.gpml" }
    method: plate-polygon
    basis: reconstruction
  date:
    prop: date
    value: { lo: 3660 BCE, hi: 2673 BCE }
    source:
      - ref: src:casanova-2022-botai
        loc: "Results, Botai"
        quote: "3660–3423 cal BC (95% probability)"
      - ref: src:casanova-2022-botai
        loc: "Results, Botai"
        quote: "ended in 2887–2673 cal BC (95% probability)"
    method: radiometric/radiocarbon
    note: >-
      A model of the whole Botai sequence, from published dates on bone and plants, with its 95% outer
      edges.
