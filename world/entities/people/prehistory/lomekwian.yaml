id: people/prehistory/lomekwian
kind: industry
summary: >-
  The Lomekwian, the name proposed for the stone tools of Lomekwi 3, West Turkana, Kenya: the earliest
  known stone tools, mixing core reduction with battering, some 700,000 years older than the Oldowan as
  then known. Known from that one site, it has no location of its own here. Its makers are unknown:
  Kenyanthropus platyops and late Australopithecus afarensis are the names usually offered.
