id: people/writing/anyang-oracle-bones
kind: occurrence
summary: >-
  Divination records cut into turtle shell and ox bone at the Shang royal court at Anyang, under the last nine kings of the dynasty. The earliest of them, from the reign of Wu Ding, are the earliest certain
  Chinese writing.
author: machine:claude-code
