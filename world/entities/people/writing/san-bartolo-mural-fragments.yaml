id: people/writing/san-bartolo-mural-fragments
kind: occurrence
summary: >-
  Fragments of painted murals with early Maya hieroglyphs, from sealed contexts in an early building phase of the Las Pinturas pyramid at San Bartolo, Guatemala, older than the site's famous mural chamber by about 150 years.
  One of them bears the date 7 Deer, the earliest securely dated Maya calendar notation.
