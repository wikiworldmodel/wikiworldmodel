      quote: The strongest challenge to this consensus in recent years has been Benjamin Sass (2004–05, 2008), who has put forward the possibility of a fourteenth-century date for the beginnings of the alphabet.
    method: expert-estimate
    note: At second hand, through Lam; Sass was not read.
