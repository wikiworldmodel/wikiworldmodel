id: people/writing/serabit-el-khadem-inscriptions
kind: occurrence
summary: >-
  The Proto-Sinaitic inscriptions from Serabit el-Khadem, an Egyptian mining site in Sinai, on statuettes, stone panels and rock faces, first excavated by Flinders Petrie in 1905. For lack of stratified contexts, their date is
  argued from associated Egyptian material and history.
author: machine:claude-code
