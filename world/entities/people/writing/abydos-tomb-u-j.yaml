id: people/writing/abydos-tomb-u-j
kind: occurrence
summary: >-
  The inscribed finds from Tomb U-j at Umm el-Qa'ab, Abydos, a large "proto-royal" tomb of the Naqada III period: small incised bone tags, once tied to goods, and large signs painted in ink on pots.
  They are the earliest evidence of writing in Egypt.
