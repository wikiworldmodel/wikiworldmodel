id: people/writing/proto-sinaitic
kind: development/script
summary: >-
  The earliest alphabetic writing, inscribed by speakers of a Semitic language in signs modelled on Egyptian hieroglyphs, at the Egyptian mining site of Serabit el-Khadem in Sinai; two similar rock inscriptions come from
  Wadi el-Hol near Thebes. Its finds have no good stratigraphy, and dates for them run from the nineteenth to the fourteenth century BCE. It is only partly read. Later alphabets descend from it: its signs run on
  through the Proto-Canaanite inscriptions into the Phoenician alphabet (people/writing/phoenician-alphabet).
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Proto-Sinaitic }
    source:
      ref: src:lam-2010-alphabet
      loc: p. 189
      quote: The earliest evidence for alphabetic writing comes from the second millennium bc in the Sinai and Egypt.
  start-serabit:
    prop: start
    value: { ref: people/writing/serabit-el-khadem-inscriptions }
    source:
      ref: src:lam-2010-alphabet
      loc: p. 196 (catalog no. 89)
      quote: The Proto-Sinaitic inscriptions, which represent arguably the earliest examples of alphabetic writing
    method: expert-estimate
    rank: preferred
    note: Preferred because these inscriptions are what the name means; the ones from Wadi el-Hol are in a script that resembles them.
  start-wadi-el-hol:
    prop: start
    value: { ref: people/writing/wadi-el-hol-inscriptions }
    source:
      ref: src:waal-2018-phoenician-letters
      loc: p. 85
      quote: the oldest now known alphabetic inscriptions stem from Wadi el-Hol in Egypt
    method: expert-estimate
    note: If the two rock inscriptions from Wadi el-Hol are taken as the same early script.
  end:
    prop: end
    value: unknown
    source:
      ref: src:lam-2010-alphabet
      loc: p. 191
      quote: one can observe a gradual evolution away from purely pictographic shapes to more abstract, stylized forms
    note: "It has no clear end: it passes into the Proto-Canaanite inscriptions, whose later forms are more stylized."
  decipherment:
    prop: decipherment
    value: partly-deciphered
    source:
      ref: src:lam-2010-alphabet
      loc: p. 190
      quote: it is based on this assumption that the Sinai inscriptions have been partially deciphered
    note: The assumption is that the signs write West Semitic words by their first sounds. The phrases read include "for the Lady" and "chief of the miners".
  location:
    prop: location
    value: { lat: 29.036709, lon: 33.459411, frame: frame:earth/present-day }
    source: { ref: src:pleiades-serabit-el-khadim, loc: "place 816186710, representative point" }
    method: gazetteer
    note: Marked at Serabit el-Khadem, the sanctuary of Hathor there.
  frame:
    prop: frame
    value: frame:paleomap/plate-508
    source: { ref: src:paleomap-plate-model, loc: PALEOMAP_PlatePolygons.gpml }
    method: plate-polygon
    basis: reconstruction
relations:
  first-attestation:
    rel: evidenced-by
    to: people/writing/serabit-el-khadem-inscriptions
    source:
      ref: src:lam-2010-alphabet
      loc: p. 189
      quote: consist of linear pictographic symbols inscribed on statuettes, stone panels, and rock faces at Serabit el-Khadem
  wadi-el-hol:
    rel: evidenced-by
    to: people/writing/wadi-el-hol-inscriptions
    source:
      ref: src:lam-2010-alphabet
      loc: p. 189
      quote: in a script that strongly resembles the Proto-Sinaitic texts
