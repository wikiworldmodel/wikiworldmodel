id: people/writing/knossos-room-of-chariot-tablets
kind: occurrence
summary: >-
  About 650 Linear B tablets from the Room of the Chariot Tablets in the palace at Knossos, older than the rest of the Knossos tablets and the earliest known in the script.
author: machine:claude-code
