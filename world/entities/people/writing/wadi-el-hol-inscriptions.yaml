id: people/writing/wadi-el-hol-inscriptions
kind: occurrence
summary: >-
  Two single-line rock inscriptions at Wadi el-Hol, on a desert road near Thebes in Upper Egypt, found in 1994–95 by John Darnell's survey, in a script much like the Proto-Sinaitic texts. Dated by Egyptian inscriptions nearby, they may be the oldest
  alphabetic writing known.
author: machine:claude-code
