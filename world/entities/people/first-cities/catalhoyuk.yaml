id: people/first-cities/catalhoyuk
kind: settlement
summary: >-
  Çatalhöyük, on the Konya Plain of south-central Turkey, a very large Neolithic settlement of back-to-back mud-brick houses entered from the roof, far older than any city here. It is
  not counted as a city: with some thousands of people and no sign of central administration or hierarchy, it is called a megasite or proto-urban, and whether such a place is
  urban at all is what scholars debate. It is here as the scale people reached before cities.
author: machine:claude-code
same_as: { wikidata: Q192522, pleiades: 483473194 }
claims:
  name:
    prop: name
    value: { en: Çatalhöyük }
    source: { ref: src:pleiades-catalhoyuk, loc: "place 483473194, title" }
  start-larsen:
    prop: start
    value: 7100 BCE
    source:
      ref: src:larsen-2019-catalhoyuk
      loc: introduction
      quote: spanning 1,150 y of continuous occupation (ca. 7100–5950 cal BCE)
    method: radiometric/radiocarbon
    rank: preferred
    note: The East Mound. Preferred as calibrated dates from the latest excavation team, where UNESCO's page gives older round figures.
  start-unesco:
