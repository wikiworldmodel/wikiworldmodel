      loc: introduction
      quote: spanning 1,150 y of continuous occupation (ca. 7100–5950 cal BCE)
    method: radiometric/radiocarbon
    rank: preferred
    note: The end of the Neolithic settlement on the East Mound, which is the large settlement this record is about.
  end-unesco:
