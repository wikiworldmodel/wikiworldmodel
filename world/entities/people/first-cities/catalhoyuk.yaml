  frame:
    prop: frame
    value: frame:paleomap/plate-504
    source: { ref: src:paleomap-plate-model, loc: PALEOMAP_PlatePolygons.gpml }
    method: plate-polygon
    basis: reconstruction
  area:
    prop: settlement_area
    value: 13
    valid: { lo: 6700 BCE, hi: 6500 BCE }
    source:
      - ref: src:larsen-2019-catalhoyuk
        loc: introduction
        quote: a large tell measuring 13 ha with nearly 21 m of stratified deposits
      - ref: src:der-issavi-2017-catalhoyuk
        loc: abstract
        quote: "At 13 hectares, with 18 levels of Neolithic occupation spanning 1100 years, and peaking at around 8000 inhabitants"
      - ref: src:mazzucato-2019-catalhoyuk-networks
        loc: p. 2 (Introduction)
        quote: lack any clear sign of centralized systems of administration or hierarchical arrangements of power
      - ref: src:mazzucato-2019-catalhoyuk-networks
        loc: p. 2 (Introduction)
        quote: they have been viewed as proto-urban sites or “proto-cities”
    method: survey
    rank: preferred
    note: >-
      The tell as it stands, set here at the peak of the settlement. Why this is not counted a city: Mazzucato notes that Neolithic megasites are dense and long-lived but lack
      central administration, and that they have been called anomalies or dead ends on the way to urbanity, or else proto-urban. Der and Issavi take the question up, and
      UNESCO's statement speaks of villages developing into urban centres.
