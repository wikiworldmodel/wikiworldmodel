id: people/first-cities/erlitou
kind: settlement
summary: >-
  Erlitou, in the Yiluo River Basin at Yanshi in Henan, China: a site of about 300 hectares in the first half of the second millennium BCE, with palaces inside walled compounds and
  workshops for bronze, ceramics, bone and jade, at the centre of the first large polity of the Central Plain. Whether it was a capital of the legendary Xia dynasty is argued; no
  claim here says so.
author: machine:claude-code
same_as: { wikidata: Q2692927 }
