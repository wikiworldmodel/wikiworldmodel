id: people/first-cities/liangzhu
kind: settlement
summary: >-
  Liangzhu, in the lower Yangtze region of China, the capital of a Neolithic rice-farming state: a city of about 300 hectares, with an outer city, and dams, levees and ditches that managed its water.
  It was abandoned about 4,300 years ago, and speleothem records tie that to climate change and floods.
