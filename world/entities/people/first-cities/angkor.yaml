id: people/first-cities/angkor
kind: settlement
summary: >-
  Angkor, in Cambodia, the capital of the Khmer Empire and one of the largest settlement complexes before the modern era: temples at its civic-ceremonial centres, within a vast low-density landscape of
  embankments, fields and water works. Current modelling gives 700,000 to 900,000 people in the whole 3,000 km² region at its height, of whom about 160,000 lived in the centres. Its decline
  was slow: land use in the walled city of Angkor Thom was falling from the early fourteenth century, long before the fall of 1431.
author: machine:claude-code
same_as: { wikidata: Q163607, pleiades: 531398484 }
claims:
  name:
    prop: name
    value: { en: Angkor }
    source: { ref: src:pleiades-angkor, loc: "place 531398484, title" }
  start-klassen:
    prop: start
    value: { lo: 801 CE, hi: 900 CE }
    source:
      ref: src:klassen-2021-angkor-population
      loc: abstract
      quote: Angkor is one of the world’s largest premodern settlement complexes (9th to 15th centuries CE)
    method: expert-estimate
    rank: preferred
    note: The ninth century. The paper's Table 1 begins its first period, of 248,696 people in all, in 770, so some settlement is older.
  start-pleiades:
    prop: start
    value: 889 CE
    source:
      ref: src:pleiades-angkor
      loc: "place 531398484, description"
