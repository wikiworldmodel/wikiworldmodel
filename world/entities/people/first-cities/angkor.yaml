      quote: the 15th-century CE abandonment of Angkor, Cambodia
    method: stratigraphic
    rank: preferred
    note: >-
      Preferred because this paper's dated sediments show land use falling from the first decades of the 14th century, with the moat of Angkor Thom unmaintained by that century's end,
