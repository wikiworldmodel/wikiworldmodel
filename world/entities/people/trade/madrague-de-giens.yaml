id: people/trade/madrague-de-giens
kind: event/shipwreck
summary: >-
  A great Roman freighter, about 40 m long, that sank off the peninsula of Giens in Provence in the second quarter of the
  first century BCE with some 6,000 amphorae of wine from the plain of Fondi in Latium and crates of Campanian tableware,
  probably bound for the Gulf of Fos and the Rhône. Excavated from 1972 to 1982, it was France's demonstration that a
  wreck could be dug as rigorously as a site on land.
author: machine:claude-code
same_as: { wikidata: Q6728460 }
