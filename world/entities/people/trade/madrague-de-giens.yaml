    prop: name
    value: { en: Madrague de Giens shipwreck, fr: Épave de la Madrague de Giens }
    source: { ref: src:carre-2018-madrague-de-giens, loc: "p. 57", quote: "L ’épave de la Madrague de Giens a été fouillée entre 1972 et" }
