id: people/trade/kangju-envoys-slip
kind: occurrence
summary: >-
  A slip from Xuanquan recording an embassy from the King of Kangju, in Sogdiana and the steppe beyond it, coming in through
  the Yumen Pass in 52 BCE: two envoys, ten nobles and 64 attendants, with two horses and ten camels as tribute and their own
  nine horses, 31 donkeys, 25 camels and an ox, their goods checked at the pass. Kangju's envoys of 39 BCE complained of how
  they had been treated, in another file of slips. Zhang (2026) sets such slips against the claim that hardly anyone went
  the whole way.
author: machine:claude-code
