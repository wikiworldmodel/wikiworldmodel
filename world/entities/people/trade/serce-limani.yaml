id: people/trade/serce-limani
kind: event/shipwreck
summary: >-
  A small Byzantine merchant ship, the "Glass Wreck", driven onto the rocks in the natural harbour of Serçe Limanı in
  southern Turkey about 1025, with three tons of raw and broken glass from the Fatimid Syrian coast, carried as ballast.
  Excavated in 1977–79. It is a key to Islamic glass, and to how ships were built in its time.
author: machine:claude-code
same_as: { wikidata: Q114364370 }
