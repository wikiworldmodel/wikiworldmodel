  name:
    prop: name
    value: { en: Serçe Limanı shipwreck }
    source: { ref: src:ina-serce-limani, loc: paragraph 2, quote: "excavated the Serçe Limanı wreck during the summers of 1977–79" }
  date:
    prop: date
    value: { lo: 1025 CE, hi: 1030 CE }
    source:
