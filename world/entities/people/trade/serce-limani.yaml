      - ref: src:ina-serce-limani
        loc: paragraph 1
        quote: "During the latter part of the 3rd decade of the 11th century, a Byzantine merchant ship made her way westward"
      - ref: src:aramco-1984-shards-of-history
        loc: paragraph beginning 'Two finds'
        quote: "Two finds — a dozen copper coins and the 16 glass weights — helped date the wreck to about 1025."
    method: numismatic
    note: >-
      INA's page is headed "A.D. 1025". Coins and glass weights give a time after which it sank. The final report (Bass et al.
      2004) was not read.
