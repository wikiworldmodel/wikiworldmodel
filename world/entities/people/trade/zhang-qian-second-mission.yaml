id: people/trade/zhang-qian-second-mission
kind: event
summary: >-
  Zhang Qian's embassy to the Wusun, with 300 men, oxen and sheep in myriads and gifts of gold and silk. He failed to bring
  them back east as allies, but sent his deputies on to Ferghana, Sogdiana, the Yuezhi, Bactria, Parthia, India and Khotan,
  and they came home with envoys of those countries. "After this the countries of the Northwest began to have intercourse with
  China", the Shiji says. The Xuanquan slips go on to record traffic with the Wusun for a hundred years.
