id: people/trade/palmyra-tariff
kind: occurrence
summary: >-
  The tax law of Palmyra, cut on a stele in Palmyrene and Greek and set up in the agora in 137 CE: the council's revised tariff
  of dues on goods entering and leaving the city, distinguishing loads carried by camel, donkey and cart. One of the chief
  documents of the economy of the Roman East, and now in the Hermitage. Scholars differ on how much it shows of long-distance
  trade and how much of local.
author: machine:claude-code
