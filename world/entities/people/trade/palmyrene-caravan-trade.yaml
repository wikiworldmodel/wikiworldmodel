        quote: "1. Inv. IX,6 (CIS II 3924). 19 A.D."
      - ref: src:getty-ancient-palmyra
        loc: "section 'Long-distance trade'"
        quote: "over 40 inscriptions dating between 19 and 270 CE that honored leaders and supporters of the caravan trade."
    method: documentary
    note: The earliest of the honorific inscriptions, by "merchants from Seleucia", a word largely restored, he notes.
