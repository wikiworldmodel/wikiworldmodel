id: people/trade/bom-jesus
kind: event/shipwreck
summary: >-
  A Portuguese nau that left Lisbon in March 1533 for India, in a fleet of seven ships, and was lost on the coast of what is
  now Namibia. Part of it was found on 1 April 2008 at Oranjemund, with copper ingots of the Fuggers among other things. The
  excavation is not entirely published.
