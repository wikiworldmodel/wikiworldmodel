id: people/trade/mary-rose
kind: event/shipwreck
summary: >-
  Henry VIII's warship, built from 1509 and lost in the Solent on 19 July 1545, in the Battle of the Solent, with most of her
  crew. Silt filled half of her hull within months, and that half was recovered over 400 years later with her contents and
  her dead. She was no trader, and is here as the last and the best dated of these wrecks.
