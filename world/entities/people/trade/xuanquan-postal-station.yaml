id: people/trade/xuanquan-postal-station
kind: building/civic
summary: >-
  The Han relay station at Xuanquan, in the desert of Dunhuang, one of nine in that commandery and some 45 known between
  Chang'an and the frontier. It normally had 37 staff, 40 horses and over ten carriages. Excavated in 1990–92, it gave
  more than 35,000 wooden and bamboo slips, the largest such find, recording who passed through and what they were fed: the
  daily paperwork of the eastern road. Two mileage records, one of them from here, list the stations from Chang'an to Dunhuang.
