id: people/rulers/septimius-severus
kind: person
summary: >-
  An African-born general, hailed by the Danube legions in 193, who won the civil wars and died
  at York.
author: machine:claude-code
same_as: { wikidata: Q1442 }
phases:
  - id: before
    label: Before his reign
  - id: reign
    label: Emperor of Rome
claims:
  name:
    prop: name
    value: { en: Septimius Severus }
    source:
      ref: src:historia-augusta
      loc: "Septimius Severus 1.2"
      quote: His native city was Leptis
  start-dio:
    prop: start
    value: 11 April 145 CE
    source:
      ref: src:cassius-dio-roman-history-56-80
      loc: "Epitome of Book 77, 17.4, vol. 9 p. 277"
      quote: He lived sixty-five years, nine months, and twenty-five days, for he was born on the eleventh of April
    method: historical-account
    rank: preferred
    note: >-
      Dio knew him, and his day has support in a correction of the Historia Augusta's numeral.
      The year is worked out from his count back from 4 February 211.
  start-ha:
    prop: start
    value: 8 April 146 CE
    source:
      ref: src:historia-augusta
      loc: "Septimius Severus 1.3"
      quote: He himself was born six days before the Ides of April, in the first consulship of Severus and the second of Erucius Clarus
    method: historical-account
    note: >-
      The sixth day before the Ides of April is the 8th, and those consuls are of 146 CE.
      Clinton (a. 146) notes Casaubon's emendation of the numeral from VI to III, which gives 11
      April, Dio's day.
  reign-start-carnuntum:
    prop: start
    subject: "@reign"
    value: 13 April 193 CE
    source:
      - ref: src:historia-augusta
        loc: "Septimius Severus 5.1"
        quote: this took place at Carnuntum on the Ides of August
      - ref: src:historia-augusta
        loc: "Magie's note to Septimius Severus 5.1"
        quote: The date was probably the Ides of April
    method: expert-estimate
    basis: reconstruction
    rank: preferred
    note: >-
      The Historia Augusta's month is impossible, as Magie says, for when Didius Julianus was
      killed on 1 June Severus was already near Rome; his correction is taken here.
  reign-start-dio:
    prop: start
    subject: "@reign"
    value: 1 June 193 CE
    source:
      ref: src:cassius-dio-roman-history-56-80
      loc: "Epitome of Book 77, 17.4, vol. 9 p. 277"
      quote: Of this period he had ruled for seventeen years, eight months, and three days
    method: historical-account
    note: >-
      Dio's count back from 4 February 211 reaches about 1 June 193: he reckons from the fall of
      Didius Julianus, when the senate named Severus emperor (74.17).
  end:
    prop: end
    value: 4 February 211 CE
    source:
      - ref: src:cassius-dio-roman-history-56-80
        loc: "Epitome of Book 77, 15.2, vol. 9 p. 271"
        quote: his sickness carried him off on the fourth of February
      - ref: src:historia-augusta
        loc: "Septimius Severus 19.1"
        quote: he died at Eboracum in Britain
    method: historical-account
    note: The year follows from Dio's length of the reign.
  location:
    prop: location
    value: { lat: 32.636448, lon: 14.297094, frame: frame:earth/present-day }
    source:
      - ref: src:pleiades-lepcis-magna
        loc: "representative point"
      - ref: src:historia-augusta
        loc: "Septimius Severus 1.2"
        quote: His native city was Leptis
    method: gazetteer
    note: Marked at Lepcis Magna, his home city, at Pleiades' point.
  frame:
    prop: frame
    value: frame:paleomap/plate-715
    source: { ref: src:paleomap-plate-model, loc: PALEOMAP_PlatePolygons.gpml }
    method: plate-polygon
    basis: reconstruction
relations:
  held-office:
    rel: held-office
    subject: "@reign"
    to: people/polities/rome@empire
    source:
      ref: src:cassius-dio-roman-history-56-80
      loc: "Epitome of Book 77, 17.4, vol. 9 p. 277"
      quote: he had ruled for seventeen years
    note: Emperor.
