id: people/dispersals/oase-1
kind: occurrence
summary: >-
  The genome of a man from Peștera cu Oase, Romania, from a mandible about 40,000 years old. He had
  a Neanderthal ancestor as few as four to six generations back, and his population left no clear
  mark on later Europeans.
