summary: >-
  A maxilla with its teeth from Misliya Cave on Mount Carmel, Israel, with Levallois stone tools: the
  oldest modern human fossil known outside Africa when it was published, and a sign that members of
  the Homo sapiens clade left Africa much earlier than the main dispersal.
