id: people/dispersals/bacho-kiro-f6-620
kind: occurrence
summary: >-
  The genome of a man from Bacho Kiro Cave, Bulgaria, one of three Initial Upper Palaeolithic
  individuals sequenced there, about 45,000 years old. All three were closer to later people in East
  Asia and the Americas than to later west Eurasians, and all had recent Neanderthal ancestors.
