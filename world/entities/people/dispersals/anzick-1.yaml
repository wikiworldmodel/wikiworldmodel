id: people/dispersals/anzick-1
kind: occurrence
summary: >-
  The genome of an infant buried with Clovis tools at the Anzick site in western Montana, about
  12,600 years ago: closer to all indigenous Americans than to any other people, and compatible
  with a population directly ancestral to many of them.
