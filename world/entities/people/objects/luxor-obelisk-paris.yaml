      - ref: src:gorringe-1882-egyptian-obelisks
        loc: "p. 89, Schroeder's chapter"
        quote: "the foot of the western ramp at the Pont de la Concorde was naturally chosen"
    method: gazetteer
    note: Placed at the bridge's point; the ramp is at its end.
