  neues-museum-start:
    prop: start
    subject: "@neues-museum"
    value: October 1913 CE
    source:
      - ref: src:culturcooperation-nefertiti-chronology
        loc: "1913, 'Nefertiti's journey to Berlin'"
        quote: "In October 1913 he handed the bust and other finds from the dig to the Berlin Museum on permanent loan."
      - ref: src:smb-nofretete-die-praesentation
        loc: paragraph 2
        quote: "Danach übergab er sie zusammen mit den anderen Objekten als Dauerleihgabe dem Ägyptischen Museum."
    method: historical-account
    rank: preferred
    note: >-
      The museum puts the loan straight after the showing to the Kaiser, without a month; the chronology
      gives October. It was then kept from view: the Amarna finds were shown in November 1913 without it,
      and it was first shown on 1 April 1924.
  neues-museum-start-spk-2024:
    prop: start
    subject: "@neues-museum"
    value: 1920 CE
    source:
      ref: src:spk-2024-nefertiti-first-exhibition
      loc: "paragraph beginning 'As the sole financier'"
      quote: "He initially kept the bust of Nefertiti in his villa in Tiergartenstraße. In 1920, Simon donated the bust and all the finds from the excavation to the Berlin museums."
    method: historical-account
    note: The Stiftung's sentence can be read as the bust staying at the villa until Simon's gift of 1920, on 11 July by the museum's page. It does not say so outright.
