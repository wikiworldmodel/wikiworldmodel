id: people/objects/bust-of-nefertiti
kind: artefact/moved
summary: >-
  The painted limestone and stucco bust of Queen Nefertiti, made about 1351-1334 BCE and found on 6
  December 1912 in the workshop of the sculptor Thutmose at Amarna. It reached Berlin in 1913, spent the
  war in shelters and then a mine, was kept by the Americans at Wiesbaden, was shown in West Berlin, and
  has been in the Neues Museum again since 2009.
author: machine:claude-code
same_as: { wikidata: Q582172 }
