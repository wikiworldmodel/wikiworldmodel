id: people/objects/okukor
kind: artefact/moved
summary: >-
  A bronze cockerel of the royal court of Benin, one of the Benin Bronzes, looted in the British
  expedition of 1897 and given to Jesus College, Cambridge, in 1905. The college handed it to Nigeria's
  museums commission on 27 October 2021, and it was returned to the Oba's palace in Benin City on 19
  February 2022.
author: machine:claude-code
same_as: { wikidata: Q55099230 }
