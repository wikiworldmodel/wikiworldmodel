id: people/objects/stone-of-scone
kind: artefact/moved
summary: >-
  The block of sandstone on which Scottish kings were made at Scone, taken to Westminster Abbey by
  Edward I in 1296 and used to crown English and British monarchs. Students took it on Christmas morning
  1950 and left it at Arbroath Abbey in April 1951. It went back to Scotland in 1996 and to Perth in 2024.
author: machine:claude-code
same_as: { wikidata: Q756442 }
phases:
  - id: scone
    label: Scone
  - id: westminster
    label: Westminster Abbey, London
  - id: hidden
    label: Hidden, after its removal from the Abbey
    gap: true
  - id: arbroath
    label: Arbroath Abbey
  - id: westminster-again
    label: Westminster Abbey, London
  - id: edinburgh
    label: Edinburgh Castle
  - id: coronation
    label: Westminster Abbey, for a coronation
  - id: edinburgh-again
    label: Edinburgh Castle
  - id: perth
    label: Perth Museum
claims:
  name:
    prop: name
    value: { en: Stone of Scone }
    source: { ref: src:westminster-abbey-coronation-chair, loc: "section 'Stone of Scone'", quote: "Legends abound concerning the Stone of Scone." }
    note: Also the Stone of Destiny, the name the Perth Museum uses.
  scone-start:
    prop: start
    subject: "@scone"
    value: { hi: 1249 CE }
    source:
      ref: src:perth-museum-stone-of-destiny
      loc: "section 'About the Stone of Destiny', paragraph 1"
      quote: "Its first documented use was in 1249 for the inauguration of the boy-king, Alexander III."
    method: documentary
    note: >-
      One-sided: no later than its first documented use. The Abbey's page tells the older legends, of Jacob
      and of Tara, and says of them only that it had been revered for centuries; the Perth Museum says it
      is sandstone quarried in the Scone area.
