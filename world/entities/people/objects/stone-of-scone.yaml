  westminster-again-start:
    prop: start
    subject: "@westminster-again"
    value: 13 April 1951 CE
    source:
      - ref: src:glasgow-police-museum-stone-of-destiny
        loc: "section 'The Stone Arrives at Glasgow's Central Police Office'"
        quote: "The new police plan was put into action at 5am on Friday, 13 April, 1951"
      - ref: src:westminster-abbey-coronation-chair
        loc: "section 'Theft and return to Scotland'"
        quote: "After its recovery in April 1951 it was kept in the vault in which it had been stored during the Second World War"
    method: historical-account
    note: >-
      The police say it was taken from Arbroath to their Central Police Office in Glasgow, and left for
      London in the boot of a Jaguar early on 13 April, by way of Newcastle; they imply it arrived the same
      day. Two days in Glasgow are too short to mark here. It went back under the Coronation Chair in early
      1952: February by the Abbey, April by the police.
