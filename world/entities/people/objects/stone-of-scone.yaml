        quote: "illicitly removed from the Coronation Chair in Westminster Abbey on Christmas morning 1950, hidden in Scotland"
    method: documentary
    note: Its hiding places over the next months are not placed in anything read, so this phase has no place, and the marker stays at Westminster.
