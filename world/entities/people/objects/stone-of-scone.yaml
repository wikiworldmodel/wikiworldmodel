    value: 10 April 1951 CE
    source:
      ref: src:glasgow-police-museum-stone-of-destiny
      loc: "section 'The Stone is Recovered in Arbroath Abbey'"
      quote: "the conspirators symbolically left the Stone in Arbroath Abbey on Tuesday 10 April, 1951"
    method: historical-account
    note: The account of the force that took it in charge the same evening, a day before Foster's date. Neither was checked against the newspapers of that week.
