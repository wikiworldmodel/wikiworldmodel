    source:
      - ref: src:smb-eighth-wonder-of-the-world
        loc: "section 'Destruction and reconstruction'"
        quote: "The friezes were taken off as war booty to the Hermitage museum in St. Petersburg, where plaster casts were made of the altar reliefs."
      - ref: src:smb-eighth-wonder-of-the-world
        loc: "section 'Destruction and reconstruction'"
        quote: "In 1945 the Soviet Army captured Berlin and took most of the inventory of the Berlin Collection of Classical Antiquities."
      - ref: src:smb-return-of-the-gods
