id: people/objects/pergamon-altar
kind: artefact/moved
summary: >-
  The great altar of Pergamon, as far as it moved: chiefly its frieze, 113 m of gods fighting giants,
  carved in the second quarter of the second century BCE. Dug out of a Byzantine wall from 1878 and shipped
  to Berlin, it was shown in three museums there, taken to the Soviet Union in 1945 and returned to East
  Berlin in 1958.
author: machine:claude-code
same_as: { wikidata: Q158058, pleiades: 2604669 }
phases:
