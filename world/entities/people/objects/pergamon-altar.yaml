    subject: "@altes-museum"
    value: { lo: February 1879 CE, hi: 1880 CE }
    source:
      - ref: src:conze-1880-ergebnisse-pergamon
        loc: "p. 22, Humann's narrative, on the loads of January 1879"
        quote: "Die Reliefs gelangten im Februar glücklich nach Berlin"
      - ref: src:smb-eighth-wonder-of-the-world
        loc: "section before 'The Pergamon Altar arrives in Berlin'"
        quote: "The excavation of the largest known altar of the ancient world lasted two years, with the initial campaign coming to an end in 1880."
      - ref: src:smb-eighth-wonder-of-the-world
        loc: "section 'The Pergamon Altar arrives in Berlin'"
        quote: "they were exhibited in the heart of Berlin, in the Rotunda of the Altes Museum"
    method: documentary
    note: >-
      A group that moved over months, so a range, from the first shipment reaching Berlin to the end of the
      first campaign. A few pieces had gone earlier: Humann sent the first reliefs from the wall to Berlin
      in the early 1870s and more in 1878. Later campaigns added more.
