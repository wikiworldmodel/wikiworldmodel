      quote: "The north frieze of the Altar (2nd Quarter 2nd century BCE)"
    method: historical-account
    note: The museum's date, written out as the years of that quarter. It lay broken and built into a Byzantine wall on the acropolis before it left, so the marker has the same place throughout.
