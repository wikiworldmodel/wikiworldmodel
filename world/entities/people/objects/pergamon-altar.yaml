    label: Pergamon
  - id: altes-museum
    label: Altes Museum, Berlin
  - id: first-pergamonmuseum
    label: First Pergamonmuseum, Berlin
  - id: storage
    label: In storage in Berlin
    gap: true
  - id: pergamonmuseum
    label: Pergamonmuseum, Berlin
  - id: zoo-tower
    label: Flak tower at the Zoo, Berlin
  - id: hermitage
    label: Hermitage, Leningrad
  - id: pergamonmuseum-again
    label: Pergamonmuseum, Berlin
