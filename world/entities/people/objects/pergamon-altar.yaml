    value: { en: Pergamon Altar }
    source: { ref: src:smb-eighth-wonder-of-the-world, loc: subtitle, quote: "The recent story of the Pergamon Altar" }
  pergamon-start:
    prop: start
    subject: "@pergamon"
    value: { lo: 175 BCE, hi: 151 BCE }
    source:
