  burlington-house-start:
    prop: start
    subject: "@burlington-house"
    value: { lo: 1807 CE, hi: 1812 CE }
    source:
      - ref: src:select-committee-1816-elgin-marbles
        loc: "Appendix, pp. xviii-xix, Elgin's statement of 1816"
        quote: "finally to Burlington House"
      - ref: src:select-committee-1816-elgin-marbles
        loc: "Appendix, p. xv, Elgin's statement of 29 February 1816"
        quote: "now forming part of my Collection in Burlington-House."
    method: documentary
    note: Elgin gives the two houses together, for 1807 to 1812, and not the year he moved the marbles between them, so a range. Burlington House was sold by the spring of 1815, and the marbles stayed until the sale to the nation.
