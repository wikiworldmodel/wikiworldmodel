id: people/objects/parthenon-sculptures
kind: artefact/moved
summary: >-
  The part of the sculptures of the Parthenon that Lord Elgin's agents took from Athens from 1801: 15
  metopes, 17 pedimental figures and 75 m of the frieze, as the British Museum counts them. Shipped to
  England over a decade and shown in his houses, they passed to the Museum under an Act of 1816. The
  sculptures left in Athens are not this record.
author: machine:claude-code
same_as: { wikidata: Q606662 }
phases:
  - id: parthenon
    label: On the Parthenon, Athens
  - id: park-lane
    label: Lord Elgin's house, Park Lane, London
  - id: burlington-house
    label: Burlington House, London
  - id: british-museum
    label: British Museum, London
