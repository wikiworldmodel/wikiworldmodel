    value: frame:paleomap/plate-307
    source: { ref: src:paleomap-plate-model, loc: PALEOMAP_PlatePolygons.gpml }
    method: plate-polygon
    basis: reconstruction
  park-lane-start:
    prop: start
    subject: "@park-lane"
    value: { lo: 1802 CE, hi: 1807 CE }
    source:
      - ref: src:select-committee-1816-elgin-marbles
        loc: "Appendix, p. xviii, Elgin's statement of 1816"
        quote: "since the Marbles began to arrive, fourteen years ago"
      - ref: src:select-committee-1816-elgin-marbles
        loc: "Appendix, p. xv, Elgin's statement of 29 February 1816"
        quote: "laid open to public inspection in my house in Park-Lane, and in Burlington-House, from the year 1807 to 1812"
      - ref: src:british-museum-parthenon-sculptures
        loc: "section 'How did they come to the British Museum?'"
        quote: "between 1801 and 1805 acting under the oversight of the relevant authorities, Elgin removed about half of the remaining sculptures"
    method: documentary
    note: >-
      A group that moved over years, so a range: the first cases reached England in 1802, by Elgin's
      reckoning, and the great body of the collection was on show by 1807. The work at Athens began in the
      summer of 1801; the Mentor sank off Cerigo with cases of frieze and metopes, and they were raised
      over the next years. In England they went first to the Duchess of Portland's in Privy Gardens and the
      Duke of Richmond's. Some of the sculptures stayed in Athens until later: about eighty more cases
      reached England towards the end of 1812.
