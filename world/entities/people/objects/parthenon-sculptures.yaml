    prop: location
    subject: "@park-lane"
    value: { lat: 51.508542, lon: -0.154806, frame: frame:earth/present-day }
    source:
      - { ref: src:wikidata-park-lane, loc: "Q378991, P625 coordinate location" }
      - ref: src:select-committee-1816-elgin-marbles
        loc: "Appendix, pp. xviii-xix, Elgin's statement of 1816"
        quote: "afterwards to my house in Park-Lane"
    method: gazetteer
    note: The street; the house is not placed here, but Elgin dates a letter from "6, Park Lane" in 1811.
