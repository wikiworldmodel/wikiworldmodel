    prop: name
    value: { en: Parthenon Sculptures }
    source: { ref: src:british-museum-parthenon-sculptures, loc: title, quote: "The Parthenon Sculptures" }
    note: They are also called the Elgin Marbles, the name in the Act of 1816 and in the Select Committee's report.
