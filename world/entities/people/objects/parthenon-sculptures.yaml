    subject: "@british-museum"
    value: { lo: 1 July 1816 CE, hi: 1816 CE }
    source:
      - ref: src:elgin-marbles-act-1816
        loc: "56 George 3 c. 99, heading"
        quote: "[1st July 1816.]"
      - ref: src:british-museum-parthenon-sculptures
        loc: "section 'How did they come to the British Museum?'"
        quote: "prior to the sculptures entering the collection of the British Museum by Act of Parliament"
    method: documentary
    note: The Act vested the collection in the Trustees on 1 July 1816. The day the marbles were carried from Burlington House was not found in anything read, so this runs from the Act to the end of the year.
