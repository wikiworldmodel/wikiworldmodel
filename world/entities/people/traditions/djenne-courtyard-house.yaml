        quote: >-
          The town of Jenné is about two miles and half in circumference; it is surrounded by a very ill constructed earth
          wall, about ten feet high, and fourteen inches thick.
      - ref: src:wikipedia-djenne
        loc: section "After the Songhai"
        quote: At the time of his visit the town was still encircled by an adobe wall.
    method: documentary
    note: A walled town in 1828, and still in 1895, when Félix Dubois visited it.
