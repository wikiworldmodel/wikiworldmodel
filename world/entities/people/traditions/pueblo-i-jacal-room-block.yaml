id: people/traditions/pueblo-i-jacal-room-block
kind: tradition/building
summary: >-
  The first pueblos, of the Pueblo I period: flat-roofed rooms at ground level in rows or crescents, built of jacal, a frame
  of wooden posts holding woven material covered with mud, with stone slabs at the foot of the walls late in the period, in
  villages larger than the Basketmaker settlements before them, where pit houses were still in use.
author: machine:claude-code
