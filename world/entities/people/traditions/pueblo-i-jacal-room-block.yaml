  name:
    prop: name
    value: { en: Pueblo I jacal room block }
    unsourced: An editorial label.
  start-bocinsky:
    prop: start
    value: 700 CE
    source:
      ref: src:bocinsky-2016-pueblo-macrohistory
      loc: Results
      quote: >-
        The revised Pecos periods (bounded to be within A.D. 500–1400) are as follows: BM III, A.D. 500–700; P I, A.D.
        700–890; P II, A.D. 890–1145;
    method: dendrochronology
    rank: preferred
    note: >-
      Pueblo I as the paper redates it from the frequencies of tree-ring cutting dates. Preferred over the encyclopedia's
      dates as the period dated from evidence, in a peer-reviewed paper.
