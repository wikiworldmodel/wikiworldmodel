        loc: section "Architecture"
        quote: >-
          At the beginning of the period pueblos were made with jacal construction. Wooden posts were used to create a frame
          to supported woven material and a covering of mud. Later in the period, stone slabs were sometimes used around the
          dwelling foundation.
      - ref: src:bocinsky-2016-pueblo-macrohistory
