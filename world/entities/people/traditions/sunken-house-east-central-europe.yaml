id: people/traditions/sunken-house-east-central-europe
kind: tradition/building
summary: >-
  The sunken-featured house of the open, unfortified settlements of the ninth and tenth centuries in today's Austria, Czech
  Republic, Slovakia and Hungary, the commonest building there, and a dwelling, unlike the sunken huts of western Europe in
  the same centuries.
