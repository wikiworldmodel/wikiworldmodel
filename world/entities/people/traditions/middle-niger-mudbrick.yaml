      loc: section "Agriculture and urban organization"
      quote: The Djenné-Djeno urban complex consists of 40 mounds within a four-kilometer radius.
    method: excavation
    note: >-
      A clustered town: the mounds of Jenne-jeno lay close together but apart, which the source reads as communities
      specializing in their trades, and the main mound had a city wall. The same article elsewhere has the main mound
      surrounded by 69 other mounds. The villages of the delta are not described.
