        loc: section "Later Phases"
        quote: >-
          Other developments include the presence of permanent mud brick architecture, including a city wall, probably built
          during the latter half of the first millennium CE using the cylindrical bricks historically made by Djenné masons.
      - ref: src:wikipedia-djenne
        loc: section "Architecture"
        quote: >-
          Nearly all of the buildings in the town, including the Great Mosque, are made from sun-baked earthen bricks which are
          coated with plaster.
    method: excavation
    note: >-
      Sun-dried mud brick, cylindrical in the old way of Djenné's masons, which the second source says were used up to the
      1930s, and moulded rectangular bricks since. The plan, size and roof of Jenne-jeno's houses are not described by the
      sources read, and are left to the generator.
    checked:
