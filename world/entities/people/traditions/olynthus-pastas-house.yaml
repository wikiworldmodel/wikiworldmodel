        loc: opening section
        quote: The city flourished between 432 BCE and its destruction by Philip II of Macedon in 348 BCE.
      - ref: src:wikipedia-olynthus
        loc: section "History", "Classical"
        quote: The synoecism led to a major increase in population leading to the settlement of the North Hill.
    method: expert-estimate
    note: >-
      The houses of this type stand on the North Hill, which was settled after the towns around were moved into Olynthus in
      432 BCE.
