id: people/traditions/olynthus-pastas-house
kind: tradition/building
summary: >-
  The house of Classical Olynthus in Chalcidice, northern Greece, known from the 108 buildings dug on its North Hill: houses
  of the "pastas" type, rooms around a courtyard and a wide passage, many with an upper storey, built ten to a block in two rows
  of five that shared their walls, on a grid of streets inside the city wall. The North Hill was settled after 432 BCE and
  the town razed in 348 BCE.
author: machine:claude-code
