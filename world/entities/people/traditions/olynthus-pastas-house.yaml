    note: >-
      The plan and the upper storey are Olynthus's, from the first source. The walls are from the second, which says of many
      Greek houses, not of Olynthus in particular, that their walls were of sun-dried brick, or of a timber frame filled with
      clay, on a stone base. The roof is left out: that source has thatch on simple houses and tile on substantial ones, and
      does not say which the Olynthus houses were.
