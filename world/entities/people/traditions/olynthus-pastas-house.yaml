        loc: section "Site topography", "Classical"
        quote: 'Each house followed the same basic "pastas" type, usually containing a courtyard, pastas, andron, and other indistinct rooms.'
      - ref: src:wikipedia-olynthus
        loc: section "Site topography", "Classical"
        quote: Many houses in Olynthus show signs of a second story.
      - ref: src:wikipedia-ancient-greek-architecture
