      The plan from the stones' arrangement in the field, the house on them from the Spanish accounts. The supports are
      capped stone pillars, 0.6 to 3 m high, not wooden posts; "stilts" is the nearest word. Whether ordinary people lived
      in these houses is disputed, and the article puts the cooking huts, canoe houses and young men's houses of a latte
      village on the ground; the generator draws every house of the tradition on latte. The walls, roof and size of the
      house are not given.
