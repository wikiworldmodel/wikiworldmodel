id: people/traditions/latte-house
kind: tradition/building
summary: >-
  The house on latte stones of the Mariana Islands, from about 900 CE: a rectangular house raised on two rows of stone
  pillars, eight to fourteen of them, each capped with a hemispherical stone. Spanish accounts of the sixteenth and
  seventeenth centuries say houses stood on them; whether everyone lived in such houses, or only people of rank, is
  argued. After Spanish colonization they fell out of use, and they were abandoned by about 1700. Read from an
  encyclopedia article only.
author: machine:claude-code
