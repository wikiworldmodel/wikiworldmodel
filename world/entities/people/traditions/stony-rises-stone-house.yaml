      quote: >-
        The houses are semi-circular dry-stone walled structures about two to three metres in diameter and have only been
        recorded in Western Victoria from areas of lava flow, known as the Stoney Rises.
    method: editorial
    note: >-
      Region 141 (Victoria and Tasmania). The houses are known only from the lava flows of western Victoria, a small part of
      the region; it is not claimed for the rest of it, nor for Tasmania.
