id: people/traditions/stony-rises-stone-house
kind: tradition/building
summary: >-
  The stone house of the Gunditjmara in the Stony Rises of western Victoria: a small horseshoe of dry-stone walling, two to
  three metres across, built straight onto the lava and roofed with saplings and bark, found by the hundred near the
  hollows of the lava that hold water around Lake Condah. The only one excavated and dated was lived in about 1840 to
  1870, on the pastoral frontier; whether such houses stood before European contact, and whether they made villages, is
  still argued, so the span here is the dated house's alone.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Stone house of the Stony Rises }
    unsourced: An editorial label.
  start:
    prop: start
    value: 1840 CE
    source:
      ref: src:mcniven-2017-kurtonitj-stone-house
      loc: abstract
      quote: >-
        Dating of metal objects to c.1840–1870 points to occupation during the period of violent resistance to European
        pastoral invasion in the 1840s and/or during the subsequent period of negotiated resistance while living and working
        on pastoral properties during the 1850s and 1860s.
    method: excavation
    note: >-
      About 1840, the earliest date the metal objects give for the one excavated house, KSH-1 at Kurtonitj. It is not the
      start of building in stone: the paper sets dating stone houses unambiguously before European contact as a task for
      future excavation, so older ones may stand undated.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in mcniven-2017-kurtonitj.txt (sha256 2d408b9e54435ddd), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-09" }
