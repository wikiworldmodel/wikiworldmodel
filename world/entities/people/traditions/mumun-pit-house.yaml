id: people/traditions/mumun-pit-house
kind: tradition/building
summary: >-
  The pit-house of the Mumun pottery period in Korea, about 1500–300 BCE, when farming took hold on the peninsula: a house
  dug into the ground, large and rectangular in the Early Mumun, smaller and square, round or oval from some time after
  900 BCE, in settlements mostly small but in the Middle Mumun of up to several hundred houses.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Pit-house of the Mumun period }
    unsourced: An editorial label.
  start:
    prop: start
    value: 1500 BCE
    source:
      ref: src:wikipedia-mumun-pottery-period
      loc: opening section
      quote: The Mumun pottery period is an archaeological era in Korean prehistory that dates to approximately 1500–300 BC.
    method: expert-estimate
    note: The start of the Mumun period, taken as the start of its house; pit-houses were built in Korea before it too.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-mumun-pottery-period.txt (sha256 1049b51639fe2ad3), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-09" }
  end:
    prop: end
    value: 300 BCE
    source:
      - ref: src:wikipedia-mumun-pottery-period
        loc: opening section
        quote: The Mumun pottery period is an archaeological era in Korean prehistory that dates to approximately 1500–300 BC.
      - ref: src:wikipedia-mumun-pottery-period
        loc: section "Chronology", "Late Mumun"
        quote: Thus, the Mumun is described as ending, as a cultural-technical period, by approximately 300 BC.
    method: expert-estimate
    note: >-
      The end of the Mumun period. The source has pit-houses after it as well, now with composite hearth-ovens inside; they
      are not this tradition.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-mumun-pottery-period.txt (sha256 1049b51639fe2ad3), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-09" }
