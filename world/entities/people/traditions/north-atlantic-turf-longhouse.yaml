id: people/traditions/north-atlantic-turf-longhouse
kind: tradition/building
summary: >-
  The longhouse of the Norse settlers of Iceland and Greenland: the Scandinavian long hall with a hearth down the middle and
  a timber frame, but with walls and roof of turf, as timber was scarce. Built from the settlement of Iceland in the ninth
  century until the fourteenth, when it was given up for clusters of small linked buildings.
author: machine:claude-code
