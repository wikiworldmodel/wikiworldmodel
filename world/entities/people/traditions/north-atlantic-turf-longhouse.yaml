    method: excavation
    note: >-
      A long hall with a central hearth on a timber frame, its walls of turf (the vocabulary's sod) and its roof covered
      with turf. In Greenland, where wood was short, internal walls rather than posts carried the roof. The size is not
      given in a source read, so the generator guesses it.
