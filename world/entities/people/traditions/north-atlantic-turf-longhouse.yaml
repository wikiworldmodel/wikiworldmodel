      loc: section "Evolution"
      quote: >-
        The first evolutionary step happened in the 14th century, when the Viking-style longhouses were gradually abandoned
        and replaced with many small and specialized interconnected buildings.
    method: expert-estimate
    note: >-
      The fourteenth century, when the longhouse was given up in Iceland, gradually. For Greenland, Jackson et al. (2018)
      have both longhouses and passage houses, and no source read says when the longhouse ended there.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-Icelandic_turf_house.txt (sha256 b900cc0e84632141), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-09" }
