      - ref: src:jackson-2018-norse-greenland
        loc: section "Accumulating Information – Landscape Learning in Greenland"
        quote: >-
          The limited availability of standing wood for the construction of longhouse structures, for example, meant wood
          beam supports were replaced with perpendicular internal walls to support the roof
