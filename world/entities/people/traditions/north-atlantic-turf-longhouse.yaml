    method: editorial
    note: >-
      Region 37 (Iceland) and region 13 (Greenland), where the Norse farms of the Eastern and Western Settlements lay in the
      southwest. A region named is where the sources place the house, not a claim that it covered the region; in Greenland
      the house stood only in the Norse settlements.
