        quote: Longhouses hold a strong continuity with the standard Scandinavian model.
      - ref: src:jackson-2018-norse-greenland
        loc: Table 2, row "Farm (Farmstead and Outbuildings)", column "Greenland"
        quote: >-
          Longhouse and passage house designs have a strong continuity with Icelandic internal spatial arrangements.
          Differences are associated with use of local materials on account of limited standing timber.
      - ref: src:nicosia-2022-oppeano-byre-houses
