id: people/traditions/indus-fired-brick-house
kind: tradition/building
summary: >-
  The courtyard house of the Indus cities where it was built of fired brick laid in mortar, as at Mohenjo-daro in Sindh, in
  the urban phase of about 2600–1900 BCE. Some houses had parts of sun-dried mudbrick and timber above.
author: machine:claude-code
