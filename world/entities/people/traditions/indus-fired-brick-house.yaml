      loc: section "Overview", "Planning"
      quote: >-
        Mohenjo-daro had a planned layout with rectilinear buildings arranged on a grid plan. … Most were built of fired and
        mortared brick; some incorporated sun-dried mud-brick and wooden superstructures.
    method: editorial
    note: >-
      Region 105 (Pakistan), which holds Mohenjo-daro, the city the source describes. Fired brick is also known at Harappa in
      the same region, but no source read here says so of its houses; and at Lothal, in India, the article read has houses
      of mud and brick, so the other regions are left to the broader tradition. Not claimed for all of the region.
    checked:
