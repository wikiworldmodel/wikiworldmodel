        loc: opening section
        quote: >-
          The cities of the ancient Indus were noted for their urban planning, baked brick houses, elaborate drainage
          systems, water supply systems, clusters of large non-residential buildings, and techniques of handicraft and
          metallurgy.
      - ref: src:wikipedia-harappan-architecture
        loc: section "Materials"
