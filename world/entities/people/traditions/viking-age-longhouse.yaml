id: people/traditions/viking-age-longhouse
kind: tradition/building
summary: >-
  The longhouse of Viking-Age Scandinavia: a long house on a timber frame set on stone footings, its walls of planks, logs
  or wattle and daub, often bowed so that the house was boat-shaped, its roof on internal posts, with a fire inside and
  benches along the walls, and the animals in stalls at one end where there was no stable. The richer the owner, the longer
  the house.
author: machine:claude-code
