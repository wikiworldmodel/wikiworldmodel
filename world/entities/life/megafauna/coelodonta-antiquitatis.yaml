        frontal: { type: spike, on: head, mat: horn, tint: 70, sides: [7, 4], from: [0, 0.1, 0.05], to: [0, 0.11, 0.14], r: 0.026 }
    unsourced: >-
      A machine's reconstruction: the form written for Rhinocerotidae, with the long front
      horn, the hump over the shoulders, the head carried low and the shaggy coat usually
      shown for the woolly rhinoceros; only compared with its sheet.
