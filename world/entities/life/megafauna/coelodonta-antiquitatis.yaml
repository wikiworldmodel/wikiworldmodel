            - [-0.32, 1.08, 0.38, 0.118]
            - [-0.2, 1.1, 0.32, 0.134]
            - [-0.06, 1.16, 0.3, 0.14]
            - [0.06, 1.3, 0.32, 0.13]
            - [0.15, 1.34, 0.4, 0.106]
            - [0.21, 1.2, 0.5, 0.08]
          neck: { r: 0.066, steps: [3, 1] }
        head:
          mat: fur
          at:
            stand: { y: 0.26, z: 0.8, pitch: 0.55 }
            alert: { y: 0.26, z: 0.96, pitch: 0.34 }
