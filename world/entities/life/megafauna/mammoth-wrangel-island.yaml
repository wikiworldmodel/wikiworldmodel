id: life/megafauna/mammoth-wrangel-island
kind: occurrence
summary: >-
  A woolly mammoth molar from Wrangel Island in the Arctic Ocean, radiocarbon-dated to about 4,300
  years ago, whose genome showed how small the island's last population had become. It is one of the
  youngest mammoths dated on the island, not the last.
author: machine:claude-code
