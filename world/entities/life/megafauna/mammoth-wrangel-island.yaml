  name:
    prop: name
    value: { en: "Woolly mammoth, Wrangel Island" }
    unsourced: An editorial label, from the taxon and the place name.
  identified:
    prop: identified_as
    value: Mammuthus primigenius
    source:
      ref: src:palkopoulou-2015-mammoth-genomes
      loc: "Results and Discussion, second paragraph"
      quote: "We extracted DNA from the remains of ten woolly mammoths from Wrangel Island"
  evidence:
    prop: evidence
    value: body-fossil
    unsourced: "Read from the record's own sources and summary: a molar tooth."
  location:
    prop: location
    value: { lat: 71.233333, lon: -179.4, frame: frame:earth/present-day }
    source: { ref: src:wikidata-wrangel-island, loc: "P625 coordinate location" }
    method: gazetteer
    note: >-
      A representative point for the whole island, at about 0.02° precision. Where on the island the
      tooth was found was not read.
  frame:
    prop: frame
    value: frame:paleomap/plate-103
    source: { ref: src:paleomap-plate-model, loc: "PALEOMAP_PlatePolygons.gpml" }
