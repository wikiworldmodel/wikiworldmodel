      loc: "Results and Discussion, second paragraph (AA 40665)"
      quote: "With a direct calibrated radiocarbon age of ~4,300 calendar years BP (AA 40665; Figure 1B, Table S1), this represents one of the most recently dated specimens that has been discovered on the island"
    method: radiometric/radiocarbon
    note: >-
      As the paper rounds it. The measured age and its error are in its Table S1, which was not
      read.
