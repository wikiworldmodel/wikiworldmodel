  name:
    prop: name
    value: { en: Younger Dryas cooling }
    unsourced: An editorial label, after the period.
  start:
    prop: start
    value: { ref: earth/ice-ages/younger-dryas, edge: start }
    source:
      ref: src:stewart-2021-north-american-megafauna
      loc: Discussion
      quote: "the unique conditions of the YD—i.e., abrupt cooling, increased seasonality, increased CO2, and major vegetation changes"
    method: stratigraphic
    note: >-
      The record exists because caused-by must point to an event, and the Younger Dryas is recorded
      as a period. Stewart et al. round the period to ~12.9–11.7 ka.
  end:
