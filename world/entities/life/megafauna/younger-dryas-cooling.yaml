id: life/megafauna/younger-dryas-cooling
kind: event/transition
summary: >-
  The abrupt return to cold of the Younger Dryas, with its fast changes in vegetation, as an event
  that a cause can name. Stewart et al. (2021) read North America's final megafauna declines as
  following its onset; O'Keefe et al. (2023) date seven species' disappearance at Rancho La Brea to
  just before it. Its dates are those of the period earth/ice-ages/younger-dryas, which holds the
  evidence for them.
author: machine:claude-code
