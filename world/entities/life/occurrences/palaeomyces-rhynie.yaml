id: life/occurrences/palaeomyces-rhynie
kind: occurrence
summary: >-
  The fungus Palaeomyces gordonii in the Rhynie chert, Aberdeenshire, Scotland. Not the oldest
  fungus known: older fungal hyphae and spores from the Ordovician of Wisconsin (about 460 Ma;
  Redecker et al. 2000) could not be located from a source read. PBDB collection 10721.
