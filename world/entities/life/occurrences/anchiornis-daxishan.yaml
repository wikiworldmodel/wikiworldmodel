id: life/occurrences/anchiornis-daxishan
kind: occurrence
summary: >-
  Anchiornis huxleyi from the Tiaojishan Formation at Daxishan, western Liaoning, China: a small feathered dinosaur with long
  feathers on its feet, older than Archaeopteryx. Described as a troodontid, it has since been recovered as an early
  bird; whether it flew is not settled. PBDB collection 91487.
same_as: { pbdb: "occ:829458" }
