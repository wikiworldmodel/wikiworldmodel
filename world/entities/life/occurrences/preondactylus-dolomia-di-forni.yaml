    rel: member-of
    to: life/taxa/sauropsida
    source:
      - { ref: src:pbdb/collection-83471, loc: "occurrence 777702, classification: Chordata, Reptilia, Pterosauria" }
      - ref: src:ezcurra-2020-lagerpetids
        loc: abstract
        quote: "strengthens the evidence that pterosaurs belong to the avian line of archosaurs"
    note: >-
      Archosaurs on the avian side, so within the reptile line of amniotes.
