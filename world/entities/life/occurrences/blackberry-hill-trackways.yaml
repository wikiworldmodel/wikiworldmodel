id: life/occurrences/blackberry-hill-trackways
kind: occurrence
summary: >-
  Arthropod trackways in tidal-flat and nearshore rocks of the middle to late Cambrian at Blackberry Hill, central
  Wisconsin, with the remains of the oldest euthycarcinoid, Mosineia: among the oldest signs of animals out of the
  water.
