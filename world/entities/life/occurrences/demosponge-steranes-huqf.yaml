    value: Demospongiae, from C30 steranes
    source:
      ref: src:love-2009-huqf-sponges
      loc: abstract
      quote: "abundant sedimentary 24-isopropylcholestanes, the hydrocarbon remains of C(30) sterols produced by marine demosponges"
  evidence:
