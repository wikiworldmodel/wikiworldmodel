        loc: "Introduction, first paragraph"
        quote: "sponge biomarkers at 713 to 635 Ma"
      - ref: src:love-2009-huqf-sponges
        loc: abstract
        quote: "The demosponge steranes occur in strata that underlie the Marinoan cap carbonate (>635 Myr ago)"
    method: stratigraphic
    note: >-
      The oldest of a record that goes on for 100 Myr into the Cambrian. Love et al. put the Sturtian at
      approximately 713 Myr ago in Oman, and find no convincing steranes before it.
