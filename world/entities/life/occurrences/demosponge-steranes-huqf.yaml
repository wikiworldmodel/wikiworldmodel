id: life/occurrences/demosponge-steranes-huqf
kind: occurrence
summary: >-
  24-isopropylcholestanes in the Huqf Supergroup of the South Oman Salt Basin: fossil steroids read as the
  remains of demosponges, and so as the oldest sign of animals. Unicellular Rhizaria or algae may have made
  them instead, and the question stands open, so no taxon is recorded here. The abstract read names only the basin, not its wells
  or sections, so no location is recorded either, and the record does not appear on the globe.
author: machine:claude-code
