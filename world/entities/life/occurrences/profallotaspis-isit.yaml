id: life/occurrences/profallotaspis-isit
kind: occurrence
summary: >-
  The trilobite Profallotaspis jakutensis from the Pestrotsvet Formation (Nokhoroy Member) on
  the Lena River opposite Isit’, Yakutia, Siberia: among the oldest trilobites, the first
  crown-group arthropods in the record. PBDB collection 10065.
