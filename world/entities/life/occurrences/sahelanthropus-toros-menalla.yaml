    note: >-
      The stage the PBDB assigns, from the associated fauna.
relations:
  taxon:
    rel: member-of
    to: life/taxa/hominini
    source:
      - { ref: src:pbdb/collection-59839, loc: "occurrence 570375, accepted_name; the PBDB classification places Sahelanthropus in Hominini" }
      - { ref: src:brunet-2002-sahelanthropus, loc: "abstract" }
      - { ref: src:benton-2015-animal-calibrations, loc: "CHIMPANZEE-HUMAN (87)" }
    note: >-
      Brunet et al. describe it as a hominid near the human–chimpanzee divergence; Benton et al.
      use it as the minimum age of that split. Its place on the human side is debated.
