id: life/occurrences/anisian-pollen-weiach
kind: occurrence
summary: >-
  Very rare monosulcate pollen grains with all the essential features of angiosperm pollen, in the Sulfatschichten of the Weiach
  core hole, northern Switzerland: Anisian, more than 100 million years older than the first accepted pollen of flowering plants.
  What plant shed them is not known, so they are placed here only among seed plants.
