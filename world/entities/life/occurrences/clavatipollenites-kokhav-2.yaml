id: life/occurrences/clavatipollenites-kokhav-2
kind: occurrence
summary: >-
  Angiosperm pollen, Clavatipollenites, from the Helez Formation (Kurnub Group) in core 3 of the
  Kokhav 2 well, Israel: among the oldest flowering-plant fossils, from the
  Valanginian–Hauterivian of northern Gondwana. PBDB collection 140287.
same_as: { pbdb: "occ:1108817" }
author: machine:claude-code
