id: life/occurrences/kimberella-zimnie-gory
kind: occurrence
summary: >-
  Kimberella from sequence C of the Zimnie Gory Formation, White Sea, Russia: the oldest
  well-documented bilaterian animal. PBDB collection 51906.
same_as: { pbdb: "occ:513207" }
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: "Kimberella, Zimnie Gory" }
    unsourced: An editorial label, from the taxon and the collection’s place name.
  identified:
    prop: identified_as
    value: Kimberella sp.
    source: { ref: src:pbdb/collection-51906, loc: "occurrence 513207, identified_name" }
  evidence:
    prop: evidence
    value: body-fossil
    unsourced: "Read from the record's own sources and summary."
  location:
    prop: location
    value: { lat: 65.550003, lon: 39.766666, frame: frame:earth/present-day }
    source: { ref: src:pbdb/collection-51906, loc: "collection coordinates (lat, lng)" }
    method: compilation
  frame:
    prop: frame
    value: frame:paleomap/plate-301
    source: { ref: src:paleomap-plate-model, loc: "PALEOMAP_PlatePolygons.gpml" }
    method: plate-polygon
    basis: reconstruction
  formation:
    prop: formation
    value: Zimnie Gory Formation
    source: { ref: src:pbdb/collection-51906, loc: "formation" }
  date:
    prop: date
    value: { ref: ics/ediacaran }
    source: { ref: src:pbdb/collection-51906, loc: "early_interval (Ediacaran), max_ma, min_ma" }
    method: stratigraphic
    note: >-
      Assigned to the Ediacaran Period. The PBDB's own ages for it (max_ma 635, min_ma 538.8)
      come from its time scale; here the period's ages come from its record, so they follow the
      time scale chosen.
  earlier-than:
    prop: earlier_than
    value: { mean: 555.3 Ma, sd: 0.3 Myr }
    source: { ref: src:martin-2000-white-sea, loc: "abstract", quote: "This age is a minimum for the oldest well-documented triploblastic bilaterian" }
    method: radiometric/u-pb
    note: >-
      A U–Pb zircon age (555.3 ± 0.3 Ma) for a volcanic ash in the Zimnie Gory section, above
      the fossils. The ± level is not stated, so it is read as 1σ.
relations:
