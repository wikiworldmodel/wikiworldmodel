    rel: member-of
    to: life/taxa/bilateria
    source:
      - { ref: src:benton-2015-animal-calibrations, loc: "CROWN BILATERIA/NEPHROZOA (4), fossil taxon" }
      - { ref: src:fedonkin-waggoner-1997-kimberella, loc: "title" }
    note: >-
      Benton et al. use Kimberella quadrata from the White Sea as the oldest crown bilaterian.
      The PBDB places Kimberella only in Animalia.
