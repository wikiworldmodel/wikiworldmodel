id: life/occurrences/tiktaalik-nv2k17
kind: occurrence
summary: >-
  Tiktaalik roseae from locality NV2K17 in the Fram Formation, near Bird Fiord, Ellesmere Island, Nunavut: a fish with
  fins, a mobile neck and a functional wrist joint, an intermediate between fish and limbed vertebrates. Before the Zachełmie
  tracks it stood just below the first tetrapods; it is now younger than their oldest tracks. PBDB collection 238424.
