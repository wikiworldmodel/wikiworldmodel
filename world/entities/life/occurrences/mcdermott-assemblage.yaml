id: life/occurrences/mcdermott-assemblage
kind: occurrence
summary: >-
  Organic-walled microfossils from the McDermott Formation, Tawallah Group, southern McArthur Basin,
  northern Australia, sampled in drill core GSD7. Among them are Tappania plana and other cells read
  as eukaryotes, reported as the oldest known, and a single fragment of a multicellular filament.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: "McDermott Formation microfossils" }
    unsourced: An editorial label, from the formation.
  identified:
    prop: identified_as
    value: Tappania plana, Siphonoseptum sp. and other taxa
    source:
      ref: src:javaux-2025-mcdermott
      loc: "The 1.78−1.73 Ga McDermott microfossil assemblage"
      quote: "preserves at least 35 organic-walled microfossil mophotaxa, including nine taxa interpreted as eukaryotic"
    note: >-
      Javaux names nine; two of them, the common T. plana and the filamentous Siphonoseptum, are named here.
  evidence:
    prop: evidence
    value: body-fossil
    source:
      ref: src:javaux-2025-mcdermott
      loc: abstract
      quote: "preserves a microfossil assemblage that provides unique insights into the evolution of early eukaryotes"
  location:
    prop: location
    value: { lat: -15.79, lon: 134.84, frame: frame:earth/present-day }
    source: { ref: src:wikidata-mcarthur-basin, loc: "P625 coordinate location" }
    method: gazetteer
    note: >-
      A point for the whole basin. The position of drill core GSD7 was not found in a source read, so
      this may lie hundreds of kilometres from the core.
  frame:
    prop: frame
    value: frame:paleomap/plate-801
    source: { ref: src:paleomap-plate-model, loc: "PALEOMAP_PlatePolygons.gpml" }
    method: plate-polygon
    basis: reconstruction
  formation:
    prop: formation
    value: McDermott Formation
    source:
      ref: src:javaux-2025-mcdermott
      loc: abstract
      quote: "The 1.78–1.73 Ga McDermott Formation, McArthur Basin (Australia)"
  date:
    prop: date
    value: { lo: 1.78 Ga, hi: 1.73 Ga }
    source:
      - ref: src:javaux-2025-mcdermott
        loc: abstract
        quote: "The 1.78–1.73 Ga McDermott Formation, McArthur Basin (Australia)"
      - ref: src:javaux-2025-mcdermott
        loc: "Material and methods, on the McArthur Basin"
        quote: "constrained by an approximate minimum age of 1780 Ma of the conformably underlying Seigal Volcanics"
    method: radiometric/u-pb
    note: >-
      A bracket: the Seigal Volcanics below, and above, several formations up, the Wollogorang Formation,
      whose tuffaceous mudrocks give SHRIMP U–Pb zircon ages of 1730 ± 3 Ma and 1729 ± 4 Ma.
relations:
  taxon:
    rel: member-of
    to: life/taxa/eukaryota
    source:
      ref: src:javaux-2025-mcdermott
      loc: abstract
      quote: "pushing back the minimum age of uncontested eukaryotic fossils by more than 100 million years (Ma)"
    note: >-
      Javaux leaves open whether these are stem or crown eukaryotes. Porter (2020) still gives about 1650 Ma
      as the oldest widely accepted evidence, written before this assemblage was described.
