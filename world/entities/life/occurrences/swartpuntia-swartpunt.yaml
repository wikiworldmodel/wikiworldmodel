id: life/occurrences/swartpuntia-swartpunt
kind: occurrence
summary: >-
  Swartpuntia germsi and other late Ediacaran soft-bodied fossils in the Spitskopf Member, Urusis Formation, at
  Farm Swartpunt in the Nama Group, southern Namibia: among the last of the Ediacara biota, just below the
  Cambrian. PBDB collection 89797.
same_as: { pbdb: "occ:814515" }
