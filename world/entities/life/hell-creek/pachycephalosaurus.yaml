      reviewer should look at this first.
  mass-benson-2014:
    prop: body_mass
    value: 369.9
    source:
      ref: src:benson-2014-dinosaur-body-mass
      loc: "Dataset S1, sheet \"Mass estimates\", row Pachycephalosaurus_wyomingensis (Triebold specimen cast)"
      quote: "Pachycephalosaurus_wyomingensis 369.900325554555 369.900325554555 measured circumferences"
    method: model
    note: >-
      Scaled from the femoral circumference of a cast of a skeleton from the Hell Creek or Lance
      Formation.
