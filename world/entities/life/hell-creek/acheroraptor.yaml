        quote: "Deinonychus terrible claws Early Cretaceous (118-110MYA) 13.1ft (4 m) Wolf"
    method: expert-estimate
    basis: reconstruction
    note: >-
      Its own size is unknown: the species rests on an upper and a lower jaw. The first author
      of its description says it approached Deinonychus in size, and this value is that of
      Deinonychus, so it is an upper bound by comparison, not a measurement. The description
      itself (Evans, Larson & Currie 2013) could be read only in abstract, which gives no size.
      A reviewer should look at this first.
