id: life/taxa/acheroraptor
kind: taxon
summary: >-
  The dromaeosaurid Acheroraptor temertyorum, named from an upper and a lower jaw from the Hell
  Creek Formation of Garfield County, Montana.
same_as: { pbdb: "txn:283585" }
author: machine:claude-code
claims:
  name:
    prop: name
    value: { la: "Acheroraptor", en: "Acheroraptor" }
    source:
      ref: src:pbdb-hell-creek-2026-11-04
      loc: "taxon 283585"
    note: >-
      The Paleobiology Database gives the scientific name; the English name is an editorial
      gloss.
  body-plan:
    prop: body_plan
    value: small-theropod
    unsourced: "Which kit draws it: an editorial classification, from the taxon's place in the tree."
  posture:
    prop: posture
    value: biped
    unsourced: "Not stated for this species, known only from its jaws; an editorial choice, as for the other theropods here."
  length-evans-2013:
    prop: body_length
    value: 4
    source:
      - ref: src:evans-2013-acheroraptor-note
        loc: "paragraph 1"
        quote: "It was relatively large for a “raptor”, approaching Deinonychus in size"
