id: life/taxa/hominini
kind: taxon
summary: >-
  Hominins: the human lineage since its split from the chimpanzees’, so its origin is the
  human–chimpanzee divergence. Open Tree’s taxonomy has no tribe Hominini, and the PBDB’s
  Hominini (txn:91486) also includes Pan, so no external id is given.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: hominins, la: Hominini }
    source: { ref: src:pbdb/taxon-91486, loc: "taxon 91486: Hominini Gray 1825" }
    note: The Latin name as the PBDB has it, for a broader tribe that includes the chimpanzees; the English name is an editorial gloss.
  start-langergraber-2012:
    prop: start
    value: { lo: 13 Ma, hi: 7 Ma }
    source:
      ref: src:langergraber-2012-ape-generation-times
      loc: "Results"
      quote: "between 7 and 13 million years"
    method: molecular-clock
    rank: preferred
    note: >-
      The human–chimpanzee split, from generation times of wild chimpanzees and gorillas and the
      range of published human mutation rates per generation, not from fossil calibrations; the
      range spans those rates and generation times and is not a 95% interval. Preferred because
      the whole range is older than Sahelanthropus.
  start-kumar-2005:
    prop: start
    value: { lo: 7.02 Ma, hi: 4.98 Ma }
    source:
      ref: src:kumar-2005-human-chimp
      loc: "abstract"
      quote: "yields a range of 4.98-7.02 millions of years ago for human-chimpanzee divergence"
    method: molecular-clock
    note: >-
      The human–chimpanzee divergence. Not a 95% interval: the range the paper derives from the
      generally accepted 23.8–35 Ma for the ape–Old World monkey split. Not preferred: its
      middle, 6.0 Ma, is younger than Sahelanthropus (6.8–7.2 Ma); only its oldest part agrees
      with that fossil.
  body-plan:
    prop: body_plan
    value: hominin
    unsourced: "Which plan draws it and everything below it: an editorial classification, from its place in the tree."
  length-mammal-forms:
    prop: body_length
    value: { lo: 1.05, hi: 1.916 }
    source:
      - ref: src:will-2017-hominin-body-size
        loc: "Table 3, row australopithecines, under stature"
        quote: "australopithecines 7 125.43 120.00 117.87 140.95 17.20 105.00 151.00 13.7"
      - ref: src:will-2017-hominin-body-size
        loc: "Table 3, row Pleistocene Homo sapiens, under stature"
        quote: "Pleistocene Homo sapiensb 60 170.34 171.85 153.78 184.62 10.64 144.80 191.60 6.2"
    method: compilation
    note: >-
      Standing height, in centimetres in the table: the lowest minimum and the highest maximum
      among its groups, for any hominin with nothing nearer to say.
  mass-mammal-forms:
    prop: body_mass
    value: { lo: 22.7, hi: 91.3 }
    source:
      - ref: src:will-2017-hominin-body-size
        loc: "Table 3, row australopithecines, under body mass"
        quote: "australopithecines 47 34.64 33.90 22.99 54.23 8.79 22.70 63.60 25.4"
      - ref: src:will-2017-hominin-body-size
        loc: "Table 3, row Pleistocene Homo sapiens, under body mass"
        quote: "Pleistocene Homo sapiensb 57 67.16 69.80 53.72 80.58 10.16 42.70 91.30 15.1"
    method: compilation
  posture:
    prop: posture
    value: biped
    source:
      ref: src:kramer-sylvester-2025-australopithecine-hip
      loc: Introduction
      quote: "various researchers have argued that most, if not all, extinct hominins practiced some form of bipedalism"
    note: >-
      How like modern walking it was is the disputed part: the plan draws one upright stance for all.
relations:
  parent:
    rel: descends-from
    to: life/taxa/primates
    source: { ref: src:pbdb/taxon-91486, loc: "classification: Hominini < Homininae < Hominidae < Hominoidea < Catarrhini < Anthropoidea < Haplorhini < Primates" }
    note: >-
      From the PBDB, since Open Tree has no hominin tribe; the human lineage lies within the
      PBDB’s broader Hominini.
