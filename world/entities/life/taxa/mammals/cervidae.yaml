        quote: "Pudu_mephistophiles,Cetartiodactyla,Cervidae,Pudu,mephistophiles,1,0,0,0,Reported,IUCN. 2016. IUCN red list of threatened species. Version 2016-3.,9600"
      - ref: src:faurby-2020-phylacine
        loc: "Data/Traits/Trait_data.csv, row Megaceroides_algericus, column Mass.g (grams)"
        quote: "Megaceroides_algericus,Cetartiodactyla,Cervidae,Megaceroides,algericus,1,0,0,0,Imputed,PHYLACINE 1.2.1,800000"
