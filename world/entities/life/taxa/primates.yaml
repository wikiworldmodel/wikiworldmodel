id: life/taxa/primates
kind: taxon
summary: >-
  Primates: the crown group (strepsirrhines, haplorhines and their last common ancestor).
  Plesiadapiforms are not members here.
same_as: { ott: 913935, pbdb: "txn:40700" }
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: primates, la: Primates }
    source: { ref: src:opentree-taxonomy-3.7, loc: "taxon_info ott913935: name" }
    note: Open Tree gives the scientific name; the English name is an editorial gloss.
  start-dos-reis-2018:
    prop: start
    value: { lo: 79.2 Ma, hi: 70.0 Ma }
    source:
      ref: src:dos-reis-2018-primate-timescale
      loc: "Results, A Timeline of Primate Evolution (calibration strategy A, autocorrelated rates)"
      quote: "crown Primates originated 79.2–70.0 million years ago (Ma)"
    method: molecular-clock
    note: >-
      A crown-group age: the last common ancestor of the living members, which is this group’s
      origin here. The 95% interval under the clock model the paper prefers; independent rates
      give older ages.
  body-plan:
    prop: body_plan
    value: primate
    unsourced: "Which plan draws it and everything below it: an editorial classification, from its place in the tree."
  length-mammal-forms:
    prop: body_length
    value: { lo: 0.25, hi: 1.85 }
    source:
      - ref: src:animal-diversity-web
        loc: "account of Microcebus murinus, Physical Description"
        quote: "The head and body length is 12 to 14 cm and tail length of 13 to 14.5 cm"
      - ref: src:animal-diversity-web
        loc: "account of Papio ursinus, Physical Description"
        quote: "Head and body length is reportedly between 508 and 1.143 mm, with the tail adding an additional 456 to 711 mm to the total length"
    method: compilation
    note: >-
      From a mouse lemur, head and body with its tail, to a chacma baboon, its longest head
      and body with its longest tail ("1.143 mm" in the account is a slip for 1,143 mm). For
      any primate with nothing nearer to say.
  mass-mammal-forms:
    prop: body_mass
    value: { lo: 0.0275, hi: 300 }
    source:
      - ref: src:faurby-2020-phylacine
        loc: "Data/Traits/Trait_data.csv, row Tarsius_pumilus, column Mass.g (grams)"
        quote: "Tarsius_pumilus,Primates,Tarsiidae,Tarsius,pumilus,1,0,0,0,Reported,IUCN. 2016. IUCN red list of threatened species. Version 2016-3.,27.5"
      - ref: src:wikipedia-largest-prehistoric-animals
        loc: "section \"Primates (Primates)\""
        quote: "weighing 225–300 kg (496–661 lb)"
    method: compilation
    note: >-
      From the smallest tarsier to Gigantopithecus, whose size is known only from teeth and
      jaws.
relations:
  parent:
    rel: descends-from
    to: life/taxa/mammalia
    source: { ref: src:opentree-synthesis-16.1, loc: "induced_subtree of the backbone ids: Primates (ott913935) lies within Mammalia (ott244265)" }
