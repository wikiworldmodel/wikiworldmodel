    unsourced: >-
      Which plan draws it and everything below it that says nothing else: an editorial classification, from its place in the tree.
      The plan is a machine's reconstruction, from the skeletal reconstruction of Ichthyostega in Ahlberg (2018), Fig. 1 (Wikimedia
      Commons, "Ichthyostega skeletal reconstruction 2018.png"). The fishes among them, such as Eusthenopteron, are drawn too low and
