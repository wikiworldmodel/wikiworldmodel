id: life/taxa/tetrapodomorpha
kind: taxon
summary: >-
  Tetrapodomorphs: the lobe-finned fishes nearer to land vertebrates than to lungfish, and the first limbed ones of the Devonian,
  in the shallows between fins and feet.
same_as: { pbdb: "txn:77135" }
