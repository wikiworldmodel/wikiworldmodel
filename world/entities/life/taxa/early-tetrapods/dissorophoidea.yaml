id: life/taxa/dissorophoidea
kind: taxon
summary: >-
  Dissorophoids: small, big-eyed, often land-going temnospondyls of the Carboniferous and Permian, from which the living
  amphibians may have come; the database puts them on the way to the living groups, which have their own forms.
