id: life/taxa/anomodontia
kind: taxon
summary: >-
  Anomodonts, above all the dicynodonts: therapsid plant-eaters with horny beaks, usually two tusks and nothing much else in
  the way of teeth, by far the commonest large land animals of the later Permian and the Triassic.
