id: life/taxa/synapsida
kind: taxon
summary: >-
  Synapsids: mammals and everything nearer to them than to reptiles. As a body it stands here for the early, sprawling
  grade once called pelycosaurs, and for any synapsid with no form below it.
same_as: { pbdb: "txn:38882" }
author: machine:claude-code
claims:
  name:
    prop: name
    value: { la: Synapsida, en: synapsids }
    unsourced: The classification's own name, with an editorial gloss in English.
  body-plan:
    prop: body_plan
    value: pelycosaur
    unsourced: >-
      Which plan draws it and everything below it that says nothing else: an editorial classification, from its place in
      the tree. The plan is a machine's reconstruction, from the photograph of the mounted Dimetrodon at the Royal Tyrrell
      Museum (Wikimedia Commons, "Dimetrodon Royal Tyrrell Museum.jpg").
  length:
    prop: body_length
