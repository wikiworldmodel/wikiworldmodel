      - ref: src:olson-1954-caseidae
        loc: "p. 194, Casea broilii"
        quote: "lightly built species about four feet in length"
      - ref: src:canoville-2026-dimetrodon-life-history
        loc: "Introduction, p. 1"
        quote: "ranged in adult total body length and body weight from about 1.7 m and 38 kg"
      - ref: src:canoville-2026-dimetrodon-life-history
