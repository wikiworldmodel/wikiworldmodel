        quote: "up to 4.6 m and 250 kg"
    method: expert-estimate
    note: >-
      The small early caseid Casea (four feet converted) and the largest Dimetrodon stand for the early synapsids with no
      length of their own. Smaller ones existed: Reisz (1972) has primitive pelycosaurs from 20 cm snout to vent. The giant
      caseids have their own range below.
