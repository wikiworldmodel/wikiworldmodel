id: life/taxa/meganisoptera
kind: taxon
summary: >-
  The griffinflies, stem relatives of the dragonflies of the Late Palaeozoic and the largest insects known, with wings
  spanning up to about 70 cm.
same_as: { pbdb: "txn:174977" }
author: machine:claude-code
claims:
  name:
    prop: name
    value: { la: Meganisoptera, en: "griffinflies" }
    unsourced: "The classification's own name; the English an editorial gloss."
  form:
    prop: body_form
    value:
      behave: { group: [1, 1], habitat: air, poses: [fly, fly, rest], flies: [1, 10] }
      parts:
        head: { at: [0, 0.455, 0.2], r: [0.042, 0.04, 0.04] }
        eyes: { at: [0.018, 0.46, 0.21], r: [0.026, 0.032, 0.032] }
        jaws: { type: spike, zl: true, near: true, mat: chitin, mirror: true, sides: [3, 3], from: [0.02, 0.49, 0.18], to: [0.004, 0.52, 0.165], r: 0.008 }
        antennae: { from: [0.01, 0.49, 0.23], to: [0.035, 0.6, 0.27] }
        thorax: { at: [0, 0.32, 0.2], r: [0.07, 0.1, 0.08] }
        abdomen: { rings: [[0, 0.24, 0.195, 0.042, 0.042], [0, 0.1, 0.19, 0.024, 0.026], [0, -0.2, 0.185, 0.022, 0.024], [0, -0.45, 0.18, 0.02, 0.022], [0, -0.5, 0.18, 0.006, 0.007]] }
        cerci: { type: spike, zl: true, near: true, mat: chitin, mirror: true, sides: [3, 3], from: [0.008, -0.49, 0.18], to: [0.03, -0.66, 0.17], r: 0.005 }
        rest-fore: { points: [[0.03, 0.37, 0.225], [0.42, 0.34, 0.24], [0.93, 0.36, 0.25], [0.92, 0.27, 0.25], [0.42, 0.2, 0.235], [0.04, 0.27, 0.225]] }
        rest-hind: { points: [[0.03, 0.27, 0.225], [0.42, 0.18, 0.24], [0.92, 0.2, 0.25], [0.88, 0.08, 0.25], [0.42, 0.0, 0.235], [0.04, 0.12, 0.225]] }
        fly-fore: { span: 0.93, chord: 0.17, sweep: 0.0, beat: 0.2, arm: 0.004 }
        fly-hind: { span: 0.92, chord: 0.22, sweep: 0.05, beat: 0.2, arm: 0.004 }
    source:
      - ref: src:nel-2018-giant-dragonflies
        loc: "Results; and Fig. 4"
        quote: "The head of Meganeurites was narrower than the thorax"
      - ref: src:guinness-largest-insect-wingspan
        loc: "record text"
        quote: "they did compare closely in overall form to dragonflies"
    note: >-
      Drawn from the reconstruction of Meganeurites gracilipes in Nel et al. (2018), Fig. 4, compared by eye: there the
      wing is a little longer than the body. On the largest, the 710 mm span and 410 mm body claimed below make it 0.87
      of the body; this form takes 0.93, between them. Jaws, spined legs and tail appendages are that figure's; only the
      appendages and jaws are drawn. How they held their wings at rest is a guess, after dragonflies.
  length:
    prop: body_length
    value: { lo: 0.141, hi: 0.41 }
    source:
      - ref: src:guinness-largest-insect-wingspan
        loc: "record text, Meganeuropsis permiana"
        quote: "it sported a wingspan of up to 710 mm and a body length of almost 410 mm"
      - ref: src:nel-2018-giant-dragonflies
        loc: "Results; and Fig. 4"
        quote: "the large wingspan of M. gracilipes (ca. 320 mm)"
    method: compilation
    basis: reconstruction
    note: >-
      The largest is a record book's figure with no reference. The small end is reckoned here: in the reconstruction of
      M. gracilipes in Fig. 4 the body without its tail appendages measures 293 pixels and the span 663, which on the
      text's span of ca. 320 mm is about 141 mm. Nel et al. say the family spans sizes down to wingspans near those of
      living dragonflies, so smaller ones exist.
  mass-cannell-2018:
    prop: body_mass
    value: { lo: 0.1, hi: 0.15 }
    source:
      - ref: src:cannell-2018-giant-dragonflies
        loc: "abstract"
        quote: "would have had a mass of 100-150 g"
    method: model
    note: >-
      For the largest, with a wingspan of 70 cm or more, from allometry and flight engineering. Only the abstract could
      be read.
