        loc: "Vol. 2, s.v. Taxus brevifolia"
        quote: "Shrubs or small trees to 15(--25) m"
    method: compilation
    basis: reconstruction
    note: >-
      No height was read for any walchian conifer. Thucydia is considered a small tree, and these
      are the heights of the small trees among living conifers: a stand-in chosen by the editor, not
      by any source. A reviewer should look at this first.
