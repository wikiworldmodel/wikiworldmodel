id: life/taxa/coniferophyta
kind: taxon
summary: >-
  A third branch of the database's for conifers, which holds the earliest of them, Walchia and
  Lebachia.
same_as: { pbdb: "txn:56176" }
author: machine:claude-code
claims:
  name:
    prop: name
    value: { la: Coniferophyta, en: conifers and cordaites }
    unsourced: "The classification's own name; the English an editorial gloss."
  body-plan:
    prop: body_plan
    value: walchian
    source:
      ref: src:hernandez-castillo-2003-thucydia
      loc: "abstract"
      quote: "developmental variations among lateral branching systems in juvenile trees of the extant conifer Araucaria heterophylla"
    note: >-
      Said of Thucydia mahoningensis, another walchian conifer, and a machine's reconstruction
