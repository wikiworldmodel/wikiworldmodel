    value: conifer
    source:
      ref: src:stein-2020-cairo
      loc: "Supplemental, Estimating Archaeopteris Tree Sizes at Cairo"
      quote: "Archaeopteris trees more-or-less followed the tapered form seen today among conifers"
    note: >-
      Stein et al. say it is widely assumed, and rest their estimates on it.
  form:
    prop: body_form
