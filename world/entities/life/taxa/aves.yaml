id: life/taxa/aves
kind: taxon
summary: >-
  Birds: the crown group (Neornithes, modern birds). Stem birds such as Archaeopteryx are not
  members here.
same_as: { ott: 81461, pbdb: "txn:36616" }
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: birds, la: Aves }
    source: { ref: src:opentree-taxonomy-3.7, loc: "taxon_info ott81461: name" }
    note: Open Tree gives the scientific name; the English name is an editorial gloss.
  start-claramunt-cracraft-2015:
    prop: start
    value: { lo: 114.3 Ma, hi: 84.2 Ma }
    source:
      ref: src:claramunt-cracraft-2015-bird-timetree
      loc: "Results: crown age of Neornithes, genomic data set"
      quote: "95% highest posterior density (HPD), 84.2 to 114.3 Ma"
    method: molecular-clock
    note: >-
      A crown-group age: the last common ancestor of the living members, which is this group’s
      origin here. The 95% HPD interval from the genomic data set (median 96.6 Ma); the RAG data
      set gives 106.8–79.8 Ma.
  body-plan:
    prop: body_plan
    value: bird
    unsourced: "Which plan draws it and everything below it: an editorial classification, from its place in the tree."
  posture:
    prop: posture
    value: biped
    unsourced: "Birds walk on their hind legs; an editorial classification."
  length:
    prop: body_length
    value: { lo: 0.05, hi: 2.75 }
    source:
      - ref: src:grzimek-animal-life-encyclopedia
        loc: "s.v. \"Hummingbirds (Trochilidae)\""
        quote: "2–8.7 in (5–22 cm); 0.07–0.7 oz (1.9–21 g)"
      - ref: src:grzimek-animal-life-encyclopedia
        loc: "s.v. \"Ostriches (Struthionidae)\""
        quote: "5.7–9.0 ft (175–275 cm); 139–345 lb (63–157 kg)"
    method: compilation
    note: >-
      From the smallest hummingbird to the tallest ostrich, for any bird with no length of its own;
      the major orders have theirs.
relations:
  parent:
    rel: descends-from
    to: life/taxa/dinosauria
    source: { ref: src:opentree-taxonomy-3.7, loc: "taxon_info ott81461, lineage: Aves < Coelurosauria < Theropoda < Saurischia < Dinosauria" }
    note: >-
      From the taxonomy rather than the synthesis tree, in which Dinosauria is a broken taxon.
