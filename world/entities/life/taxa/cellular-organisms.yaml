id: life/taxa/cellular-organisms
kind: taxon
summary: >-
  All cellular life: the last universal common ancestor (LUCA) and its descendants. The root of
  this backbone; its origin is the age of LUCA.
same_as: { ott: 93302 }
author: machine:claude-code
