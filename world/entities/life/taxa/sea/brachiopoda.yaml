id: life/taxa/brachiopoda
kind: taxon
summary: >-
  The brachiopods or lamp shells: animals of the sea floor in a shell of two unequal valves, top and bottom, which fed with a
  coiled fringe of tentacles inside it. Common throughout the Palaeozoic, rarer since.
same_as: { pbdb: "txn:26322" }
