    unsourced: "Which plan draws it and everything below it: an editorial classification, from its place in the tree."
    note: >-
      The plan is a machine's reconstruction of a biconvex brachiopod with a beak and a pedicle, from general knowledge; no
      figure was compared with it. It lies on its lower valve; many brachiopods stood on their pedicle instead, with the front
      edge up.
