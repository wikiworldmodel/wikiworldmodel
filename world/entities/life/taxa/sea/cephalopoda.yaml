id: life/taxa/cephalopoda
kind: taxon
summary: >-
  The cephalopods: molluscs of the open sea with a ring of arms round the head, swimming by jet; most of the fossil ones, the
  ammonoids, nautiloids and orthocones, in chambered shells.
