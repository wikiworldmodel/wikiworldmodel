        loc: "Abstract"
        quote: "an effort to catalogue all large (≥ 2 m diameter) Porites colonies around Ta'u"
    method: compilation
    note: >-
      The colony's width, or a solitary coral's length, from small Silurian corals of half a centimetre across to the two metres
      above which a survey of living Porites counted a colony large. Larger colonies are known, the largest in that survey 22.4 m
      across, and lie outside the range, which stands for the ordinary run of corals.
