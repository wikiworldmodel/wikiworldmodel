id: life/taxa/anthozoa
kind: taxon
summary: >-
  The anthozoans: corals and sea anemones, polyps of the sea floor with a ring of tentacles round the mouth; the corals build
  skeletons of lime, most of them as colonies.
same_as: { pbdb: "txn:4742" }
author: machine:claude-code
claims:
  name:
    prop: name
    value: { la: Anthozoa, en: "corals and sea anemones" }
    unsourced: "The classification's own name; the English an editorial gloss."
  body-plan:
    prop: body_plan
    value: coral
    unsourced: "Which plan draws it and everything below it: an editorial classification, from its place in the tree."
    note: >-
      The plan is a machine's reconstruction of a massive coral colony with a few branches, from general knowledge; no figure was
      compared with it. It stands for the colonial corals of every shape, and for the sea anemones, which have no skeleton and
      are drawn as this.
  length:
