id: life/occurrences/forest-curio-bay
kind: occurrence
summary: >-
  In situ fossil forest horizons at Curio Bay, on the Catlins coast of New Zealand: conifers with an
  understory of tree ferns and non-coniferous gymnosperms, overwhelmed by a series of river floods.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: "Curio Bay fossil forest" }
    unsourced: An editorial label, from the place name.
  identified:
    prop: identified_as
    value: conifers
    source:
      ref: src:pole-2020-catlins
      loc: "Curio Bay section"
      quote: a relatively low canopy of conifers
    note: >-
      Not a taxon name: the paper read gives the group only.
  evidence:
    prop: evidence
    value: in-situ-forest
    source:
      - ref: src:pole-2020-catlins
        loc: Introduction
        quote: with in situ Jurassic fossil forests
      - ref: src:gou-2026-yiwu
        loc: Discussion
        quote: The Curio Bay Forest within Middle Jurassic strata at Curio Bay, southern New Zealand
    note: >-
      The basis is Pole's description, with in situ fossil trees in the fine beds; Gou et al. take it as
      one of four in situ Jurassic forests evaluated quantitatively.
  location:
    prop: location
    value: { lat: -46.66209, lon: 169.09883, frame: frame:earth/present-day }
