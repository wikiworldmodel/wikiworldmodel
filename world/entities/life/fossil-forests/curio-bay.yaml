      loc: Geological settings
      quote: marine origin for the Ferndale Group (which included Curio Bay)
    note: >-
      A group, not a formation: the rank of the unit the paper names, after Campbell et al. (2003).
  date:
    prop: date
    value: { ref: ics/middle-jurassic }
    source:
      - ref: src:pole-2020-catlins
        loc: Geological settings
        quote: an early Middle Jurassic, marine-marginal marine origin for the Ferndale Group
      - ref: src:gou-2026-yiwu
