      quote: "NZTM: 1301560, 4824990"
    method: survey
    note: >-
      Converted from New Zealand Transverse Mercator (NZGD2000) by the published projection formulas;
      Wikidata's Q2667315 agrees to within 0.001°.
  frame:
    prop: frame
    value: frame:paleomap/plate-807
    source: { ref: src:paleomap-plate-model, loc: "PALEOMAP_PlatePolygons.gpml" }
    method: plate-polygon
    basis: reconstruction
  formation:
