id: life/occurrences/forest-bosques-petrificados
kind: occurrence
summary: >-
  Araucarian conifers of the La Matilde Formation at the Monumento Natural Bosques Petrificados,
  Santa Cruz, Patagonia: stumps in life position and great fallen trunks in two forest levels, buried
  in pyroclastic rocks in the Middle Jurassic.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: "Bosques Petrificados, Patagonia" }
    unsourced: An editorial label, from the place name.
  identified:
    prop: identified_as
    value: Araucaria cf. A. mirabilis
    source:
      ref: src:falaschi-2011-la-matilde
      loc: abstract
      quote: The cones were assigned to Araucaria cf. A. mirabilis
  evidence:
    prop: evidence
    value: in-situ-forest
    source:
      ref: src:falaschi-2011-la-matilde
      loc: "p. 124, Introduction"
      quote: permineralized trunks, whether stumps in life position or huge trunks, lying horizontally, without any evidence of transport
    note: >-
      The basis is the paper's stumps in life position.
  location:
    prop: location
    value: { lat: -47.665101, lon: -67.994191, frame: frame:earth/present-day }
    source: { ref: src:wikidata-bosques-petrificados, loc: "P625 coordinate location (the value with a reference)" }
    method: gazetteer
    note: >-
      A point for the protected area, which Wikidata also lists as Monumento natural Bosques
      Petrificados; the outcrop itself was not located from a source read. Wikidata's other value lies
      about 13 km west of this one.
  frame:
    prop: frame
