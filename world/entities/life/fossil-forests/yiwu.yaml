id: life/occurrences/forest-yiwu
kind: occurrence
summary: >-
  Upright conifer stumps in their growth positions in the Xishanyao Formation at Naomaohu, Yiwu County,
  Xinjiang: the Yiwu Jurassic Forest, 78 trees mapped in one horizon, among 19 wood-bearing beds.
author: machine:claude-code
