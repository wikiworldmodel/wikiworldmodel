    container: Seshat Global History Databank (Scientific Data 12, 247)
    doi: 10.1038/s41597-025-04516-9
    url: https://github.com/Seshat-Global-History-Databank/cliopatria
    credit: Borders from Cliopatria (Bennett et al. 2025, Seshat)
