# External datasets. They are referenced, not copied: `npm run fetch` downloads each one
# from its pinned URL into .cache/ and checks it against the sha256 recorded here, and the
# build reads them from there. Changing a dataset means changing its entry (and its hash).
#
# Each dataset version is also a source (section 4.8), cited as its id: the fields above
# `fetch` are the source record, the ones under it say how the build gets the files.

# What a published build may include: datasets and database records with any other licence,
# or none, are refused. Cited publications contribute only facts and short quotes.
publish:
  licenses: [CC-BY-4.0, CC-BY-3.0, CC0-1.0, public-domain]

