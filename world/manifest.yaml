  src:cao-2024-plate-model:
    type: dataset
    kind: model
    title: "Earth's tectonic and plate boundary evolution over 1.8 billion years: the plate model"
    citation: >-
      Cao, X., Collins, A., Pisarevsky, S., Flament, N., Li, S., Hasterok, D. & Müller, D. (2024). Earth's tectonic and
      plate boundary evolution over 1.8 billion years [dataset], version 2.4. Zenodo, doi:10.5281/zenodo.13628813. The model
      of: Cao, X., Collins, A.S., Pisarevsky, S., Flament, N., Li, S., Hasterok, D. & Müller, R.D. (2024). Earth's tectonic
      and plate boundary evolution over 1.8 billion years. Geoscience Frontiers 15(6), 101922.
    authors:
      - "Cao, X."
      - "Collins, A."
      - "Pisarevsky, S."
      - "Flament, N."
      - "Li, S."
      - "Hasterok, D."
      - "Müller, D."
    published: 2024
    version: Zenodo version 2.4 of 2 September 2024, the archive 1.8Ga_model_GSF.zip
    container: Zenodo
    doi: 10.5281/zenodo.13628813
    url: https://zenodo.org/records/13628813
    credit: Plates before 1.1 Ga from Cao et al. (2024)
    license: CC-BY-4.0
    license_note: >-
      The Zenodo record's licence is CC BY 4.0, read through its API. The article it goes with is under CC BY-NC-ND 4.0, by
      its Crossref record, and contributes no data here.
    reliability: >-
      A plate reconstruction, not a measurement: where the continents were is the authors' fit to the evidence they used,
      and it differs from other reconstructions of the same times. It is a full-plate model from 1.8 Ga to the present; its
      rotations before 1 Ga are in a file of their own, whose lines cite, among others, Pisarevsky et al. (2014), Mulder et
      al. (2018), Condie et al. (2021) and Merdith et al. (2021) as the work they build on or modify. Its continental
      polygons are present-day pieces of continent, each from the time the model says it existed: 159 at 1.8 Ga, 185 at
      1.1 Ga, 870 today.
    note: >-
      Its plate numbers are its own, and many are the same numbers as the PALEOMAP model's, for different rotations: the
      build keeps them apart. The archive's plate boundaries, palaeomagnetic poles and point data are not read.
    verified:
      by: machine:claude-code
      how: >-
        Licence, version, description and the archive's md5 from the Zenodo API; the md5 of the archive downloaded matches.
        The article's title, authors, volume and licence from Crossref; its text could not be reached (the publisher's site
        refuses automated reads), so nothing here rests on it. The rotation files' comments, and the continental polygons
        alive and placed at each age, read with pyGPlates.
    fetch:
      url: https://zenodo.org/api/records/13628813/files/1.8Ga_model_GSF.zip/content
      sha256: 4ae9158a29c597b46f687f8c3f0f5a4a55df5ab69bde18e24257a17d358d8592
      bytes: 20669287
      format: zip
