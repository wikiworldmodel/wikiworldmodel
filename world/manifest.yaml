  src:anthromes-12k:
    type: dataset
    kind: model
    title: "Anthromes 12K: the anthropogenic biomes of every 5′ cell of land, 10,000 BCE to 2015 CE"
    citation: >-
      Ellis, E.C., Beusen, A.H.W. & Klein Goldewijk, K. (2020). Anthropogenic biomes: 10,000 BCE to 2015 CE. Land 9(5), 129,
      doi:10.3390/land9050129. The data: Ellis, E. & Klein Goldewijk, K. (2020). Anthromes 12K Full Dataset. Harvard Dataverse,
      version 3, doi:10.7910/DVN/G0QDNQ.
    authors:
      - "Ellis, E.C."
      - "Beusen, A.H.W."
      - "Klein Goldewijk, K."
    published: 2020
    version: >-
      Version 3 of the Dataverse record, released 27 April 2020: anthromes_12K_full.zip, 73 zipped ArcInfo ASCII grids at 5′
      from 10,000 BCE to 2015 CE, read on 9 November 2026
    container: Harvard Dataverse
    doi: 10.7910/DVN/G0QDNQ
    url: https://doi.org/10.7910/DVN/G0QDNQ
    credit: Anthromes from Anthromes 12K (Ellis, Beusen & Klein Goldewijk 2020), a classification of HYDE 3.2
    license: CC0-1.0
    license_note: >-
      The Dataverse record says CC0 1.0. The archive's own Readme.txt states no licence. It classifies HYDE 3.2, whose readme
      puts its data under CC BY 3.0; its authors include HYDE's, and HYDE is credited with it all the same. The replication
      scripts are a separate record (doi:10.7910/DVN/IB4VCI) whose readme limits them to noncommercial research under the GPL
      v3; they were read for the rules of the classification, which the field quotes, and are not imported.
    reliability: >-
      A classification of a reconstruction, not an observation. Each 5′ cell of HYDE 3.2's baseline goes into one of 20
      classes by thresholds on its density of people and on the shares of its land in crops, irrigation, rice and grazing,
      and by whether its potential vegetation is woody (anthromes.py in the replication scripts). So it carries everything
      HYDE's allocation rules do: HYDE's own uncertainty range for population is 95% at 10,000 BCE, 75% at 1 CE and 50% at
      850 CE. A village needs at least 100 people to the km² of the cell, so a few farmers in a cell of woodland are
      "populated woodlands", not a village. North America, Australia and New Zealand are set as regions without villages, so
      a dense cell there is a mixed settlement.
    note: >-
      The grids are labelled 10000BC to 0AD in steps of 1,000 years, 100AD to 1700AD in steps of 100, 1710AD to 1990AD in
      steps of 10 and 2000AD to 2015AD in steps of one; 0AD is read as the axis's year 0, as HYDE's population is. The
      legend's colours (doi:10.7910/DVN/CNFOE1, its Excel file of 28 April 2020) are the viewer's.
    verified:
      by: machine:claude-code
      how: >-
        Licence, files, MD5 and description from the Dataverse record's API; the archive downloaded and its MD5 matched, its
        73 grids and Readme.txt listed. The classification read in anthromes.py and readme.txt of the replication scripts; the
        class names and colours from the legend's spreadsheet. The Land article was not read: its host was not reachable.
    fetch:
      url: https://dataverse.harvard.edu/api/access/datafile/3647930
      sha256: 845a1fc9b227e216306a6b5939fbbd6a44246fb51d4bb3ae90de5bf7a34a5e06
      bytes: 47465566
      format: zip

  src:archaeoglobe-2019-assessments:
    type: dataset
    kind: compilation
    title: "ArchaeoGLOBE: archaeologists' assessments of land use in 146 regions at ten times from 10,000 BP to 1850 CE"
    citation: >-
      ArchaeoGLOBE Project (2019). ArchaeoGLOBE Public Data. Harvard Dataverse, version 3, doi:10.7910/DVN/CNCANQ: its summary
      tables of the consensus, least, median and most answers for each land use, the urban centres, data quality, expertise
      and published excavations, joined into one table.
    published: 2019
    version: >-
      Version 3 of the Dataverse record, released 2 June 2019; its eight summary tables read on 9 November 2026, joined and
      kept in world/snapshots
    container: Harvard Dataverse
    doi: 10.7910/DVN/CNCANQ
    url: https://doi.org/10.7910/DVN/CNCANQ
    credit: Land-use assessments from ArchaeoGLOBE (ArchaeoGLOBE Project 2019)
    license: CC0-1.0
    license_note: The Dataverse record says CC0 1.0 for all its files.
    reliability: >-
      Expert opinion, not measurement. 255 archaeologists gave 711 answers between 18 May and 31 July 2018, each for a region
      they chose, saying for each of ten times whether foraging, extensive agriculture, intensive agriculture and pastoralism
      used none of its land, under 1% (minimal), 1–20% (common) or over 20% (widespread), and whether it had dense urban
      centres. The survey asked them to generalize over regions larger than anyone's expertise. The consensus is the median
      answer with the anomalous ones amended by the co-authors. Answers are fewer for Africa, Russia and Southeast Asia, which
      were sought late, and the README says archaeologists outside the English-language journals may not have been reached.
    note: >-
      The article describing the survey (Stephens et al. 2019, Science 365, 897–902, doi:10.1126/science.aax1192) was not
      read: no copy was reachable. What is said here of the survey comes from the record's README and the copy of the survey's
      questions it holds.
    verified:
      by: machine:claude-code
      how: >-
        Licence, versions, files and MD5 from the Dataverse record's API. README.pdf and ARCHAEOGLOBE_SURVEY.pdf read in full;
        each summary table read and checked against its MD5 by the snapshot tool.
    fetch:
      url: repo:world/snapshots/archaeoglobe-2019-assessments.csv
      sha256: 8e193a3d79563868f643ae41d8fa4db246646c7aad20dc8073bcff30021f41ea
      bytes: 260107
      format: csv
      via: >-
        `npm run world -- archaeoglobe-snapshot` (tools/world/src/archaeoglobe.ts) joins the eight summary tables of
        doi:10.7910/DVN/CNCANQ, as uploaded, each checked against the MD5 the record gives it; the file's header lists them.

