      As the world's source record for this work has it (src:reba-2016-urban-population), and as Europe PMC gives the
      article's. The figshare record's own licence could not be read again here: its API host was not reachable.
    reliability: >-
      One compiler's estimates of the populations of the larger cities of the ancient world, in columns of years, with a
