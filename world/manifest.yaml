  src:ar6-wg1-fig2-4:
    type: dataset
    kind: compilation
    title: "Data for Figure 2.4a of IPCC AR6 WGI Chapter 2: CO₂, methane and N₂O from ice cores, the last 800 kyr"
    citation: >-
      Ahn, J. (2023). Chapter 2 of the Working Group I Contribution to the IPCC Sixth Assessment Report - data
      for Figure 2.4 (v20221219). NERC EDS Centre for Environmental Data Analysis, 3 July 2023. Its CO₂ is from
      Bereiter et al. (2015), Geophysical Research Letters 42, 542–549, doi:10.1002/2014GL061957, and its methane
      from Loulergue et al. (2008), Nature 453, 383–386, doi:10.1038/nature06950.
    authors:
      - "Ahn, J."
    published: 2023
    version: v20221219, the file fig2_4a_main_figure_data.csv (CEDA's export of a sheet last revised on 24 February 2021)
    container: CEDA Archive, for the IPCC Data Distribution Centre
    doi: 10.5285/60eeb3cce51a457cb5ee1c577a0c8674
    url: https://catalogue.ceda.ac.uk/uuid/60eeb3cce51a457cb5ee1c577a0c8674
    credit: CO₂ and methane from ice cores (Bereiter et al. 2015; Loulergue et al. 2008), as tabulated for IPCC AR6
    license: CC-BY-4.0
    license_note: >-
      The CEDA catalogue record, the archive's 00README_catalogue_and_licence.txt and the DOI's DataCite record all
      state CC BY 4.0. Its License.txt adds that users should also cite the publications the data come from. Read here
      instead of the same composites at NOAA NCEI (studies 17975 and 6093), whose records ask for a citation and state
      no licence (the DOIs' rights lists are empty), and whose contributors are not US government employees, so the
      files cannot simply be taken for public domain.
    reliability: >-
      Air measured in Antarctic ice cores, tabulated by IPCC authors for a figure, with ages in thousands of years
      before 2000. Older than 0.25 ka, the CO₂ column is the composite of Bereiter et al. (2015), rounded to 0.1 ppm: it
      joins stretches of records from Law Dome, Dome C, WAIS Divide, Siple Dome, Talos Dome, EDML and Vostok, most on the
      AICC2012 age scale. Older than 0.25 ka, the methane column is the EPICA Dome C record of Loulergue et al. (2008), on
      the EDC3 age scale. Those two age scales differ, by a median of 0.8 kyr and up to 6 kyr for the same methane samples, so
      the two gases should not be compared at short lags. The yearly values for 1850–2019 and one for 1750 do not come
      from those records: the sheet attributes them to "Annex 5".
    note: >-
      The table has no uncertainty column, so these series have no band. Its N₂O columns are not read. Bazin et al. (2013,
      PANGAEA 824883, CC BY 3.0) give the same methane samples on AICC2012, without the recent values.
    verified:
      by: machine:claude-code
      how: >-
        Licence read on the catalogue record, in the archive's readme and on DataCite. The file's md5 matches CEDA's
        listing. Its rows were compared with NOAA's composite and methane table, read through Internet Archive captures
        because NCEI's servers did not answer from where this was written: all 1723 CO₂ rows older than 0.25 ka equal the
        composite to within rounding, and 2097 of 2268 methane rows equal Loulergue et al.'s (within 6 years), once 50
        years are taken off the ages; the other 171 rows of each are the recent values.
    fetch:
      url: https://dap.ceda.ac.uk/badc/ar6_wg1/data/ch_02/ch2_fig04/v20221219/fig2_4a_main_figure_data.csv
      sha256: 8d473c3b67bdd26e395bc335096a99a15630cececa738010a61c2bedeb67f859
      bytes: 89027
      format: csv

  src:jouzel-2007-epica-dome-c:
    type: dataset
    kind: measurement
    title: EPICA Dome C Ice Core 800KYr deuterium data and temperature estimates
    citation: >-
      Jouzel, J. & Masson-Delmotte, V. (2007). EPICA Dome C Ice Core 800KYr deuterium data and temperature estimates
      [dataset]. PANGAEA. Supplement to: Jouzel, J. et al. (2007). Orbital and millennial Antarctic climate variability
      over the past 800,000 years. Science 317, 793–796, doi:10.1126/science.1141038.
    authors:
      - "Jouzel, J."
      - "Masson-Delmotte, V."
    published: 2007
    version: PANGAEA dataset 683655, its tab-separated text as served on 3 November 2026
    container: PANGAEA
    doi: 10.1594/PANGAEA.683655
    url: https://doi.org/10.1594/PANGAEA.683655
    credit: Antarctic temperature (EPICA Dome C, Jouzel et al. 2007)
    license: CC-BY-3.0
    license_note: >-
      The file's own header and PANGAEA's record both state CC BY 3.0 Unported. The same table at NOAA NCEI (study 6080)
      states no licence.
    reliability: >-
      A reconstruction for one place, not for the globe: the deuterium in the ice at Dome C, 3233 m up on the East
      Antarctic plateau, turned into that site's temperature difference from the average of the last 1000 years, after
      corrections for the isotopes of sea water and the height of the ice sheet. Each row is one 55 cm bag of ice, and the
