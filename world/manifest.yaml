  src:ohm-rome-2026-11-01:
    type: dataset
    kind: compilation
    title: OpenHistoricalMap, the elements of antiquity around Rome
    citation: >-
      OpenHistoricalMap contributors. Elements dated before 600 CE within 41.82–41.96°N,
      12.38–12.60°E, and the river Tiber, as of 1 November 2026.
    version: Overpass export of 2026-11-01, kept in world/snapshots
    container: OpenHistoricalMap
    url: https://www.openhistoricalmap.org/
    credit: Rome's footprints from OpenHistoricalMap
    license: CC0-1.0
    license_note: >-
      The project's copyright page dedicates its data to the public domain under CC0 "except
      where otherwise noted", in license tags on individual elements. Elements with such a tag
      are left out of this snapshot (tools/world/src/ohm.ts).
    reliability: >-
      A community's tracing of old plans, many of them named in the elements' source tags
      (Lanciani's Forma Urbis, Platner and Ashby's plans, museum models, Wikimedia images). Most
      footprints are simplified, the dates are the mappers' and often round, and reconstructed
      buildings are mapped beside surviving ones with nothing to tell them apart. Records
      imported from it are proposals, and the record of a monument written by hand adopts its
      footprint and gives its own sources for the rest.
    note: >-
      The river's polygons carry no dates and appear to follow its course today, inside the
      embankments of the 1870s onwards. No stable URL serves an extract of a changing database,
      so the snapshot is kept in the repository until there is a blob store.
    verified:
      by: machine:claude-code
      how: >-
        Licence read on openhistoricalmap.org/copyright. Exported from
        overpass-api.openhistoricalmap.org with the query in the snapshot's own `query` field.
