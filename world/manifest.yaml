      - "Battistini, A."
      - "Dotta, G."
    published: 2023
    version: "1.1, tile w46075_s10: UTM 32N, 750–800 km east, 4600–4650 km north"
    container: INGV
    doi: 10.13127/tinitaly/1.1
    url: https://tinitaly.pi.ingv.it/
    credit: Ground from TINITALY 1.1 (Tarquini et al. 2023, INGV)
    license: CC-BY-4.0
    license_note: The download page states CC BY 4.0, with this citation.
