  src:etopo-2022-60s:
    type: dataset
    kind: compilation
    title: ETOPO 2022, 60 arc-second global relief, ice surface
    citation: >-
      NOAA National Centers for Environmental Information (2022). ETOPO 2022 15 Arc-Second Global
      Relief Model. https://doi.org/10.25921/fd45-gt74. Its single global grid at 60 arc-seconds, ice
      surface.
    published: 2022
    version: ETOPO 2022 v1, 60 arc-second, ice surface, the one global tile N90W180
    container: NOAA NCEI
    doi: 10.25921/fd45-gt74
    url: https://www.ncei.noaa.gov/products/etopo-global-relief-model
    credit: Today's relief from ETOPO 2022 (NOAA)
    license: public-domain
    license_note: A work of the United States government, like the 15 arc-second tiles.
    reliability: >-
      A compilation of land and sea-floor surveys, with the top of the Greenland and Antarctic ice
      sheets rather than the rock under them. Heights are in metres above the EGM2008 geoid, which its
      user guide calls an adequate approximation of mean sea level for most purposes. The 60 arc-second
      grid was downsampled from the 15 arc-second tiles, so it has no grid of which survey each cell
      comes from. The coast is today's.
    verified:
      by: machine:claude-code
      how: >-
        Citation and DOI from the product page and DataCite; the datum and how the 30 and 60 arc-second
        grids were made from the ETOPO 2022 User Guide (NCEI's PDF "1.2 ETOPO 2022 User Guide.pdf"),
        sections 2.1 and 2.2, and the quote from section 2.1 found in the guide's text by script. The
        file's own tags read: 21600 × 10800 cells of 32-bit floats, deflated in tiles of 256.
    fetch:
      url: https://www.ngdc.noaa.gov/mgg/global/relief/ETOPO2022/data/60s/60s_surface_elev_gtif/ETOPO_2022_v1_60s_N90W180_surface.tif
