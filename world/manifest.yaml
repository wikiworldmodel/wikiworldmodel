    container: Zenodo
    doi: 10.5281/zenodo.18624542
    url: https://zenodo.org/records/18624542
    credit: Rivers wider than 30 m from GRWL (Allen & Pavelsky 2018)
    license: CC-BY-4.0
    license_note: The Zenodo record's licence is CC BY 4.0, read through its API.
    reliability: >-
      Rivers at least 30 m wide, mapped from Landsat images of months when rivers are commonly near their mean discharge:
      centrelines from one tributary junction to the next, each with the median of the widths measured along it. The
      authors find its widths most accurate where a river is wider than about three Landsat pixels, 90 m. The simplified
      product's lake flags are of lower quality than the full product's, and some are not whole numbers. 231 segments
      have no width.
    note: >-
      The full vector product, with a width every 30 m, is 3.1 GB and is not read; this is its summary, segment by
      segment. The record does not say what changed in V01.02 of this file; its metadata's one step of that date
      recomputes the segments' lengths.
    verified:
      by: machine:claude-code
      how: >-
        Licence, files and md5 from the Zenodo API; the md5 of the file downloaded matches. The fields' meanings from the
        record's description, and two segments' medians recomputed from a tile of the full product. The paper's methods
        read from the publisher's version kept by the University of North Carolina's Carolina Digital Repository.
    fetch:
      url: https://zenodo.org/api/records/18624542/files/GRWL_summaryStats_V01.02.zip/content
