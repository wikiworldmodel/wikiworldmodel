# External datasets. They are referenced, not copied: `npm run fetch` downloads each one
# from its pinned URL into .cache/ and checks it against the sha256 recorded here, and the
# build reads them from there. Changing a dataset means changing its entry (and its hash).
#
# Each dataset version is also a source (section 4.8), cited as its id: the fields above
# `fetch` are the source record, the ones under it say how the build gets the files.

# What a published build may include: datasets and database records with any other licence,
# or none, are refused. Cited publications contribute only facts and short quotes.
publish:
  licenses: [CC-BY-4.0, CC0-1.0, public-domain]

datasets:
  src:paleomap-plate-model:
    type: dataset
    kind: model
    title: PALEOMAP PaleoAtlas for GPlates and the PaleoData Plotter Program
    citation: >-
      Scotese, C.R. (2016). PALEOMAP PaleoAtlas for GPlates and the PaleoData Plotter Program.
      PALEOMAP Project. (Global plate model m15g60_v2d3, plate polygons ContOceanPolyv10u_v2d3.)
    authors:
      - "Scotese, C.R."
    published: 2016
    version: PALEOMAP PaleoAtlas for GPlates v3, rotation file dated 2016-02-01
    container: PALEOMAP Project
    url: http://www.earthbyte.org/paleomap-paleoatlas-for-gplates/
    credit: PALEOMAP plate model (Scotese 2016)
    license: CC-BY-4.0
    license_note: >-
      Stated by the rgplates package that redistributes these files. The upstream EarthByte
      page was not reachable when this entry was written; confirm upstream terms before
      publishing derived builds.
    reliability: >-
      A plate reconstruction model: positions in the past are model output, fitted by the
      author to paleomagnetic, geological and paleogeographic constraints. Its absolute
      reference frame (plate 0) is paleomagnetic.
    note: >-
      GPlates' plate-model-manager distributes the same atlas (Scotese_PaleoAtlas_2016_v3.zip)
      as Zenodo record 10596609; that record was not checked here.
    verified:
      by: machine:claude-code
      how: >-
        Citation as given in the GPlates web service model documentation; model and polygon
        version names from the header of PALEOMAP_PlateModel.rot.
    fetch:
      url: https://raw.githubusercontent.com/gplates/rgplates/4d62bba877ec383324dafd5a5ce6e057182b9eaa/inst/extdata/paleomap_v3.zip
      sha256: 5a3805a5eaa0218893f44363e76d9615b1a0a3a978abf9f0c31eb024ce01fcbb
      bytes: 967732
      format: zip
      files:
        rotations:
          path: PALEOMAP_PlateModel.rot
          sha256: d56846bb3c6260805d088171066bc18e9d54e831892b660fd31315260e288022
        polygons:
          path: PALEOMAP_PlatePolygons.gpml
          sha256: 4925c064a415cfa6e7fd3f5e0682585baa9908f01bee9e053ca5dea0b0dc57ca
      via: >-
        The copy shipped with the rgplates R package (gplates/rgplates, inst/extdata), which
        repackages the "PALEOMAP Global Plate Model" folder of Scotese_Paleoatlas_v3.zip.

  src:paleodem-v2:
    type: dataset
    kind: model
    title: PALEOMAP Paleodigital Elevation Models (PaleoDEMS) for the Phanerozoic
    citation: >-
      Scotese, C.R. & Wright, N. (2018). PALEOMAP Paleodigital Elevation Models (PaleoDEMS)
      for the Phanerozoic. PALEOMAP Project. Version 2. https://doi.org/10.5281/zenodo.5460860
    authors:
      - "Scotese, C.R."
      - "Wright, N."
    published: 2018
    version: v2 (Zenodo record 5460860), 1° grids, 0–540 Ma every 5 Myr
    container: PALEOMAP Project (Zenodo)
    doi: 10.5281/zenodo.5460860
    url: https://zenodo.org/records/5460860
    credit: PALEOMAP PaleoDEMs (Scotese & Wright 2018)
    license: CC-BY-4.0
    license_note: The upstream archive's License.txt states CC BY 4.0.
    reliability: >-
      A model reconstruction, not a measurement: elevations and depths estimated from
      paleogeographic maps (shorelines, mountains, basins) placed with the PALEOMAP plate
      model. 0 m is the paleo-shoreline.
    fetch:
      url: https://media.githubusercontent.com/media/visgl/deck.gl-data/0a873024cfc3fbb78d44027143013b8908fd8873/earth/paleogeography/v1/paleodem/paleodem.parquet
      sha256: 273da657c3edfb5802ea8ef1ace41f702c0da435f91a9e72710924f5e530f026
      bytes: 3111980
      format: parquet
      upstream:
        url: https://zenodo.org/records/5460860/files/PaleoDEMS_long_lat_elev_csv_v2.zip
        sha256: db43e6261411ff468c9030ca240778a73f224bf34bf8186c735477e41454c873
      via: >-
        visgl/deck.gl-data, earth/paleogeography/v1/paleodem: every node and value of the
        109 upstream CSV snapshots, converted to Parquet without resampling or correction.

  src:foster-2017-co2:
    type: dataset
    kind: compilation
    title: "Supplementary Data 2: a LOESS fit through the compiled CO₂ proxy estimates"
    citation: >-
      Foster, G.L., Royer, D.L. & Lunt, D.J. (2017). Future climate forcing potentially without
      precedent in the last 420 million years. Nature Communications 8, 14845. Supplementary
      Data 2.
    authors:
      - "Foster, G.L."
      - "Royer, D.L."
      - "Lunt, D.J."
    published: 2017
    version: Supplementary Data 2 of the article (sheet "LOESS Fit", 0–419.5 Ma every 0.5 Myr)
    container: Nature Communications 8, 14845
    doi: 10.1038/ncomms14845
    url: https://doi.org/10.1038/ncomms14845
    credit: Atmospheric CO₂ (Foster, Royer & Lunt 2017)
    license: CC-BY-4.0
    license_note: The article and its supplementary files are CC BY 4.0, per the article and its Crossref licence record.
    reliability: >-
      A fit through published proxy estimates of CO₂, not a measurement: its value is the fit's
      most likely value, with 68% and 95% intervals, on the GTS2012 time scale. The lower 95%
      bound is negative in places, so the 68% interval is the band shown.
    verified:
      by: machine:claude-code
      how: >-
        Citation, DOI and licence from Crossref; the sheet's columns read from the file itself
        (Age (Ma), pCO2 probability maximum, lw95%, lw68%, up68%, up95%; 840 rows).
    fetch:
      url: https://static-content.springer.com/esm/art%3A10.1038%2Fncomms14845/MediaObjects/41467_2017_BFncomms14845_MOESM2875_ESM.xlsx
      sha256: 84df255974cb77c95d298d324fb281fe2ac40a0696ea92598985816e7095c74c
      bytes: 79529
      format: xlsx

  src:vandermeer-2022-sea-level:
    type: dataset
    kind: model
    title: "Supplementary Table 1: Phanerozoic sea level, temperature and their inputs, 0–540 Ma"
    citation: >-
      van der Meer, D.G., Scotese, C.R., Mills, B.J.W., Sluijs, A., van den Berg van Saparoea,
      A.-P. & van de Weg, R.M.B. (2022). Long-term Phanerozoic global mean sea level: Insights
      from strontium isotope variations and estimates of continental glaciation. Gondwana
      Research 111, 103–121. Supplementary Table 1.
    authors:
      - "van der Meer, D.G."
      - "Scotese, C.R."
      - "Mills, B.J.W."
      - "Sluijs, A."
      - "van den Berg van Saparoea, A.-P."
      - "van de Weg, R.M.B."
    published: 2022
    version: Supplementary Table 1 of the article (sheet "SuppTable", 0–540 Ma every 1 Myr)
    container: Gondwana Research 111, 103–121
    doi: 10.1016/j.gr.2022.07.014
    url: https://doi.org/10.1016/j.gr.2022.07.014
    credit: Sea level and temperature (van der Meer et al. 2022; Scotese et al. 2021)
    license: CC-BY-4.0
    license_note: The version of record and its supplement are CC BY 4.0, per the article and its Crossref licence record.
    reliability: >-
      Model reconstructions, not measurements. Sea level comes from strontium isotopes and
      estimates of ice volume; its band combines tectonic and ice-volume uncertainty. The
      temperature column republishes the curve of Scotese et al. (2021, Earth-Science Reviews
      215, 103503), with a range from this study. Other reconstructions disagree with both by a
      wide margin in places.
    verified:
      by: machine:claude-code
      how: >-
        Citation, DOI and licence from Crossref; columns read from the file itself (A: Ma; K–M:
        GAT_degC AVG, MIN, MAX; AI–AK: TGE_SL_isocorr_m AVG, MIN, MAX; data from row 5).
    fetch:
      url: https://ars.els-cdn.com/content/image/1-s2.0-S1342937X22002192-mmc1.xlsx
      sha256: 800b34928378ae902426fc16ef002debfc064465f8ac663cbeeb7bd0c77c074f
      bytes: 263101
      format: xlsx

  src:cliopatria-0.2.1:
    type: dataset
    kind: compilation
    title: Cliopatria, a geospatial database of world-wide political entities from 3400 BCE to 2024 CE
    citation: >-
      Bennett, J.S., Mutch, E., Tollefson, A., Chalstrey, E., Benam, M., Cioni, E., Reddish, J.,
      Zsambok, J., Levine, J., Cook, C.J., Francois, P., Hoyer, D. & Turchin, P. (2025).
      Cliopatria - A geospatial database of world-wide political entities from 3400BCE to
      2024CE. Scientific Data 12, 247. Data version 0.2.1.
    authors:
      - "Bennett, J.S."
      - "Mutch, E."
      - "Tollefson, A."
      - "Chalstrey, E."
      - "Benam, M."
      - "Cioni, E."
      - "Reddish, J."
      - "Zsambok, J."
      - "Levine, J."
      - "Cook, C.J."
      - "Francois, P."
      - "Hoyer, D."
      - "Turchin, P."
    published: 2025
    version: v0.2.1 (cliopatria_polities_only_v021.geojson), GitHub commit 5f43337 of 3 October 2026
    container: Seshat Global History Databank (Scientific Data 12, 247)
    doi: 10.1038/s41597-025-04516-9
    url: https://github.com/Seshat-Global-History-Databank/cliopatria
    credit: Borders from Cliopatria (Bennett et al. 2025, Seshat)
    license: CC-BY-4.0
    license_note: The repository's LICENSE.md and the article (Europe PMC record) both state CC BY 4.0.
    reliability: >-
      Borders digitized from hand-coloured world maps drawn at sampled years (A. Tollefson's
      "508 World Maps"), revised against general atlases and regional histories. The article
      says the dataset "does not currently encode possible border uncertainty and territorial
      disputes": each row is one reading of a polity's extent, for the years it gives. Years
      are integers, negative for BCE; a row holds from FromYear to ToYear inclusive.
    note: >-
      The data splits Rome by its own names (Roman Kingdom, Roman Republic, Roman Empire,
      Eastern and Western Roman Empire, Byzantine Empire); records here say which rows are one
      entity. A few rows carry a year 0, which the BCE convention does not have; it is read as
      1 BCE.
    verified:
      by: machine:claude-code
      how: >-
        LICENSE.md and README.md read on GitHub at this commit; the article's full text read
        through Europe PMC (PMC11822181); the archive's rows for the Roman polities listed with
        their years, areas and Wikidata ids.
    fetch:
      url: https://raw.githubusercontent.com/Seshat-Global-History-Databank/cliopatria/5f433377139a6eeaeacbdc894b70f8805b72c8b5/cliopatria.geojson.zip
      sha256: e10a4e429fca708788ff9e7572a95fce801fae55852d217cffabc1c59cd4eed4
      bytes: 46005176
      format: zip
      files:
        polities:
          path: cliopatria_polities_only_v021.geojson
          sha256: fc6f0d1e4cc42f45da83522b3696db6f2cc85ec0d12259a85c89b31347b8fc0a

  src:ohm-rome-2026-11-01:
    type: dataset
    kind: compilation
    title: OpenHistoricalMap, the elements of antiquity around Rome
    citation: >-
      OpenHistoricalMap contributors. Elements dated before 600 CE within 41.82–41.96°N,
      12.38–12.60°E, and the river Tiber, as of 1 November 2026.
    version: Overpass export of 2026-11-01, kept in world/snapshots
    container: OpenHistoricalMap
    url: https://www.openhistoricalmap.org/
    credit: Rome's footprints from OpenHistoricalMap
    license: CC0-1.0
    license_note: >-
      The project's copyright page dedicates its data to the public domain under CC0 "except
      where otherwise noted", in license tags on individual elements. Elements with such a tag
      are left out of this snapshot (tools/world/src/ohm.ts).
    reliability: >-
      A community's tracing of old plans, many of them named in the elements' source tags
      (Lanciani's Forma Urbis, Platner and Ashby's plans, museum models, Wikimedia images). Most
      footprints are simplified, the dates are the mappers' and often round, and reconstructed
      buildings are mapped beside surviving ones with nothing to tell them apart. Records
      imported from it are proposals, and the record of a monument written by hand adopts its
      footprint and gives its own sources for the rest.
    note: >-
      The river's polygons carry no dates and appear to follow its course today, inside the
      embankments of the 1870s onwards. No stable URL serves an extract of a changing database,
      so the snapshot is kept in the repository until there is a blob store.
    verified:
      by: machine:claude-code
      how: >-
        Licence read on openhistoricalmap.org/copyright. Exported from
        overpass-api.openhistoricalmap.org with the query in the snapshot's own `query` field.
    import: { as: ohm-site, frame: "frame:paleomap/plate-307" }
    fetch:
      url: repo:world/snapshots/ohm-rome-2026-11-01.json
      sha256: 1b9fb1ba677e88a09035aeee16062f8d69c16da23925a56d66cfe5cce9e20131
      bytes: 379736
      format: json

  src:tinitaly-1.1-w46075:
    type: dataset
    kind: measurement
    title: TINITALY, a digital elevation model of Italy with a 10 metre cell size, tile w46075
    citation: >-
      Tarquini, S., Isola, I., Favalli, M., Battistini, A. & Dotta, G. (2023). TINITALY, a digital
      elevation model of Italy with a 10 meters cell size (Version 1.1). Istituto Nazionale di
      Geofisica e Vulcanologia (INGV). https://doi.org/10.13127/tinitaly/1.1
    authors:
      - "Tarquini, S."
      - "Isola, I."
      - "Favalli, M."
      - "Battistini, A."
      - "Dotta, G."
    published: 2023
    version: "1.1, tile w46075_s10: UTM 32N, 750–800 km east, 4600–4650 km north"
    container: INGV
    doi: 10.13127/tinitaly/1.1
    url: https://tinitaly.pi.ingv.it/
    credit: Ground from TINITALY 1.1 (Tarquini et al. 2023, INGV)
    license: CC-BY-4.0
    license_note: The download page states CC BY 4.0, with this citation.
    reliability: >-
      A triangulated model of today's bare ground, from contour lines and spot heights, so over
      central Rome it shows large flat facets and the modern street level, metres above the
      ancient ground in the valleys. The build smooths it and lowers the ground where records
      give its ancient level.
    verified:
      by: machine:claude-code
      how: Read the download page and the file's GeoTIFF tags; compared its heights with SRTM's at known places in Rome.
    fetch:
      url: https://tinitaly.pi.ingv.it/data_1.1/w46075_s10/w46075_s10.zip
