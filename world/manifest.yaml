      van der Meer, D.G., Scotese, C.R., Mills, B.J.W., Sluijs, A., van den Berg van Saparoea,
      A.-P. & van de Weg, R.M.B. (2022). Long-term Phanerozoic global mean sea level: Insights
      from strontium isotope variations and estimates of continental glaciation. Gondwana
      Research 111, 103–121. Supplementary Table 1.
    authors:
      - "van der Meer, D.G."
      - "Scotese, C.R."
      - "Mills, B.J.W."
      - "Sluijs, A."
      - "van den Berg van Saparoea, A.-P."
      - "van de Weg, R.M.B."
