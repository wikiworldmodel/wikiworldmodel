    title: "Modelski Ancient Period Data, as digitized and placed by Reba, Reitsma & Seto (2016)"
    citation: >-
      Reba, M., Reitsma, F. & Seto, K.C. (2016). Spatializing 6,000 years of global urbanization from 3700 BC to AD 2000.
      Scientific Data 3, 160034. The data: Modelski Ancient Period Data, figshare, doi:10.6084/m9.figshare.2059497,
