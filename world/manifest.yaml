        listing. Its rows were compared with NOAA's composite and methane table, read through Internet Archive captures
        because NCEI's servers did not answer from where this was written: all 1723 CO₂ rows older than 0.25 ka equal the
        composite to within rounding, and 2097 of 2268 methane rows equal Loulergue et al.'s (within 6 years), once 50
