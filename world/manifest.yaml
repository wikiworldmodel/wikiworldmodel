      format: csv

  src:jouzel-2007-epica-dome-c:
    type: dataset
    kind: measurement
    title: EPICA Dome C Ice Core 800KYr deuterium data and temperature estimates
    citation: >-
      Jouzel, J. & Masson-Delmotte, V. (2007). EPICA Dome C Ice Core 800KYr deuterium data and temperature estimates
      [dataset]. PANGAEA. Supplement to: Jouzel, J. et al. (2007). Orbital and millennial Antarctic climate variability
      over the past 800,000 years. Science 317, 793–796, doi:10.1126/science.1141038.
    authors:
      - "Jouzel, J."
      - "Masson-Delmotte, V."
