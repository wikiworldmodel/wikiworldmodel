  src:foster-2017-co2:
    type: dataset
    kind: compilation
    title: "Supplementary Data 2: a LOESS fit through the compiled CO₂ proxy estimates"
    citation: >-
      Foster, G.L., Royer, D.L. & Lunt, D.J. (2017). Future climate forcing potentially without
      precedent in the last 420 million years. Nature Communications 8, 14845. Supplementary
      Data 2.
    authors:
      - "Foster, G.L."
      - "Royer, D.L."
      - "Lunt, D.J."
    published: 2017
    version: Supplementary Data 2 of the article (sheet "LOESS Fit", 0–419.5 Ma every 0.5 Myr)
    container: Nature Communications 8, 14845
    doi: 10.1038/ncomms14845
    url: https://doi.org/10.1038/ncomms14845
    credit: Atmospheric CO₂ (Foster, Royer & Lunt 2017)
    license: CC-BY-4.0
    license_note: The article and its supplementary files are CC BY 4.0, per the article and its Crossref licence record.
    reliability: >-
      A fit through published proxy estimates of CO₂, not a measurement: its value is the fit's
      most likely value, with 68% and 95% intervals, on the GTS2012 time scale. The lower 95%
      bound is negative in places, so the 68% interval is the band shown.
    verified:
      by: machine:claude-code
      how: >-
        Citation, DOI and licence from Crossref; the sheet's columns read from the file itself
        (Age (Ma), pCO2 probability maximum, lw95%, lw68%, up68%, up95%; 840 rows).
    fetch:
      url: https://static-content.springer.com/esm/art%3A10.1038%2Fncomms14845/MediaObjects/41467_2017_BFncomms14845_MOESM2875_ESM.xlsx
      sha256: 84df255974cb77c95d298d324fb281fe2ac40a0696ea92598985816e7095c74c
      bytes: 79529
      format: xlsx

