          sha256: fc6f0d1e4cc42f45da83522b3696db6f2cc85ec0d12259a85c89b31347b8fc0a

  src:li-2022-phanerozoic-climate:
    type: dataset
    kind: model
    title: A high-resolution climate simulation dataset for the past 540 million years
    citation: >-
      Li, X., Hu, Y., Guo, J., Lan, J., Lin, Q., Bao, X., Yuan, S., Wei, M., Li, Z., Man, K., Yin, Z.,
      Han, J., Zhang, J., Zhu, C., Zhao, Z., Liu, Y., Yang, J. & Nie, J. (2022). A high-resolution
      climate simulation dataset for the past 540 million years. Scientific Data 9, 371. Data on
      Figshare, doi:10.6084/m9.figshare.19920662.v1.
    authors:
      - "Li, X."
      - "Hu, Y."
      - "Nie, J."
    published: 2022
    version: Figshare version 1, the file High_Resolution_Climate_Simulation_Dataset_540_Myr.nc
    container: Scientific Data 9, 371
    doi: 10.1038/s41597-022-01490-4
    url: https://doi.org/10.6084/m9.figshare.19920662.v1
    credit: Climate (Li et al. 2022)
    license: CC-BY-4.0
    license_note: Stated on the Figshare record, read through its API, and on the article, from Crossref.
    reliability: >-
      Fifty-five runs of a climate model (CESM 1.2.2, 0.9° × 1.25°), from 540 Ma to the pre-industrial,
      one every 10 Myr, on the PaleoDEMs of Scotese and Wright (2018), which the globe's elevation also
      comes from. Its CO₂ is whatever brings each run to a reconstructed global mean temperature. There
      are no prescribed ice sheets before the pre-industrial run, the soil is uniform loam, and the
      land starts as warm grassland in every run, so it is a climate, not a record of what grew.
    note: >-
      Temperatures are of the surface, not of the air. Chosen over the runs of Pohl et al. (2022,
      Zenodo 6620748, CC BY) for its finer grid and its present: at 0 Ma, those have Antarctica above
      10 °C in summer and Germany under 7 °C, by a slab-ocean model that says its last 80 Myr are likely
      too cold, and this has Antarctica frozen, the Amazon wet and Germany temperate.
    verified:
      by: machine:claude-code
      how: >-
        Licence and file read through the Figshare API; variables and their dimensions from the file's
        own header and the article's Data Records; the run's conditions from the article's Methods
        (Europe PMC full text). The classes of 17 places on the pre-industrial run were read and compared.
    fetch:
      url: https://ndownloader.figshare.com/files/35396138
      sha256: 611d9c9a2d486bb1e9f3e950b9d63d12a318b2fb634e422f7daa4158111bc274
      bytes: 754246176
      format: netcdf

  src:beyer-2020-late-quaternary:
    type: dataset
    kind: model
    title: Late Quaternary climate, bioclimate and vegetation
    citation: >-
      Beyer, R.M., Krapp, M. & Manica, A. (2020). High-resolution terrestrial climate, bioclimate and vegetation for the
      last 120,000 years. Scientific Data 7, 236. Data: Beyer, R., Krapp, M. & Manica, A. (2020). Late Quaternary climate,
      bioclimate and vegetation. Figshare, doi:10.6084/m9.figshare.12293345, version 4.
    authors:
      - "Beyer, R.M."
      - "Krapp, M."
      - "Manica, A."
    published: 2020
    version: Figshare version 4, the file LateQuaternary_Environment.nc (Late Quaternary Environment v1.0, written 23 April 2020)
    container: Scientific Data 7, 236
    doi: 10.1038/s41597-020-0552-1
    url: https://doi.org/10.6084/m9.figshare.12293345
    credit: Climate of the last 120,000 years (Beyer, Krapp & Manica 2020)
    license: CC-BY-4.0
    license_note: Stated on the Figshare record, read through its API, and on the article, from Crossref.
    reliability: >-
      Runs of a climate model, not measurements. Monthly climate of the HadCM3 model at 72 times, every 2,000 years from
      120,000 to 22,000 years ago and every 1,000 years after, each the average of 30 years of a run. These are brought to a
      finer grid with runs of a finer model (HadAM3H) for the last 21,000 years, chosen for each time by how near its CO₂
      was, and then corrected by the difference between the modern run and observed climate of 1901–1930, so the present is
      the observations by construction and every other time keeps the observations' local pattern. The land of each time
      comes from a sea-level stack and today's relief, with lakes below sea level kept. It has nothing south of 59.75°S, and
      so no Antarctica. The article finds it agrees with pollen and other reconstructions of the mid-Holocene, the Last
      Glacial Maximum and the Last Interglacial about as well as other models' snapshots do.
    note: >-
      Its extension to 800,000 years (Krapp et al. 2021, Scientific Data 8, 228; OSF 8n43x, CC BY 4.0) would cover the whole
      span of the sea-level stack, but its monthly temperature and precipitation are about 4 GB, against this file's 1.3 GB
      for every variable. The addendum of 2021 (doi:10.1038/s41597-021-01051-1) only adds monthly net primary production, in
      another file.
    verified:
      by: machine:claude-code
      how: >-
        Licence, files and their md5 from the Figshare API; the md5 of the file downloaded matches it. Citation and licence
        of the article from Crossref; its Methods and Data Records read in full through Europe PMC (PMC7360617), and its
        addendum (PMC8481252). Variables, units, dimensions and times read from the file itself.
    fetch:
      url: https://ndownloader.figshare.com/files/22659026
      sha256: 7312280854bab9e95f8721c80050c0889b29ad3087a00bd264e7500d33d19857
      bytes: 1333236636
      format: netcdf

  src:pbdb-hell-creek-2026-11-04:
    type: dataset
    kind: compilation
    title: The Paleobiology Database, the Hell Creek Formation
    citation: >-
      The Paleobiology Database. The occurrences and collections of the Hell Creek Formation, and the
      taxa they name with all their parents, read through the data service (data1.2) on 4 November 2026.
    version: Data service export of 2026-11-04, kept in world/snapshots
    container: The Paleobiology Database
    url: https://paleobiodb.org/
    credit: Hell Creek fossils from the Paleobiology Database
    license: CC0-1.0
    license_note: >-
      The data service's datainfo header, read on 4 November 2026, states "Data License: Creative
      Commons CC0" (https://creativecommons.org/publicdomain/zero/1.0/). Earlier downloads gave CC BY 4.0.
    reliability: >-
      A compilation of the literature by many contributors. Ages are those of the interval a collection is
      assigned to, most often the whole Late Maastrichtian or Lancian, so a row does not date a fossil
      finely. Some taxa are known only from teeth, leaves or pollen. First and last appearances are of the
      whole database, not of this formation. The primary references were not read here unless cited.
    note: >-
      A search by formation also finds names that contain it, such as Shell Creek: those are left out.
      No stable URL serves an extract of a changing database, so the snapshot is kept in the repository
      until there is a blob store. The query is in the snapshot's own `query` field.
    verified:
      by: machine:claude-code
      how: Exported from the data service with the queries in the snapshot, by `npm run world -- pbdb-snapshot`.
    import: { as: pbdb-formation, frame: "frame:paleomap/plate-101" }
    fetch:
      url: repo:world/snapshots/pbdb-hell-creek-2026-11-04.json
      sha256: 64c84fb4a83b276d1730f913b1ce0bb02d3bc7f8317bcb35383b7dffc2f00af7
      bytes: 961866
      format: json

  src:pbdb-land-2026-11-05:
    type: dataset
    kind: compilation
    title: The Paleobiology Database, the fossils of the land
    citation: >-
      The Paleobiology Database. Regular occurrences named to a genus or better, from terrestrial environments, 541 Ma to the
      present, and the taxa they name with all their parents, read through the data service (data1.2) on 5 November 2026.
    version: Data service export of 2026-11-05, kept in world/snapshots with the queries in its own `query` field
    container: The Paleobiology Database
    url: https://paleobiodb.org/
    credit: Fossils of the land from the Paleobiology Database
    license: CC0-1.0
    license_note: >-
      The data service's datainfo header, read on 5 November 2026, states "Data License: Creative Commons CC0"
      (https://creativecommons.org/publicdomain/zero/1.0/). Earlier downloads gave CC BY 4.0, and the panels credit it either way.
    reliability: >-
      A compilation of the literature by many contributors, with no claim to be complete: most places and times have no row. A
      row's age is that of the interval its collection is assigned to. Its classification is the database's own. Its coverage
      leans heavily to Europe and North America. Ichnotaxa and form taxa, such as most pollen, are left out by the query. The
      primary references were not read here.
    note: >-
      No stable URL serves an extract of a changing database, so the snapshot is kept in the repository until there is a blob
      store. It is by far the largest file there.
    verified:
      by: machine:claude-code
      how: Exported from the data service with the queries in the snapshot, by `npm run world -- pbdb-land`.
    import: { as: pbdb-land }
    fetch:
      url: repo:world/snapshots/pbdb-land-2026-11-05.json
      sha256: 3369bbcac3693211763ca953907dd9d891c5bf413d523b0b15ae000237d8a8a1
      bytes: 15393592
      format: json

  src:pbdb-sea-2026-11-06:
    type: dataset
    kind: compilation
    title: The Paleobiology Database, the fossils of the sea
    citation: >-
      The Paleobiology Database. Regular occurrences named to a genus or better, from marine environments, 541 Ma to the
      present, and the taxa they name with all their parents, read through the data service (data1.2) on 6 November 2026.
    version: Data service export of 2026-11-06, kept zipped in world/snapshots with the queries in its own `query` field
    container: The Paleobiology Database
    url: https://paleobiodb.org/
    credit: Fossils of the sea from the Paleobiology Database
    license: CC0-1.0
    license_note: >-
      The data service's datainfo header, read on 6 November 2026 with every span of the export, states "Data License:
      Creative Commons CC0" (https://creativecommons.org/publicdomain/zero/1.0/).
    reliability: >-
      A compilation of the literature by many contributors, with no claim to be complete: most places and times have no row.
      A row's age is that of the interval its collection is assigned to, and its classification is the database's own. Almost
      all of it is from the shelves and the seas over continents, since the ocean floor of most of the past has gone down the
      trenches, and it leans heavily to Europe and North America. Ichnotaxa and form taxa are left out by the query. The
      primary references were not read here.
    note: >-
      Asked for in eleven spans of time, as the service would not give all 1.47 million rows at once; an occurrence given for
      two spans is kept once. No stable URL serves an extract of a changing database, so the snapshot is kept in the
      repository, zipped, until there is a blob store. It is six times the land's in rows.
