    citation: >-
      Allen, G.H. & Pavelsky, T.M. (2018). Global extent of rivers and streams. Science 361(6402), 585,
      doi:10.1126/science.aat0636. Data: Allen, G.H. & Pavelsky, T.M., Global River Widths from Landsat (GRWL) Database,
      V01.01, Zenodo, doi:10.5281/zenodo.18624542, its summary statistics file of version V01.02.
