reliability: >-
  The website of a campaign to lend the bust to Egypt, so not disinterested, and it has slips (it dates
  the division of the finds to 20 January 1914). It is the only source read for several wartime moves;
  where it can be compared with the museum's account and the National Archives', it mostly agrees.
