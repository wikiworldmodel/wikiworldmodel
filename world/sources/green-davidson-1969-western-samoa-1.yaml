verified:
  by: machine:claude-code
  how: >-
    The Biodiversity Heritage Library's scan (part 299617), downloaded from its copy at Zenodo (record 16493521, whose MD5
    and SHA-256 for the PDF it matched), and its text layer read with pdftotext. The OCR marks a word broken at the end of
    a line with "¬"; the text was checked with those marks read as hyphens. Reports 1 and 3 read in the parts on house
    platforms and villages; pages from the printed page numbers, the contents from pp. v–vii. Quotes checked by script.
