reliability: >-
  A Greek rhetorician and historian at Rome under Augustus. For the founding he sets the
  reckonings of earlier writers side by side, Greek (Timaeus, Polybius) and Roman (Fabius
  Pictor, Cincius Alimentus, Cato), whose works are lost, and argues for his own, which puts
  the founding and the first consuls a year or two later than Varro's era. All of these were
  reckoned centuries after the events.
verified:
