  how: >-
    Book 1, 1.74–75 (vol. 1, pp. 245–251), and book 5, 5.1 (vol. 3, p. 3), read in Cary's
    translation on LacusCurtius, with Cary's notes converting the Olympiad years (813, 728,
    747, 751 and 750 B.C.; 507 B.C. for the first consuls). LacusCurtius marks both pages as
    not yet proofread. Fetched over plain HTTP; the site's TLS handshake failed from here.
