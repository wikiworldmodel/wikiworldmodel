reliability: >-
  A compilation with one row per living species, in which each value has its own source. Its lengths are the largest reported
  for the species. For lizards it holds no total length, only snout to vent, and for turtles the straight length of the shell.
  Many of its masses are worked out from length by allometry rather than weighed.
