type: text
kind: historian
citation: >-
  Cassius Dio, Roman History, vols. 7–9 (books 56–80, much of them surviving in the Byzantine
  epitomes of Xiphilinus and Zonaras), translated by E. Cary (Loeb Classical Library,
  1924–1927).
published: 1927
written: { lo: 200 CE, hi: 235 CE }
title: Roman History
url: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Cassius_Dio/home.html
via: LacusCurtius, which reproduces Cary's public-domain translation.
reliability: >-
  A Roman senator and consul, an eyewitness from Commodus to Severus Alexander, and for earlier
  reigns writing from earlier histories. He closes most reigns with a count of the years, months
  and days of the life and the rule, which later reigns chain together. From book 61 on the text
  is known chiefly from epitomes.
verified:
