  how: >-
    Books 56, 58–61, 63, 64, 66–74, 77, 79 and 80 read on LacusCurtius (most
    marked there as not yet proofread), and the quotations checked by script against that text.
    Cited by Cary's book and the chapter and section marked on the page; for the epitomes Cary's
    book numbers differ from Boissevain's. A separate record from src:cassius-dio-roman-history,
    which verifies only vol. 6.
note: >-
