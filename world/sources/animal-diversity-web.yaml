snapshot: 2026-11-05
title: Animal Diversity Web
url: https://animaldiversity.org/
license_note: >-
  Its text is under a share-alike, non-commercial licence, so it is only cited and quoted briefly.
reliability: >-
  Accounts written largely by students and reviewed by their instructors, drawing on standard works
  such as Walker's Mammals of the World. Cited where a length or a mass including the tail, or a
  statement for a whole family, could not be read in anything better. What its "length" measures
  differs from account to account, and is said in a claim's note when it matters.
