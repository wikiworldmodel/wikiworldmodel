reliability: >-
  A record book, giving no reference. It is the only statement of a griffinfly's body length that could be read: Cannell (2018) may
  have more, but the journal is behind a browser check that was not to be passed. Wikipedia's figure of almost 430 mm cites Mitchell
  & Lasswell (2005), whose pages 46 to 48, read on Google Books, give the wings but no body length. The number should be replaced
  from Carpenter's descriptions or a modern revision.
