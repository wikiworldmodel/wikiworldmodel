reliability: >-
  A general encyclopedia article, cited only for what the excavation reports read here do not say of the house: that it
  had no walls, the height of its eaves and its thatch. Its section on thatch cites Te Rangi Hiroa (Buck), Samoan Material
  Culture (1930), p. 22, and its section on construction ends with a citation of Te'o Tuvale, An Account of Samoan History
  up to 1918; its opening sentence on the walls cites nothing. Both works are on the New Zealand Electronic Text Collection, whose host refused
  the connection from here; they should replace this.
