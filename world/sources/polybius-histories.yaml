reliability: >-
  A Greek statesman and historian of the second century BCE who lived in Rome from 167 BCE. He
  dates the first treaty with Carthage, and with it the first consuls, by Greek chronology; he
  gives the treaty itself from its archaic Latin text, which he says could only be partly made
  out.
