via: LacusCurtius, which reproduces Rolfe's public-domain Loeb translation.
reliability: >-
  A soldier and historian of the fourth century, who says he saw the obelisks at Thebes himself. He
  tells at length how Constantine and Constantius moved the obelisk now at the Lateran, but the
  details of the hieroglyphic text he adds are unreliable, as the editor's notes say.
