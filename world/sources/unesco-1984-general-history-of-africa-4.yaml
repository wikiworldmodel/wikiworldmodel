reliability: >-
  The UNESCO general history, by specialists. Its chapters disagree with each other about Mansa
  Musa's dates, and so show the uncertainty: ch. 6 (Niane) has about 1307 to about 1337, with
  1307–32 in a figure, and ch. 9 (Izard) has 1312–37.
