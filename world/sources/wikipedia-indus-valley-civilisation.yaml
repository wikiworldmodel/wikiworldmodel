reliability: >-
  A general encyclopedia article, cited for the brick and the courtyards of Indus houses and for the span of the mature
  phase, because no peer-reviewed description of the houses could be read here. The span rests on Wright (2009), The Ancient
  Indus, p. 1; the list of the cities' features in the opening section, baked brick houses among them, carries a note citing
  Wright (2009), pp. 115–125; the paragraph on the houses and their courtyards ends with a note citing Lal (2002), pp. 93–95.
  Neither work could be read here, and either, or the excavators' accounts of Harappa and Mohenjo-daro, should replace it.
