reliability: >-
  A general encyclopedia article, cited for the four-room house's size, storeys and span because no better work could be
  read here. The size and the storeys are cited there to Clark, D.R. (2003), "Bricks, Sweat and Tears: The Human Investment
  in Constructing a 'Four-Room' House", Near Eastern Archaeology 66(1/2), 34–43, and the span to Bunimovitz, S. & Faust, A.
  (2003), "The Four Room House: Embodying Iron Age Israelite Society", Near Eastern Archaeology 66(1–2), 22–31. Neither could
  be reached, and either should replace this. The article flags two of its sentences, on standing houses and on the walls'
  thickness, as dubious.
