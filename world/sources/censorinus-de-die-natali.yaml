published: 1889
written: 238 CE
title: De die natali
url: https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Censorinus/text*.html
via: LacusCurtius, which reproduces Cholodniak's Latin text; it has no English translation.
reliability: >-
  A grammarian's treatise on time, written for a patron's birthday in the year it names as the
  consulship of Pius and Pontianus (238 CE). Its count of the years of the city is Varro's,
  made in the first century BCE, nearly seven centuries after the date it fixes; it also gives
  the day from which the years of the Augusti were counted.
