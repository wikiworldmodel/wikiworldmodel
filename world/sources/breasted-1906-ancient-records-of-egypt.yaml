reliability: >-
  The standard English collection of Egyptian historical inscriptions of its day. Its
  chronology, fixed by Meyer's reading of Sothic and lunar dates, runs about twenty years
  earlier than the one now conventional for the New Kingdom; the reign lengths it reads from the
  monuments still stand.
