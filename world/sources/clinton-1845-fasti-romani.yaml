reliability: >-
  An old but thorough year-by-year table of consuls and events that prints the ancient testimony
  for each date and argues between them. It predates the papyri and inscriptions that later
  settled some days.
verified:
  by: machine:claude-code
  how: >-
    Pp. 84 (a. 98), 148 (a. 161), 326 (a. 284) and 366 (a. 313) read in the page images of the
    scan (leaves n104, n166, n344 and n384); the OCR garbles them, so the quotations were
    compared with a transcription made from the images. Other entries consulted in the OCR only,
    and not cited.
