reliability: >-
  A general encyclopedia article, cited for the houses of Djenné because no better work could be read here. Its description of
  the town in 1828 is a block quotation of the explorer René Caillié, an eyewitness, from the English translation of his
  journey (Caillié, R., Travels through Central Africa to Timbuctoo, London: Colburn & Bentley, 1830), cited there to vol. 1
  p. 459; it is read here at second hand, as the book could not be reached. Its sentence on the flat-roofed two-storey
  courtyard houses is cited there to Maas, P. & Mommersteeg, G. (1992), p. 79; Bedaux, R., Diaby, B. & Maas, P. (2003),
  p. 19; and Marchand, T.H.J. (2009), pp. 88, 127 and 221. Its sentence that nearly all of the town's buildings are of
  sun-baked brick has no footnote.
