reliability: >-
  A general encyclopedia article, cited for the size, walls, rooms and stairs of the houses of the walled village because no
  better work could be read here. Those sentences are cited there to the excavation report, Peet, T.E. & Woolley, C.L. (1923),
  The City of Akhenaten I, pp. 55–65, and to Kemp, B.J. (1979), Journal of Egyptian Archaeology 65, 47–53; the report's copy
  online could not be reached, and it should replace this. The same paragraph gives the walled village's area as about 70
  square metres, which cannot be right for 72 houses of 5 by 10 metres; that figure is not used.
