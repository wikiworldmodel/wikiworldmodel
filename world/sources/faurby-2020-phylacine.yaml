reliability: >-
  A database of all mammal species of the last 130,000 years, living and recently extinct, with a
  mass for each: most from Smith et al. (2003) and other compilations, and some, marked in its
  Mass.Method column, imputed from relatives. Its masses are in grams. Each cited here is one
  row's value. The dataset is cited, and not imported into the build.
