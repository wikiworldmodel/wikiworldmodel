reliability: >-
  A general encyclopedia article, cited for the walls, roofs and plan of the four-room house and for the span of the domestic
  architecture it defines, because no better work could be read here. Its sections on walls, roofs and houses cite Avraham, A.
  (2018), "Ancient Building Techniques: A Brief Overview", in Farber, Z.I. & Wright, J.L. (eds.), Archaeology and History of
  Eighth-Century Judah (SBL Press), pp. 299–306, an open-access book whose host could not be reached; its section on casemate
  walls cites Shiloh, Y. (1987), Bulletin of the American Schools of Oriental Research 268, 3–15, and Garfinkel, Y. (2023),
  Jerusalem Journal of Archaeology 4, 87–107. Those works should replace this. The span in its opening sentence is cited to
  no work.
