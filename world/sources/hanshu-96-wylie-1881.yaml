title: Han shu, chapter 96 (Wylie's translation)
url: https://depts.washington.edu/silkroad/texts/hantxt1.html
via: Daniel Waugh's web edition for Silk Road Seattle, which condenses the translation and adds glosses in square brackets. Wylie's article itself was not read. Its old spellings are kept, so that Ching Keih is Zheng Ji.
reliability: The official history of the Former Han, and the first description of the two roads. Wylie's translation is old, and Hulsewé and Loewe's of 1979, the standard one, was not read.
