verified:
  by: machine:claude-code
  how: >-
    Humann's history of the undertaking (Geschichte der Unternehmung, pp. 8-34) read in the Internet
    Archive's OCR text of two scans (dieergebnisseder00conz and dieergebnisseder00conz_0). Both print
    "Am Montag den 9. September 1879" for the first day of the dig (p. 17); 9 September was a Monday in
    1878, and the narrative runs from 1878, so this looks like a misprint, and no quotation rests on it.
    Pages follow the running heads. Quotations checked by script with whitespace normalized and a hyphen
    at a line end read as joined.
