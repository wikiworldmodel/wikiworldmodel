reliability: >-
  A general encyclopedia article, cited for the Mesopotamian courtyard house's plan, materials and upper storey because no
  better work could be read here. Its section on houses rests on works of uneven weight, from handbooks (Postgate 1994, Early
  Mesopotamia; Bryce 2009, The Routledge Handbook of the Peoples and Places of Ancient Western Asia; Gates 2011, Ancient
  Cities) and a book on daily life (Nemet-Nejat 1998) to a news article in Science (Balter 1998), an online encyclopedia (Mark
  2018) and a book for children (Hunter 2015); the introduction of courtyards rests on Ur, J. (2014), "Households and the
  Emergence of Cities in Ancient Mesopotamia", Cambridge Archaeological Journal 24(2), 249–268. None could be read here.
  The excavated houses it names, at Ur and Nippur, are Old Babylonian, and what it says of earlier and later houses is
  general. Ur (2014) and Stone (1987), Nippur Neighborhoods, should replace it.
