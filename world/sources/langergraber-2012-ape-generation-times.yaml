  how: >-
    Abstract read via Europe PMC and Crossref: split times from generation times of wild
    chimpanzees and mountain gorillas and the human mutation rate per generation, independent of
    fossil calibration; the human–chimpanzee split is at least 7–8 million years old, and the
    population split between Neanderthals and modern humans 400,000–800,000 years ago. The
    Results, read on the PMC page (PMC3465451), put the human–chimpanzee split between 7 and 13
    million years, from the lowest and highest published human mutation rates and generation
    times of 25–29 years.
