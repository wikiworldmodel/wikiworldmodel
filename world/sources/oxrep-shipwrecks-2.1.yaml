published: 2017
title: OxREP Shipwrecks Database
url: https://oxrep.web.ox.ac.uk/shipwrecks-database
license_note: >-
  No license could be read: the site's copyright page answered 403 ("Access denied"). So it is not imported: single
  facts are cited with credit, by the wreck's id.
reliability: >-
  A compilation from Parker (1992) and the journals to 2009. Its introduction warns that "Latitude and longitudes are
  NOT to be taken as accurate" and that the date of a wreck "depends almost wholly on the analysis of any goods on
  board". Manning et al. (2022) fault its single-year date for Mazotos as a false precision.
