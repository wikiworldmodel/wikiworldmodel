reliability: >-
  A statistical analysis of a compilation of 22 Precambrian estimates, nearly all from other
  studies. The uncertainty column is not a measured standard deviation throughout: the authors
  follow Bao et al. (2022) in taking the difference between the mean of a unit's estimates and the
  one furthest from it, and some rows have none.
verified:
  by: machine:claude-code
  how: >-
    Read in full in the publisher's PDF (nature.com). Extended Data Table 1 is an image in that PDF:
    it was rendered at 220 dpi, read with Tesseract and corrected by eye, and its rows quoted here
    were checked by script against that transcription. Other quotes checked by script against the
    text of the PDF. The studies behind each row were not read unless a record cites them too.
