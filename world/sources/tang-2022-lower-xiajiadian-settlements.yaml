reliability: >-
  A synthesis of the excavation reports of 27 published Lower Xiajiadian sites, which are in Chinese and were not read here,
  with a Bayesian model of 43 published radiocarbon dates from 10 of them. What it says of the houses is general, with a few
  sites as examples. Its dates are modelled boundaries at 68.3% confidence, and the authors warn that only three stone-built
  sites have reliable dates, so the span of the stone settlements is the least certain part.
