reliability: >-
  A general encyclopedia article, cited only for what the houses of Great Zimbabwe were built of, because no better work could
  be read here. Its sentence on houses of thick daga rather than daga and poles is cited there to Beach, D., The Shona and
  Zimbabwe 900–1850 (1980), chapter "The Shona before 1450", p. 42; its sentence on houses of mud on wooden frames to Kim,
  N.C., Kusimba, C.M. & Keeley, L.H. (2015), Coercion and Warfare in the Rise of State Societies in Southern Zambezia, African
  Archaeological Review 32(1), 1–34. Neither could be reached; they should replace this.
