reliability: >-
  A statistical study of the sizes of 1,852 buildings, houses for the most part, at 80 archaeological sites of Southwest Asia,
  as published by their excavators. It is cited here for two estimates
  of the number of people in a Mesopotamian household, which it takes from texts as read by Tenney (2011) for Kassite Nippur
  and Donbaz & Yoffee (1986) for Old Babylonian Kish, neither of them read here, and for its summary of how the people of
  southern Mesopotamia gathered into cities in the Bronze Age.
