reliability: >-
  A general encyclopedia article, tagged as needing more citations, cited for the houses' storeys, courtyards and brick and
  for the walls round the cities, because no better work could be read here. Its sentence on the storeys and the courtyard
  is a quotation it attributes to Miller, D., "Ideology and the Harappan Civilization", Journal of Anthropological
  Archaeology 4, 34–71, and to an online encyclopedia, World History Encyclopedia; its paragraph on the city walls cites
  Khan Academy and World History Encyclopedia; its sentence on the brick of Mohenjo-daro has no footnote of its own. None
  of these could be read here; Miller's article should replace it.
