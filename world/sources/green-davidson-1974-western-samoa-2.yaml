verified:
  by: machine:claude-code
  how: >-
    The Biodiversity Heritage Library's scan (part 299618), downloaded from its copy at Zenodo (record 16497473, whose MD5
    and SHA-256 for the PDF it matched), and its text layer read with pdftotext. The OCR marks a word broken at the end of
    a line with "¬"; the text was checked with those marks read as hyphens. Reports 21, 30 and 39 read in their sections
    on houses, chronology and settlement; pages from the printed page numbers, the reports' spans from the contents.
    Quotes checked by script. Table 1 of Report 21 and Table 27 of Report 39, on house sizes, are images the text layer
    does not hold, and were not read.
