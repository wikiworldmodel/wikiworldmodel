description: >-
  A clam of the sea: two like, rounded valves, ribbed, hinged along the top under a pair of beaks, the shell standing on its lower
  edge on the sea floor or half buried in it. It stands for the bivalves of the sea, burrowing, lying and attached alike. Its
  length is the shell's greatest dimension.
