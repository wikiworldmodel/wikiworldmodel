description: >-
  A plesiosaur: a marine reptile with a broad, flattened, stiff body, four long wing-like flippers it rowed and flew with
  underwater, a short tail, and a long neck carrying a small head with long sharp teeth. It swims. Its length is from the snout
  to the end of the tail.
