description: >-
  A sea lily: a long jointed stalk rooted on the sea floor, a small cup on top holding the body, and arms branching from the cup,
  spread like an open funnel to sieve food from the current. It stands for the other stalked echinoderms too. Its length is the
  whole animal's height, from the root to the tips of the arms.
kind: animal
hip: 0.5
mass_length: 1.5
