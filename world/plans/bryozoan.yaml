description: >-
  A bryozoan colony of the branching kind: a small stony bush of blunt twigs on the sea floor, each twig made of thousands of tiny
  tubes, each tube the home of one feeding zooid. It stands for the colonies of every shape, fans, sheets and crusts too. Its
  length is the colony's height.
