description: >-
  A trilobite: a low oval shield over the back, a broad head shield with a raised middle and two crescent eyes, a thorax of
  hinged segments and a tail shield, each divided lengthwise into three lobes, with spines at the head's back corners, and many
  like legs and a pair of antennae beneath. Its length is the shield's, from the front of the head to the end of the tail.
