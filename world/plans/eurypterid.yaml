description: >-
  A eurypterid or sea scorpion: a rounded head shield with a pair of eyes, a long body of twelve segments, broad in front and
  narrowing behind to a long spike, a pair of broad paddles behind the head to swim with, and walking legs beneath. Its length is
  from the front of the head to the end of the spike.
