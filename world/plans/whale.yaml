description: >-
  A whale: a long, smooth, streamlined body tapering to a narrow tail stock, a broad flat fluke spread sideways at its end, a pair
  of flippers behind the head, a small fin on the back, and a long head with the blowhole on top. It swims. Its length is from
  the tip of the snout to the notch of the fluke.
