description: >-
  A brachiopod: a shell of two unequal valves, one over the other, the lower with a beak that curls up over the hinge at the
  back and a short fleshy stalk coming out of it to hold on to the bottom; it lies on the sea floor with the front edge, where
  it gapes to feed, forward. Its length is the shell's greatest dimension, as sources give it.
