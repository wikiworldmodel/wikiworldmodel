description: >-
  An ichthyosaur: a marine reptile shaped like a dolphin or a tuna, with a long, narrow, toothed snout, very large eyes, a
  triangular fin on the back, two pairs of flippers, the front ones larger, and a tall crescent tail fin standing upright, its
  backbone bending down into the lower lobe. It swims. Its length is from the tip of the snout to the end of the tail.
