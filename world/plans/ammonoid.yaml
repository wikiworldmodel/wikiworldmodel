description: >-
  A shelled cephalopod coiled in one plane, as an ammonite or a nautilus: a ribbed shell coiled flat, its whorls each about twice
  the size of the one before, the animal living in the last of its chambers and putting out a head with large eyes and a ring of
  arms from the opening, low at the front. It swims. Its length is the shell's diameter.
