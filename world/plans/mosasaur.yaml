description: >-
  A mosasaur: a great marine lizard with a long, barrel-chested body, a long head with powerful toothed jaws, four small paddle
  flippers, and a long tail, deep and flattened sideways, ending in a crescent fin whose lower lobe carries the tail's bones. It
  swims. Its length is from the snout to the end of the tail.
