        canopy: [0.2, 0.16, 0.125, 0.34, 0.28, 0.22]
        distant: [0.34, 0.28, 0.22, 0.42, 0.34, 0.27]
  plants:
    step: 8
    trees: 84
    far_share: 0.12
    under_step: 3
    under: 420
    mat_step: 14
    mats: 42
  animals:
    # Damuth's rule, for a species of plant-eating mammals: log10 D = 4.23 − 0.75 log10 M, in grams and km².
    density: 95
    show: 12
    predators: 0.05
    most_in_cell: 3
    near_radius: 340
    front_length: 1.2
