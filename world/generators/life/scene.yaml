id: gen:life/scene
type: generator
title: A living scene of any place, on land or in the sea
version: 5
code: generators/life/scene/v5.ts
runs_in: [build, client]
outputs: { basis: procedural }
# What it reads from the world: who may stand where and how big each grew, the ground and the climate
# of the time, and, for the Hell Creek's slot, the formation's own fossils and record.
inputs:
  - { ref: field:life/community, note: "who may stand at a place and a time, and how sure" }
  - { ref: field:life/community-sea, note: "who may live at a place in the sea and a time, and how sure: the genera it can draw" }
  - { ref: field:earth/elevation, note: "the ground, at the field's heights" }
  - { ref: field:earth/relief, note: "today's ground, for the glacial cycles" }
  - { ref: field:earth/rivers, note: "where the drainage routes rivers, how much they carry, and the laws their channels are drawn by" }
  - { ref: field:earth/river-widths, note: "where rivers wider than 30 m were seen, and how wide" }
  - { ref: field:earth/coastline, note: "where the water is" }
  - { ref: field:earth/climate, note: "the cover and the tones of the place, where no finer climate covers its time" }
  - { ref: field:earth/climate-late-quaternary, note: "the cover and the tones of the place in the last 120,000 years" }
  - { ref: field:earth/climate-at-height, note: "what grows at each height of the scene, and where snow lies in its month" }
  - { ref: field:earth/runoff, note: "the water balance's rules, by which snow lies" }
  - { ref: field:earth/biome, note: "the thresholds that class the climate" }
  - { prop: cover, note: "no forest or grass before the transitions allow it" }
  - { prop: body_plan, note: "each taxon's body" }
  - { prop: body_form, note: "each taxon's body" }
  - { prop: body_length, note: "how big each is drawn" }
  - { prop: hip_height, note: "how big each is drawn" }
  - { prop: plant_height, note: "how big each is drawn" }
  - { prop: body_mass, note: "how big each is drawn, and how many" }
  - { ref: src:pbdb-hell-creek-2026-11-04, note: "the Hell Creek slot: its taxa" }
  - { ref: life/hell-creek/ecosystem, note: "the Hell Creek slot: where it was, and on which plate" }
# What it makes, held in aggregate to what it samples (docs/STRUCTURE.md section 3.4).
checks:
  - { test: world/generators/life/scene/v5.test.ts, holds: "is only the taxa it is given, each near the arrival at least once" }
  - { test: world/generators/life/scene/v5.test.ts, holds: "draws each taxon as often as the atlas's weight and the density rule say, in aggregate, below a cell's cap" }
  - { test: world/generators/life/scene/v5.test.ts, holds: "has no forest before forests, only the few set by the arrival" }
  - { test: world/generators/life/scene/v5.test.ts, holds: "has bare ground and no low plants at all before land plants" }
  - { test: world/generators/life/scene/v5.test.ts, holds: "has a desert mostly bare, with no forest" }
  - { test: world/generators/life/scene/v5.test.ts, holds: "grows what the climate of each height bears: forest below the treeline, none above it" }
  - { test: world/generators/life/scene/v5.test.ts, holds: "lays snow down to where the month holds it: low in winter, high or not at all in summer" }
  - { test: world/generators/life/rivers.test.ts, holds: "winds by the sine-generated curve, as long as its sinuosity says" }
  - { test: world/generators/life/rivers.test.ts, holds: "draws its channel by the laws, and braids, winds or runs straight as its slope and flow say" }
  - { test: world/generators/life/scene/v5.test.ts, holds: "runs its rivers where the world says, with the water falling downstream" }
  - { test: world/generators/life/scene/v5.test.ts, holds: "puts what lives on the sea floor on it, and what swims in the water over it, never on land" }
  - { test: world/generators/life/rivers.test.ts, holds: "brings a river that runs into another to the other's water, and draws it only to the other's bank" }
limits:
  - with: field:life/community
    note: >-
      Small animals reach the most a cell holds (params.animals.most_in_cell), and past it the atlas's weight no
      longer sets how many are drawn: two small mammals the atlas weighs nine to one come out about as many.
  - with: field:life/community-sea
    note: >-
      How many of each kind live on a sea's floor follows the land's density rule, which no work gives for the sea: a
      bed of brachiopods or a reef is far denser than a herd. What swims is kept near the floor, where a visitor looks.
slots:
  hell-creek:
    place: The floodplain of the Hell Creek, at the slice its scene describes
    seed: life/hell-creek
# Nothing below is a claim about any place or animal. The numbers say how this generator lays out the
# land and what lives on it: how wide a river is drawn, what colours a climate is given, how many more
# animals are shown than a census would see. Which taxa, and how big they grew, come from the records; how
# each kind of body keeps comes from its form.
params:
  site:
    id: hell-creek
    label: the Hell Creek
    ecosystem: life/hell-creek/ecosystem
    snapshot: src:pbdb-hell-creek-2026-11-04
    # About the middle of the formation's time.
    slice: 66.5 Ma
    window: [68 Ma, 65 Ma]
    # Towards the seaway, on the globe's reconstruction, in degrees of bearing as radians. Elsewhere a river runs downhill.
    flow: 1.75
  ground:
    width: 86
    depth: 5.5
    wavelength: 1500
    swing: 1.25
    bank: [10, 70]
    rise: 2.6
    roughness: 0.8
    size: 420
    levee: [0.9, 70]
    oxbows: 18
    oxbow_radius: [170, 420]
    oxbow_width: 54
    ponds: 26
    pond_radius: [30, 120]
    blend: [20000, 34000]
    lowest_water: 12
    sea_below: 12
    rugged: 0.7
    swell: 0.004
    coast: 90
  cover:
    patch: 640
    glade: 0.41
    clearing: 150
    bare: 0.62
    climates:
      rainforest: { forest: 1, herb: 0.95, bare: 0, river: 1, tones: rainforest }
      savanna: { forest: 0.45, herb: 0.9, bare: 0.1, river: 0.7, tones: savanna }
      temperate: { forest: 0.95, herb: 0.9, bare: 0, river: 1, tones: plain }
      cold: { forest: 0.8, herb: 0.85, bare: 0, river: 1, tones: plain }
      steppe: { forest: 0.15, herb: 0.75, bare: 0.35, river: 0.35, tones: steppe }
      desert: { forest: 0, herb: 0.12, bare: 0.92, river: 0.05, dunes: 7, tones: desert }
      tundra: { forest: 0, herb: 0.6, bare: 0.35, river: 0.6, tones: tundra }
      ice: { forest: 0, herb: 0, bare: 1, river: 0, tones: ice }
    # Soil, low plants, bare ground, canopy and low plants from afar, each from one tone to another, and the water's
    # shallows and depths; and the same again for a land before plants, which has none of them. Nobody recorded these
    # colours: a tropical river is drawn brown with silt, a cold one clear, a glacier's milky.
    tones:
      plain:
        soil: [0.085, 0.066, 0.045, 0.17, 0.13, 0.08]
        herb: [0.05, 0.09, 0.03, 0.125, 0.165, 0.052]
        bare: [0.40, 0.355, 0.26, 0.27, 0.23, 0.165]
        canopy: [0.03, 0.062, 0.026, 0.07, 0.11, 0.04]
        distant: [0.085, 0.125, 0.05, 0.135, 0.165, 0.065]
        water: [0.16, 0.17, 0.11, 0.05, 0.08, 0.07]
      rainforest:
        soil: [0.075, 0.05, 0.035, 0.15, 0.1, 0.06]
        herb: [0.035, 0.095, 0.03, 0.09, 0.17, 0.05]
        bare: [0.36, 0.26, 0.19, 0.25, 0.17, 0.12]
        canopy: [0.018, 0.058, 0.022, 0.045, 0.105, 0.035]
        distant: [0.05, 0.115, 0.04, 0.09, 0.15, 0.055]
        water: [0.26, 0.19, 0.11, 0.11, 0.08, 0.05]
      savanna:
        soil: [0.16, 0.115, 0.07, 0.28, 0.2, 0.12]
        herb: [0.2, 0.19, 0.075, 0.33, 0.3, 0.12]
        bare: [0.5, 0.39, 0.25, 0.36, 0.26, 0.16]
        canopy: [0.05, 0.08, 0.03, 0.11, 0.14, 0.05]
        distant: [0.24, 0.23, 0.1, 0.33, 0.3, 0.14]
        water: [0.3, 0.24, 0.15, 0.14, 0.11, 0.07]
      steppe:
        soil: [0.2, 0.165, 0.11, 0.32, 0.26, 0.17]
        herb: [0.23, 0.22, 0.11, 0.38, 0.35, 0.18]
        bare: [0.52, 0.44, 0.32, 0.38, 0.31, 0.21]
        canopy: [0.06, 0.08, 0.04, 0.12, 0.14, 0.06]
        distant: [0.3, 0.28, 0.15, 0.4, 0.36, 0.2]
        water: [0.24, 0.22, 0.15, 0.1, 0.11, 0.08]
      desert:
        soil: [0.46, 0.36, 0.24, 0.62, 0.5, 0.33]
        herb: [0.26, 0.24, 0.13, 0.36, 0.33, 0.17]
        bare: [0.74, 0.6, 0.4, 0.56, 0.42, 0.27]
        canopy: [0.08, 0.1, 0.05, 0.14, 0.16, 0.07]
        distant: [0.5, 0.42, 0.27, 0.62, 0.5, 0.33]
        water: [0.32, 0.27, 0.18, 0.14, 0.12, 0.08]
      tundra:
        soil: [0.11, 0.1, 0.075, 0.2, 0.18, 0.13]
        herb: [0.13, 0.15, 0.08, 0.23, 0.23, 0.13]
        bare: [0.42, 0.41, 0.37, 0.28, 0.27, 0.24]
        canopy: [0.05, 0.07, 0.04, 0.1, 0.12, 0.06]
        distant: [0.2, 0.21, 0.13, 0.28, 0.28, 0.18]
        water: [0.12, 0.17, 0.17, 0.03, 0.08, 0.1]
      ice:
        soil: [0.8, 0.84, 0.88, 0.9, 0.93, 0.96]
        herb: [0.8, 0.84, 0.88, 0.9, 0.93, 0.96]
        bare: [0.88, 0.91, 0.95, 0.78, 0.83, 0.9]
        canopy: [0.8, 0.84, 0.88, 0.9, 0.93, 0.96]
        distant: [0.8, 0.84, 0.88, 0.9, 0.93, 0.96]
        water: [0.55, 0.65, 0.68, 0.2, 0.32, 0.38]
      barren:
        soil: [0.2, 0.16, 0.125, 0.34, 0.28, 0.22]
        herb: [0.2, 0.16, 0.125, 0.34, 0.28, 0.22]
        bare: [0.42, 0.34, 0.27, 0.27, 0.21, 0.17]
        canopy: [0.2, 0.16, 0.125, 0.34, 0.28, 0.22]
        distant: [0.34, 0.28, 0.22, 0.42, 0.34, 0.27]
        water: [0.26, 0.22, 0.17, 0.11, 0.1, 0.08]
  plants:
    step: 8
    trees: 84
    far_share: 0.12
    under_step: 3
    under: 420
    mat_step: 14
    mats: 42
  animals:
    # Damuth's rule, for a species of plant-eating mammals: log10 D = 4.23 − 0.75 log10 M, in grams and km².
    density: 95
    show: 12
    predators: 0.05
    most_in_cell: 3
    near_radius: 340
    front_length: 1.2
    small_m: 0.6
    mass_length: 20
    defaults: { group: [1, 3], habitat: any, poses: [stand, walk, alert] }
  # How the climate is brought to a scene's heights (field:earth/climate-at-height), where the world gives one: what
  # grows at a height is what its class bears, the edge between two classes wandering over the height that 1.5 °C of
  # cooling makes; snow is drawn where at least 10 mm of water lies as snow in a month colder than the water balance's
  # threshold for rain, thickening over 200 m of height above that line and slipping off slopes steeper than 0.55; and
  # heights are read every 10 m.
  climate:
    band_c: 1.5
    snow_mm: 10
    snow_band_m: 200
    snow_slope: 0.55
    step_m: 10
  # How a river the world gives is drawn: its channel's laws come with it (field:earth/rivers), and these are how
  # the rest is invented. Points of a course at least 8 m apart and a quarter of its width; bends wound in where their
  # wavelength is less than three spacings of the course's points; a river falling more than 1 in 50 is a mountain
  # stream; a floodplain reaching six widths beyond the bends and valley walls 1.5 km wide; a braided bed four widths
  # wide; two older courses, half of whose cut-off loops are left as oxbows, cut where a neck narrows to 1.5 widths
  # and swung to 0.93 of the most a bend can; each bend up to a quarter bigger or smaller; a little squaring of its apex;
  # and its water's height smoothed over 2 km, as the ground under it is a tenth of a degree's.
  # The sea, where a place lies in it: what swims is drawn at most this far above the floor, in metres, so that a visitor
  # at the floor sees it; the sea's whole depth is no claim about where anything swam.
  sea:
    swim_m: 40
  rivers:
    step: [8, 4]
    detail: 3
    steep: 0.02
    floodplain: 6
    wall: 1500
    braid_bed: 4
    older: 2
    oxbow_share: 0.5
    neck: 1.5
    cutoff_swing: 0.93
    vary: 0.25
    skew: 0.12
    smooth: 2000
  reach: { full: 2500, near: 350 }
  view:
    range: 74
    turn: 0.3
    tilt: 81
